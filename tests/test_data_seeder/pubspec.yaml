name: test_data_seeder
description: Standalone database seeder for Minglit integration tests.
version: 0.0.1
resolution: workspace
publish_to: 'none'

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.12.0
  uuid: ^4.5.2
  # Add minglit_kit for shared models if needed
  minglit_kit:
    path: ../../shared/packages/minglit_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/seed_data.json