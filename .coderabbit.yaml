language: ko-KR
reviews:
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - dev
  profile: chill
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  sequence_diagrams: true
  assess_linked_issues: true
  poem: false
  collapse_walkthrough: false
  path_filters:
    - "!**/*.g.dart"
    - "!**/*.freezed.dart"
    - "!**/pubspec.lock"
    - "!**/.sisyphus/**"
    - "!**/minglit_env/**"
    - "!docs/**"
    - "!scripts/**"
    - "!**/*.png"
    - "!**/*.svg"
    - "!**/assets/**"
    - "!.omc/**"
    - "!coverage/**"
    - "!**/launchd/**/*.plist"
  path_instructions:
    - path: "**/*.dart"
      instructions: |
        Flutter/Dart 코드 리뷰 기준:
        - MinglitColors, MinglitSpacing, MinglitRadius 등 디자인 토큰 사용 확인. Colors.xxx, EdgeInsets 직접 사용 금지.
        - Riverpod provider는 반드시 ref.watch/ref.read 패턴 사용. setState 금지.
        - Coordinator 패턴: 화면 간 네비게이션은 Coordinator를 통해서만. 위젯에서 직접 GoRouter 호출 금지.
        - Repository 패턴: UI에서 Supabase 직접 호출 금지. 반드시 Repository를 통해 접근.
        - AsyncValue 사용 시 loading/error/data 3가지 상태 모두 처리 확인.
        - dynamic 캐스팅 및 // ignore: 주석 사용 최소화.

        자동화 테스트 리뷰 기준:
        - 새 Repository 추가/변경 시 대응하는 테스트 파일이 minglit_kit/test/src/data/repositories/ 에 존재하는지 확인. 없으면 "⚠️ 테스트 누락: {파일명}에 대한 단위 테스트가 필요합니다" 코멘트.
        - 새 Controller/Provider 추가 시 대응하는 테스트 파일이 apps/{app}/test/src/features/{feature}/logic/ 에 존재하는지 확인. 없으면 "⚠️ 테스트 누락: {파일명}에 대한 Controller 테스트가 필요합니다" 코멘트.
        - 버그 수정(fix) PR에 해당 버그를 재현하는 테스트가 포함되어 있는지 확인. 없으면 "⚠️ 회귀 테스트 누락: 이 버그를 재현하는 테스트를 추가하세요" 코멘트.
        - 테스트 작성 패턴은 docs/AUTOMATION_TEST_GUIDE.md 참조.
    - path: "supabase/migrations/**"
      instructions: |
        Supabase Migration 리뷰 기준:
        - 새 테이블에는 반드시 RLS enable + 정책 추가 확인.
        - 외래키에 인덱스 존재 확인 (FK without index = 성능 문제).
        - migration 파일명 형식: YYYYMMDDNNNNNN (날짜 + 순번).
        - DROP TABLE, DROP COLUMN 등 파괴적 변경은 별도 migration으로 분리.
        - GRANT 권한 설정 확인 (anon, authenticated, service_role).
        - 새 테이블/RLS 정책 추가 시 supabase/tests/database/ 에 대응하는 pgTAP 테스트가 포함되어 있는지 확인. 없으면 "⚠️ DB 테스트 누락: 새 테이블/RLS 정책에 대한 pgTAP 테스트를 추가하세요" 코멘트.
    - path: "supabase/functions/**"
      instructions: |
        Supabase Edge Function 리뷰 기준:
        - 환경 변수를 Deno.env.get()으로 읽는지 확인. 하드코딩된 시크릿 금지.
        - 에러 핸들링: try/catch로 감싸고, 적절한 HTTP status code 반환.
        - CORS 헤더 설정 확인.
        - 입력 검증 (request body validation) 확인.
        - 새 Edge Function 추가 시 같은 디렉토리에 {function_name}_test.ts 파일이 포함되어 있는지 확인. 없으면 "⚠️ Edge Function 테스트 누락: Deno 테스트를 추가하세요" 코멘트.
    - path: ".github/workflows/**"
      instructions: |
        GitHub Actions 리뷰 기준:
        - Action 버전은 SHA pin 또는 버전 태그 사용. @master, @main 금지.
        - secrets를 workflow_call inputs로 전달하지 않는지 확인.
        - concurrency group이 적절히 설정되어 있는지 확인.
    - path: "apps/app_user/**"
      instructions: |
        유저 앱 리뷰 시 docs/architecture/client.md의 Feature-first 구조를 따르는지 확인.
        features/{feature}/ui/, logic/, widgets/ 디렉토리 구조 준수.
    - path: "apps/app_partner/**"
      instructions: |
        파트너 앱 리뷰 시 docs/architecture/client.md의 Feature-first 구조를 따르는지 확인.
        features/{feature}/ui/, logic/, widgets/ 디렉토리 구조 준수.
  labeling_instructions:
    - label: "bug"
      instructions: "버그 수정 PR에 적용. fix( 또는 hotfix로 시작하는 커밋."
    - label: "feature"
      instructions: "새 기능 추가 PR에 적용. feat(로 시작하는 커밋."
    - label: "refactor"
      instructions: "리팩토링 PR에 적용. refactor(로 시작하는 커밋."
    - label: "ci"
      instructions: "CI/CD 변경 PR에 적용. ci( 또는 chore(ci 커밋."
    - label: "docs"
      instructions: "문서 변경 PR에 적용. docs( 커밋."
    - label: "db-migration"
      instructions: "supabase/migrations/ 파일이 포함된 PR에 적용."
  auto_apply_labels: true
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: true
  tools:
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true
  pre_merge_checks:
    title:
      mode: warning
      requirements: "Conventional Commits 형식 필수: type(scope): description. type은 feat/fix/refactor/docs/ci/chore/perf/test 중 하나."
chat:
  auto_reply: true
knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
