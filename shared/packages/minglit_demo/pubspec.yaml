name: minglit_demo
description: >-
  Demo flavor infrastructure for app_user and app_partner. Provides in-memory
  fixtures + ProviderScope overrides so the apps boot with zero server
  connection. Shared by mds-emulator-render tests and the demo flavor entry
  points (main_demo.dart).
version: 26.05.2562-dev
publish_to: 'none'
resolution: workspace

environment:
  sdk: ^3.11.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  # `Override` type is only reachable via the riverpod internals barrel
  # (flutter_riverpod's public barrel doesn't export it). We import it
  # explicitly to type the override list returns. Declared here so the
  # depend_on_referenced_packages lint passes.
  riverpod: ^3.1.0
  minglit_kit:
    path: ../minglit_kit
  # supabase_flutter is required for the User / SupabaseClient types only.
  # CRITICAL: this package MUST NOT call Supabase.initialize() — that would
  # break the "zero network" invariant. PoisonSupabaseClient is the only
  # SupabaseClient instance the demo ever holds. See architecture.md
  # "Dependency Rules" — type import is permitted, SDK activation is not.
  supabase_flutter: ^2.12.0
  # Required for XFile type used in StorageRepository override.
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
