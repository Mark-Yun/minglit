name: minglit_kit
description: "A new Flutter package project."
version: 26.03.483-dev
resolution: workspace
publish_to: 'none'
environment:
  sdk: ^3.10.4

dependencies:
  async: ^2.13.0
  battery_plus: ^6.0.1
  connectivity_plus: ^6.1.3
  crypto: ^3.0.5
  cryptography: ^2.9.0
  device_info_plus: ^11.3.3
  dio: ^5.9.0
  file_picker: ^10.3.8
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_local_notifications: ^19.5.0
  flutter_quill: ^11.5.0
  flutter_riverpod: ^3.0.3
  flutter_svg: ^2.2.2
  freezed_annotation: ^3.1.0
  geolocator: ^13.0.2
  go_router: ^17.0.0
  google_sign_in: 6.2.1
  image_picker: ^1.2.1
  intl: ^0.20.2
  js: ^0.7.2
  json_annotation: ^4.9.0
  kakao_map_plugin: ^0.3.7
  logger: ^2.6.2
  # Payment & Identification (Iamport V1)
  minglit_iamport_v1:
    path: ../minglit_iamport_v1
  package_info_plus: ^8.0.0
  path: ^1.9.1

  # Other dependencies
  riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  shared_preferences: ^2.5.4
  shimmer: ^3.0.0
  sign_in_with_apple: ^7.0.1
  statsig: ^1.2.6
  supabase_flutter: ^2.12.0
  url_launcher: ^6.3.2
  uuid: ^4.5.2
  web: ^1.1.1

dev_dependencies:
  allure_report: ^1.0.0
  build_runner: ^2.10.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  geolocator_platform_interface: any
  json_serializable: ^6.11.2
  minglit_lints:
    path: ../minglit_lints
  mocktail: ^1.0.4
  plugin_platform_interface: any
  riverpod_generator: ^3.0.3
  riverpod_lint: 3.0.3
  test_reporter: ^1.3.0
  very_good_analysis: ^10.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/Noto_Sans_KR/

  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/Noto_Sans_KR/NotoSansKR-VariableFont_wght.ttf
    - family: RacingSansOne
      fonts:
        - asset: assets/fonts/Racing_Sans_One/RacingSansOne-Regular.ttf

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
