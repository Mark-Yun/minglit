include: package:very_good_analysis/analysis_options.yaml

analyzer:
  plugins:
    - custom_lint
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/src/theme/minglit_theme.dart" # Exclude design tokens source
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    public_member_api_docs: true
