name: minglit_lints
description: Custom lint rules for Minglit project to enforce UI consistency and design tokens.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  analysis_server_plugin: ^0.3.3
  analyzer: ^8.0.0

plugin:
  platforms:
    dart:
      pluginClass: MinglitLintsPlugin
      fileName: main.dart
