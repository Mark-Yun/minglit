title = "Minglit Gitleaks Configuration"

[allowlist]
  description = "Allow local development keys and test fixtures"
  paths = [
    '''\.env$''',
    '''\.env\.local$''',
    '''\.env\.example$''',
    '''iamport_\w+\.g\.dart$''',
    '''_test\.ts$''',
    '''_test\.dart$''',
    '''_test_utils/''',
    '''test/''',
  ]
  regexTarget = "match"
  regexes = [
    '''sb_publishable_[A-Za-z0-9_-]+''',
    '''458880127314-[a-z0-9]+\.apps\.googleusercontent\.com''',
  ]

[[rules]]
  id = "supabase-service-role-key"
  description = "Supabase Service Role Key"
  regex = '''sb_secret_[A-Za-z0-9_-]+'''
  tags = ["key", "supabase"]

# Refs #2541: HS256 JWT header is invariant for Supabase legacy keys (both anon and service_role).
# Anon JWTs are technically public but should still be in env files, not committed.
[[rules]]
  id = "supabase-legacy-jwt"
  description = "Supabase legacy JWT (HS256 header). Catches anon + service_role tokens; review usage."
  regex = '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_-]{60,}\.[A-Za-z0-9_-]{40,}'''
  tags = ["key", "supabase", "jwt"]

[[rules]]
  id = "portone-imp-key"
  description = "PortOne/Iamport API Key (real keys are 10+ chars after imp_)"
  regex = '''imp_[a-z0-9]{10,}'''
  tags = ["key", "payment"]

[[rules]]
  id = "portone-imp-secret"
  description = "PortOne/Iamport API Secret"
  regex = '''[A-Za-z0-9+/]{40,}'''
  path = '''portone|iamport|verify-payment|verify-identity'''
  tags = ["key", "payment"]

[[rules]]
  id = "kakao-api-key"
  description = "Kakao REST API Key"
  regex = '''[a-f0-9]{32}'''
  path = '''kakao|KAKAO'''
  tags = ["key", "kakao"]
