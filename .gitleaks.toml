title = "Minglit Gitleaks Configuration"

[allowlist]
  description = "Allow local development keys (Supabase local defaults)"
  paths = [
    '''\.env$''',
    '''\.env\.local$''',
    '''\.env\.example$''',
  ]
  regexTarget = "match"
  regexes = [
    # Supabase local dev publishable key (safe to expose)
    '''sb_publishable_[A-Za-z0-9_-]+''',
    # Google Web Client ID (public, not secret)
    '''458880127314-[a-z0-9]+\.apps\.googleusercontent\.com''',
  ]

[[rules]]
  id = "supabase-service-role-key"
  description = "Supabase Service Role Key"
  regex = '''sb_secret_[A-Za-z0-9_-]+'''
  tags = ["key", "supabase"]

[[rules]]
  id = "portone-imp-key"
  description = "PortOne/Iamport API Key"
  regex = '''imp_[a-z0-9]+'''
  tags = ["key", "payment"]

[[rules]]
  id = "portone-imp-secret"
  description = "PortOne/Iamport API Secret"
  regex = '''[A-Za-z0-9]{20,}'''
  path = '''portone|iamport|verify-payment|verify-identity'''
  tags = ["key", "payment"]

[[rules]]
  id = "kakao-api-key"
  description = "Kakao REST API Key"
  regex = '''[a-f0-9]{32}'''
  path = '''kakao|KAKAO'''
  tags = ["key", "kakao"]
