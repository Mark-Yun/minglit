name: integration_scenario_tester
description: "Client-side scenario integration tester for Minglit."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  supabase_flutter: ^2.8.3
  
  # Local Packages
  minglit_kit:
    path: ../../shared/packages/minglit_kit
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^3.0.0
  
  # Test Helpers
  test_data_seeder:
    path: ../../tests/test_data_seeder

flutter:
  uses-material-design: true