name: 'Deploy Next.js App'
description: 'Deploys a Next.js app to Vercel'
inputs:
  working-directory:
    description: 'Path to the app'
    required: true
  vercel-token:
    required: true
  vercel-org-id:
    required: true
  vercel-project-id:
    required: true

runs:
  using: "composite"
  steps:
    - name: Deploy to Vercel
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
      run: |
        if [[ "${{ github.ref_name }}" == "main" ]]; then
          npx --yes vercel@latest deploy --prod --token=$VERCEL_TOKEN --yes
        else
          npx --yes vercel@latest deploy --token=$VERCEL_TOKEN --yes
        fi
