name: 'Deploy Next.js App'
description: 'Deploys a Next.js app to Vercel'
inputs:
  working-directory:
    description: 'Path to the app'
    required: true
  vercel-token:
    required: true
  vercel-org-id:
    required: true
  vercel-project-id:
    required: true
  dev-domain-alias:
    description: 'Domain alias for dev/preview deployments'
    required: false
  deploy-branch:
    description: 'Branch name to determine prod vs preview deployment'
    required: true
  require-supabase-env:
    description: 'Require NEXT_PUBLIC_SUPABASE_* values before building.'
    required: false
    default: 'false'
  next-public-supabase-url:
    description: 'Build-time NEXT_PUBLIC_SUPABASE_URL value.'
    required: false
  next-public-supabase-publishable-key:
    description: 'Build-time NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY value.'
    required: false
  next-public-statsig-client-key:
    description: 'Optional build-time NEXT_PUBLIC_STATSIG_CLIENT_KEY value.'
    required: false

outputs:
  accessible-url:
    description: 'URL that passed a connectivity check (alias URL if alias succeeded, direct deploy URL otherwise)'
    value: ${{ steps.deploy.outputs.accessible-url }}

runs:
  using: "composite"
  steps:
    - name: Copy env-manifest.json into app directory
      shell: bash
      run: cp -- env-manifest.json "${{ inputs.working-directory }}/env-manifest.json"

    # Fix #2382: self-hosted ephemeral runners don't have Node.js pre-installed
    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Deploy to Vercel
      id: deploy
      shell: bash
      env:
        APP_DIR: ${{ inputs.working-directory }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        NEXT_PUBLIC_SUPABASE_URL: ${{ inputs.next-public-supabase-url }}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.next-public-supabase-publishable-key }}
        NEXT_PUBLIC_STATSIG_CLIENT_KEY: ${{ inputs.next-public-statsig-client-key }}
        REQUIRE_SUPABASE_ENV: ${{ inputs.require-supabase-env }}
      run: |
        set -euo pipefail

        APP_DIR="${APP_DIR#./}"
        if [[ ! -f "$APP_DIR/package.json" ]]; then
          echo "::error::Next.js app package.json not found: $APP_DIR/package.json"
          exit 1
        fi

        WORKSPACE_NAME="$(node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if (!pkg.name) process.exit(1); process.stdout.write(pkg.name);" "$APP_DIR/package.json")"
        if [[ -z "$WORKSPACE_NAME" ]]; then
          echo "::error::Next.js app package name is required: $APP_DIR/package.json"
          exit 1
        fi

        if [[ "$REQUIRE_SUPABASE_ENV" == "true" ]]; then
          : "${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL is required}"
          : "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is required}"
        fi

        mkdir -p .vercel
        cat > .vercel/project.json <<JSON
        {"orgId":"${VERCEL_ORG_ID}","projectId":"${VERCEL_PROJECT_ID}"}
        JSON

        if [ -f package-lock.json ]; then
          npm ci --workspace "$WORKSPACE_NAME" --include-workspace-root
        else
          npm install --workspace "$WORKSPACE_NAME" --include-workspace-root
        fi

        if [[ "${{ inputs.deploy-branch }}" == "main" ]]; then
          npx --yes vercel@latest build --prod --token=$VERCEL_TOKEN --yes
          npx --yes vercel@latest deploy --prebuilt --prod --archive=tgz --token=$VERCEL_TOKEN --yes
          # Fix #389: output the production alias URL for smoke test
          echo "accessible-url=https://${{ inputs.dev-domain-alias }}" >> "$GITHUB_OUTPUT"
        else
          # Fix #372: capture preview URL and assign domain alias so dev.*.minglit.com stays reachable
          npx --yes vercel@latest build --token=$VERCEL_TOKEN --yes
          DEPLOY_URL=$(npx --yes vercel@latest deploy --prebuilt --archive=tgz --token=$VERCEL_TOKEN --yes)
          echo "✅ Deployed to: $DEPLOY_URL"
          ALIAS_OK=false
          if [[ -n "${{ inputs.dev-domain-alias }}" ]]; then
            echo "🔗 Assigning alias: ${{ inputs.dev-domain-alias }}"
            # Fix #383: retry alias with backoff — certificate provisioning can fail transiently
            for attempt in 1 2 3; do
              if npx --yes vercel@latest alias set "$DEPLOY_URL" "${{ inputs.dev-domain-alias }}" --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID; then
                echo "✅ Alias assigned successfully"
                ALIAS_OK=true
                break
              fi
              if [[ $attempt -lt 3 ]]; then
                echo "⚠️ Alias attempt $attempt failed, retrying in $((attempt * 10))s..."
                sleep $((attempt * 10))
              else
                echo "::warning::Alias assignment failed after 3 attempts. Deployment succeeded at: $DEPLOY_URL"
              fi
            done
          fi
          # Fix #389: output the accessible URL for smoke test fallback
          if [[ "$ALIAS_OK" == "true" ]]; then
            echo "accessible-url=https://${{ inputs.dev-domain-alias }}" >> "$GITHUB_OUTPUT"
          else
            echo "accessible-url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          fi
        fi
