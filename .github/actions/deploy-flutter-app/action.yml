# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: 'Deploy Flutter App'
description: 'Builds and deploys a Flutter app to Vercel (Optimized for Monorepo)'
inputs:
  working-directory:
    description: 'Path to the flutter app'
    required: true
  vercel-token:
    description: 'Vercel Token'
    required: true
  vercel-org-id:
    description: 'Vercel Org ID'
    required: true
  vercel-project-id:
    description: 'Vercel Project ID'
    required: true
  dev-domain-alias:
    description: 'Domain alias for dev environment'
    required: true

runs:
  using: "composite"
  steps:
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    
    - name: Install & Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "🧹 Cleaning..."
        flutter clean

        echo "📦 Installing app dependencies..."
        flutter pub get

        # [Workaround] Convert relative paths in package_config.json to absolute paths.
        # dart2js has a known issue in monorepos where it incorrectly resolves relative paths
        # for transitive dependencies imported from local path-dependent packages (minglit_kit).
        # By converting to absolute paths (mimicking local dev behavior), we ensure
        # the compiler can find the packages regardless of the source file's location.
        echo "🔧 Patching package_config.json to use absolute paths..."
        # Match any relative path pointing to .pub-cache (e.g., ../../../.pub-cache)
        sed -i 's|"\.\./.*\.pub-cache|"file:///home/runner/.pub-cache|g' .dart_tool/package_config.json
        
        # Verify the patch (print first few lines of portone_flutter entry if possible, or just head)
        echo "🔍 Verifying package_config.json patch..."
        grep -m 1 "file:///home/runner/.pub-cache" .dart_tool/package_config.json || echo "⚠️ Patch might have failed"
        
        if [[ "${{ github.ref_name }}" == "main" ]]; then
          TARGET="lib/main.dart"
          SB_URL="$SUPABASE_MAIN_URL"
          SB_KEY="$SUPABASE_MAIN_KEY"
          G_ID="$GOOGLE_MAIN_ID"
          echo "🏗️ Building for Production (Main)..."
        else
          TARGET="lib/dev_main.dart"
          SB_URL="$SUPABASE_DEV_URL"
          SB_KEY="$SUPABASE_DEV_KEY"
          G_ID="$GOOGLE_DEV_ID"
          echo "🏗️ Building for Preview (Dev)..."
        fi

        flutter build web --release -t $TARGET \
          --dart-define=SUPABASE_URL=$SB_URL \
          --dart-define=SUPABASE_PUBLISHABLE_KEY=$SB_KEY \
          --dart-define=GOOGLE_WEB_CLIENT_ID=$G_ID

    - name: Copy vercel.json
      shell: bash
      run: cp ${{ inputs.working-directory }}/vercel.json ${{ inputs.working-directory }}/build/web/vercel.json

    - name: Deploy to Vercel
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
      run: |
        # Use npx to avoid global installation and ensure team scope
        # The project ID is automatically picked up from VERCEL_PROJECT_ID env var
        COMMON_ARGS="--token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID --yes"
        
        cd build/web
        
        if [[ "${{ github.ref_name }}" == "main" ]]; then
          echo "🚀 Deploying to Production (Main)..."
          npx vercel deploy --prod $COMMON_ARGS
        else
          echo "👀 Deploying to Preview (Dev) with Alias: ${{ inputs.dev-domain-alias }}..."
          npx vercel deploy --alias ${{ inputs.dev-domain-alias }} $COMMON_ARGS
        fi