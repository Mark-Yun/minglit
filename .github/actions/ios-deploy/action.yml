name: iOS Deploy
description: Build and deploy iOS app to App Store Connect (TestFlight)

inputs:
  app-name:
    description: 'App name (user or partner)'
    required: true
  app-directory:
    description: 'App directory (e.g., apps/app_user)'
    required: true
  bundle-id:
    description: 'iOS Bundle ID'
    required: true
  provisioning-profile-dev-specifier:
    description: 'DEV Provisioning Profile Specifier name'
    required: true
  provisioning-profile-prod-specifier:
    description: 'Production Provisioning Profile Specifier name'
    required: true
  development-team:
    description: 'Apple Development Team ID'
    required: false
    default: 'TAY59SLH9F'
  git-ref:
    description: 'Git ref (github.ref) for branch detection'
    required: true
  run-number:
    description: 'GitHub Actions run number (github.run_number)'
    required: true
  APPLE_CERTIFICATE_BASE64:
    description: 'Apple signing certificate (base64)'
    required: true
  APPLE_CERTIFICATE_PASSWORD:
    description: 'Apple signing certificate password'
    required: true
  APPLE_PROVISION_PROFILE_DEV_BASE64:
    description: 'DEV provisioning profile (base64)'
    required: true
  APPLE_PROVISION_PROFILE_PROD_BASE64:
    description: 'Production provisioning profile (base64)'
    required: true
  APP_STORE_CONNECT_API_KEY_BASE64:
    description: 'App Store Connect API key (base64)'
    required: true
  APP_STORE_CONNECT_API_KEY_ID:
    description: 'App Store Connect API key ID'
    required: true
  APP_STORE_CONNECT_ISSUER_ID:
    description: 'App Store Connect issuer ID'
    required: true
  SUPABASE_DEV_URL:
    description: 'Supabase dev URL'
    required: true
  SUPABASE_DEV_PUBLISHABLE_KEY:
    description: 'Supabase dev publishable key'
    required: true
  KAKAO_LOCAL_REST_API_KEY:
    description: 'Kakao Local REST API key'
    required: true
  SENTRY_DSN_FLUTTER:
    description: 'Sentry DSN for Flutter'
    required: true
  SUPABASE_MAIN_URL:
    description: 'Supabase main/production URL'
    required: true
  SUPABASE_MAIN_PUBLISHABLE_KEY:
    description: 'Supabase main/production publishable key'
    required: true

runs:
  using: composite
  steps:
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: "stable"
        cache: true

    - name: Flutter pub get
      shell: bash
      working-directory: ./${{ inputs.app-directory }}
      run: flutter pub get

    - name: Cache CocoaPods
      uses: actions/cache@v4
      with:
        path: |
          ${{ inputs.app-directory }}/ios/Pods
          ~/Library/Caches/CocoaPods
        key: ${{ runner.os }}-cocoapods-${{ hashFiles(format('{0}/ios/Podfile.lock', inputs.app-directory)) }}
        restore-keys: |
          ${{ runner.os }}-cocoapods-

    - name: Cache DerivedData
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-deriveddata-${{ hashFiles(format('{0}/ios/Podfile.lock', inputs.app-directory), format('{0}/ios/Runner.xcodeproj/project.pbxproj', inputs.app-directory)) }}
        restore-keys: |
          ${{ runner.os }}-deriveddata-

    - name: Install CocoaPods
      shell: bash
      working-directory: ./${{ inputs.app-directory }}/ios
      run: pod install

    - name: Set Dev Bundle ID
      if: ${{ inputs.git-ref == 'refs/heads/dev' }}
      shell: bash
      working-directory: ./${{ inputs.app-directory }}
      run: |
        sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = ${{ inputs.bundle-id }};/PRODUCT_BUNDLE_IDENTIFIER = ${{ inputs.bundle-id }}.dev;/g" ios/Runner.xcodeproj/project.pbxproj

    - name: Generate keychain password
      shell: bash
      working-directory: ./${{ inputs.app-directory }}
      run: echo "KEYCHAIN_PASSWORD=$(uuidgen)" >> $GITHUB_ENV

    - name: Create keychain
      shell: bash
      working-directory: ./${{ inputs.app-directory }}
      run: |
        security create-keychain -p "$KEYCHAIN_PASSWORD" "ci-signing.keychain-db"
        security set-keychain-settings -lut 21600 "ci-signing.keychain-db"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "ci-signing.keychain-db"
        security list-keychains -d user -s "ci-signing.keychain-db" login.keychain-db

    - name: Import signing certificate
      shell: bash
      working-directory: ./${{ inputs.app-directory }}
      env:
        APPLE_CERTIFICATE_BASE64: ${{ inputs.APPLE_CERTIFICATE_BASE64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ inputs.APPLE_CERTIFICATE_PASSWORD }}
      run: |
        echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > signing.p12
        security import signing.p12 -k "ci-signing.keychain-db" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "ci-signing.keychain-db"
        rm -f signing.p12
        echo "=== Keychain search list ==="
        security list-keychains -d user
        echo "=== Identities in CI keychain ==="
        security find-identity -v -p codesigning "ci-signing.keychain-db" || true
        echo "=== All codesigning identities ==="
        security find-identity -v -p codesigning || true

    - name: Install provisioning profile
      shell: bash
      working-directory: ./${{ inputs.app-directory }}
      env:
        APPLE_PROVISION_PROFILE_DEV_BASE64: ${{ inputs.APPLE_PROVISION_PROFILE_DEV_BASE64 }}
        APPLE_PROVISION_PROFILE_PROD_BASE64: ${{ inputs.APPLE_PROVISION_PROFILE_PROD_BASE64 }}
        GIT_REF: ${{ inputs.git-ref }}
      run: |
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        if [ "$GIT_REF" = "refs/heads/dev" ]; then
          PROFILE_B64="$APPLE_PROVISION_PROFILE_DEV_BASE64"
        else
          PROFILE_B64="$APPLE_PROVISION_PROFILE_PROD_BASE64"
        fi
        echo "$PROFILE_B64" | base64 --decode > profile.mobileprovision
        profile_uuid=$(grep -a -A1 UUID profile.mobileprovision | grep -o '[-a-f0-9]\{36\}')
        echo "Provisioning Profile UUID: $profile_uuid"
        cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$profile_uuid.mobileprovision
        rm -f profile.mobileprovision

    - name: Create App Store Connect API key
      shell: bash
      working-directory: ./${{ inputs.app-directory }}
      env:
        APP_STORE_CONNECT_API_KEY_BASE64: ${{ inputs.APP_STORE_CONNECT_API_KEY_BASE64 }}
        APP_STORE_CONNECT_API_KEY_ID: ${{ inputs.APP_STORE_CONNECT_API_KEY_ID }}
      run: |
        mkdir -p ~/private_keys
        echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8

    - name: Configure manual signing
      shell: bash
      working-directory: ./${{ inputs.app-directory }}
      env:
        GIT_REF: ${{ inputs.git-ref }}
      run: |
        PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"

        # Remove conflicting settings from project.pbxproj to let xcconfig take precedence
        sed -i '' '/CODE_SIGN_IDENTITY/d' "$PBXPROJ"
        sed -i '' '/CODE_SIGN_STYLE/d' "$PBXPROJ"
        sed -i '' '/DEVELOPMENT_TEAM/d' "$PBXPROJ"
        sed -i '' '/PROVISIONING_PROFILE_SPECIFIER/d' "$PBXPROJ"

        # Select provisioning profile specifier based on branch
        if [ "$GIT_REF" = "refs/heads/dev" ]; then
          PROFILE_SPECIFIER="${{ inputs.provisioning-profile-dev-specifier }}"
        else
          PROFILE_SPECIFIER="${{ inputs.provisioning-profile-prod-specifier }}"
        fi

        # Create xcconfig with correct settings
        # Fix #901: heredoc content was parsed as YAML keys due to ':'
        {
          echo "CODE_SIGN_STYLE = Manual"
          echo "CODE_SIGN_IDENTITY = Apple Distribution"
          echo "DEVELOPMENT_TEAM = ${{ inputs.development-team }}"
          echo "PROVISIONING_PROFILE_SPECIFIER = $PROFILE_SPECIFIER"
        } > ios/CI.xcconfig

        # Include in Release.xcconfig
        echo '#include "../CI.xcconfig"' >> ios/Flutter/Release.xcconfig

        echo "=== Verify project.pbxproj cleaned ==="
        grep -E "CODE_SIGN|DEVELOPMENT_TEAM" "$PBXPROJ" || echo "Cleaned successfully"
        echo "=== CI.xcconfig content ==="
        cat ios/CI.xcconfig

    - name: Build IPA (Dev)
      if: ${{ inputs.git-ref == 'refs/heads/dev' }}
      shell: bash
      working-directory: ./${{ inputs.app-directory }}
      run: |
        flutter build ipa --release --export-options-plist=ios/ExportOptions-dev.plist \
          --build-number=${{ inputs.run-number }} \
          --dart-define=SUPABASE_URL=${{ inputs.SUPABASE_DEV_URL }} \
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ inputs.SUPABASE_DEV_PUBLISHABLE_KEY }} \
          --dart-define=KAKAO_LOCAL_REST_API_KEY=${{ inputs.KAKAO_LOCAL_REST_API_KEY }} \
          --dart-define=SENTRY_DSN=${{ inputs.SENTRY_DSN_FLUTTER }} \
          --dart-define=ENVIRONMENT=development

    - name: Build IPA (Main)
      if: ${{ inputs.git-ref == 'refs/heads/main' }}
      shell: bash
      working-directory: ./${{ inputs.app-directory }}
      run: |
        flutter build ipa --release --export-options-plist=ios/ExportOptions.plist \
          --build-number=${{ inputs.run-number }} \
          --dart-define=SUPABASE_URL=${{ inputs.SUPABASE_MAIN_URL }} \
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ inputs.SUPABASE_MAIN_PUBLISHABLE_KEY }} \
          --dart-define=KAKAO_LOCAL_REST_API_KEY=${{ inputs.KAKAO_LOCAL_REST_API_KEY }} \
          --dart-define=SENTRY_DSN=${{ inputs.SENTRY_DSN_FLUTTER }} \
          --dart-define=ENVIRONMENT=production

    - name: Upload to App Store Connect (TestFlight/App Store)
      shell: bash
      working-directory: ./${{ inputs.app-directory }}
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ inputs.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.APP_STORE_CONNECT_ISSUER_ID }}
      run: |
        xcrun altool --upload-app --type ios --file build/ios/ipa/*.ipa \
          --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
          --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

    - name: Cleanup keychain
      if: ${{ always() }}
      shell: bash
      run: security delete-keychain "ci-signing.keychain-db"
