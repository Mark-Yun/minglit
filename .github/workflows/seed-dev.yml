name: Seed Dev Database

on:
  workflow_dispatch: # Manual trigger
  workflow_run:      # Auto-trigger after migration
    workflows: ["Deploy Supabase Migrations"]
    types:
      - completed
    branches:
      - dev

jobs:
  seed:
    name: Run Seeder
    runs-on: ubuntu-latest
    # Safety Guard 1: Only run on dev branch, or if manually triggered.
    # Also ensures the triggering workflow (migrations) was successful.
    if: >
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')

    steps:
      - uses: actions/checkout@v6

      # Safety Guard 2: Explicitly verify we are NOT targeting the MAIN project
      - name: Verify Target Project
        env:
          TARGET_PROJECT_ID: ${{ secrets.SUPABASE_DEV_PROJECT_ID }}
          MAIN_PROJECT_ID: ${{ secrets.SUPABASE_MAIN_PROJECT_ID }}
        run: |
          if [ -z "$TARGET_PROJECT_ID" ]; then
             echo "❌ Error: SUPABASE_DEV_PROJECT_ID secret is missing."
             exit 1
          fi

          if [ "$TARGET_PROJECT_ID" == "$MAIN_PROJECT_ID" ]; then
            echo "🔥 CRITICAL ERROR: Safety Guard Triggered!"
            echo "Attempting to seed the MAIN database project ($MAIN_PROJECT_ID)."
            echo "This operation is strictly forbidden in this workflow."
            exit 1
          fi
          echo "✅ Safety Check Passed: Target Project ($TARGET_PROJECT_ID) is NOT Main DB."

      # Fix #1600: Dart seeder (tests/test_data_seeder) was removed in #1413.
      # seed.dev.sql is now the source of truth — run via psql direct connection.
      - name: Run seed.dev.sql
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_DEV_PROJECT_ID }}
          # Fix #1621: db.{ref}.supabase.co → pooler endpoint (IPv4).
          # GitHub runners cannot reach IPv6-only endpoints.
          # Fix #1553: aws-0 → aws-1 (Supabase infra migration)
          POOLER_HOST: aws-1-ap-northeast-2.pooler.supabase.com
        run: |
          # Pooler requires tenant-qualified username: postgres.{project_ref}
          psql \
            "postgresql://postgres.${SUPABASE_PROJECT_ID}@${POOLER_HOST}:5432/postgres?sslmode=require" \
            -f supabase/seed.dev.sql


  notify-failure:
    needs: [seed]
    if: ${{ always() && needs.seed.result == 'failure' }}
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      success: ${{ needs.seed.result == 'success' }}
      workflow_name: 'Seed Dev'
