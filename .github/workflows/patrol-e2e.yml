# Patrol E2E Tests — weekly scheduled run (매주 월요일 06:00 UTC).
# This workflow is NOT part of ci-result and does NOT block PR merges.
# Failures here are informational only; investigation happens separately.
#
# Runs only Patrol-native tests (patrolTest) in patrol_test/.
# scenario_screenshots_test.dart and apple_sign_in_test.dart use
# IntegrationTestWidgetsFlutterBinding (incompatible with PatrolBinding)
# and are excluded from this workflow — run them via `flutter test integration_test/`.
#
# Fix #1673: patrol_cli 4.x requires patrol_test/ directory — moved tests from integration_test/

name: "Weekly: Emulator Test (Patrol native surface)"

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Fix #1457: schedule + manual 실행 겹침 시 병렬 실행 방지
concurrency:
  group: patrol-e2e
  cancel-in-progress: false

jobs:
  patrol-e2e-app-user:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Fix: CI checkout does not include the private minglit_env submodule.
      # Rebuild the dev Flutter env file from Actions secrets before running Patrol.
      # Same pattern as daily-backend-simulation.yml (Fix #1169).
      - name: Create dev Flutter env file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
          ENVIRONMENT: development
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_FLUTTER }}
          STATSIG_CLIENT_KEY: ${{ secrets.STATSIG_CLIENT_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_DEV_WEB_CLIENT_ID }}
          KAKAO_LOCAL_REST_API_KEY: ${{ secrets.KAKAO_LOCAL_REST_API_KEY }}
          KAKAO_MAP_JAVASCRIPT_KEY: ${{ secrets.KAKAO_MAP_JAVASCRIPT_KEY }}
          JUSO_CONFIRM_KEY: ${{ secrets.JUSO_CONFIRM_KEY }}
          IAMPORT_USER_CODE: ${{ secrets.IAMPORT_USER_CODE }}
          MOBILE_REDIRECT_SCHEME: ${{ secrets.MOBILE_REDIRECT_SCHEME }}
        run: bash .github/scripts/create-dev-flutter-env.sh

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install patrol_cli
        run: dart pub global activate patrol_cli

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/app_user

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Run Patrol tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: >
            cd apps/app_user &&
            patrol test
            --flavor dev
            --dart-define-from-file=../../minglit_env/dev/flutter.env
            --target patrol_test/kakao_login_test.dart
            --target patrol_test/payment_pg_test.dart
            --target patrol_test/permission_grant_test.dart

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: patrol-e2e-results-app-user
          path: apps/app_user/build/app/outputs/
          retention-days: 14
