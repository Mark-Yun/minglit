name: monitor-event-flow-daily

# Legacy manual seed + long cascade. Scheduled execution moved to
# monitor-event-flow-distributed.

on:
  workflow_dispatch:

concurrency:
  group: monitor-event-flow-dev
  cancel-in-progress: false

jobs:
  resolve-dev-sha:
    name: Resolve current dev HEAD
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dev_sha: ${{ steps.resolve.outputs.dev_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Resolve origin/dev
        id: resolve
        run: |
          set -euo pipefail
          git fetch origin dev --depth=1
          echo "dev_sha=$(git rev-parse origin/dev)" >> "${GITHUB_OUTPUT}"

  seed-and-simulate:
    name: Seed + event-flow cascade (daily)
    needs: [resolve-dev-sha]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Fix #1413: psql 직접 실행 — 560명 시딩 ~3초 (EF 시딩은 timeout 위험)
      - name: Seed users/partners via SQL
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
          PROJECT_ID: ${{ secrets.SUPABASE_DEV_PROJECT_ID }}
          # Fix #1553: aws-0 → aws-1 인프라 이전
          POOLER_HOST: aws-1-ap-northeast-2.pooler.supabase.com
        run: |
          PGPASSWORD="${DB_PASSWORD}" psql \
            "postgresql://postgres.${PROJECT_ID}:${DB_PASSWORD}@${POOLER_HOST}:5432/postgres?sslmode=require" \
            -v ON_ERROR_STOP=1 \
            -f supabase/seed.dev.sql

      - name: Upload seed images (dev-seed EF)
        run: |
          # Fix #1635: -s + 수동 status 검사 — error body 로깅 보장
          http_code=$(curl -s -o /tmp/seed_response.json -w "%{http_code}" -X POST \
            "${{ secrets.SUPABASE_DEV_URL }}/functions/v1/dev-seed?mode=images-only" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_DEV_SECRET_KEY }}" \
            --max-time 60)
          cat /tmp/seed_response.json
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::dev-seed images-only returned HTTP $http_code"
            exit 1
          fi

      - name: Run event-flow cascade (long)
        run: |
          # daily 는 데이터 다양성 ↑ 위해 ticks/users 늘림.
          # Fix #2721: usersPerTick=20 + delayBetweenCallsMs=800 — 한 trace 안에서
          # auth/EF 호출이 누적되어 Supabase per-trace rate limit 에 걸리지 않게 한다.
          # hourly(1×20)보다 넓은 3 tick soak 은 유지한다.
          http_code=$(curl -s -o /tmp/sim_response.json -w "%{http_code}" -X POST \
            "${{ secrets.SUPABASE_DEV_URL }}/functions/v1/event-flow-simulator" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_DEV_SECRET_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"ticks": 3, "usersPerTick": 20, "delayBetweenCallsMs": 800}' \
            --max-time 600)
          cat /tmp/sim_response.json
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::event-flow-simulator returned HTTP $http_code"
            exit 1
          fi
          jq -e '.success == true' /tmp/sim_response.json

  notify-failure:
    needs: [resolve-dev-sha, seed-and-simulate]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
      statuses: write
    uses: ./.github/workflows/shared-notify.yml
    with:
      failed: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      workflow_name: 'monitor-event-flow-daily'
      severity: 'P1-high'
      job_results: '{"resolve-dev-sha":"${{ needs.resolve-dev-sha.result }}","seed-and-simulate":"${{ needs.seed-and-simulate.result }}"}'
      stage: 'dev-soak'
      signal: 'backend-simulator'
      blocks_rc_cut: true
      commit_sha: ${{ needs.resolve-dev-sha.outputs.dev_sha }}
      status_description: 'monitor-event-flow-daily failed'
    secrets: inherit
