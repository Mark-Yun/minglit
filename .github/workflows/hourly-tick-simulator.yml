name: "Hourly: Tick Simulator (user activity mode)"

on:
  schedule:
    - cron: '30 * * * *'  # Every hour at :30
  workflow_dispatch:

concurrency:
  group: supabase-dev-simulation
  cancel-in-progress: false

jobs:
  simulate:
    name: Run User Activity Simulation
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Run user activity simulation
        run: |
          curl -sf -X POST \
            "${{ secrets.SUPABASE_DEV_URL }}/functions/v1/backend-simulator" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_DEV_SECRET_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"mode":"tick"}' \
            --max-time 120

  notify-failure:
    needs: [simulate]
    if: always()
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      success: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
      workflow_name: 'Hourly Tick Simulator (user activity mode)'
    secrets: inherit
