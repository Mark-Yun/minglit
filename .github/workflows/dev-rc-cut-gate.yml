name: dev-rc-cut-gate

on:
  schedule:
    # 01:30 KST daily, before dev-rc-cut.
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Optional full dev candidate SHA. Defaults to latest origin/dev.
        required: false
        type: string
      min_soak_hours:
        description: Minimum candidate age in hours.
        required: false
        type: string
        default: '24'
      dry_run:
        description: Evaluate only; do not write dev soak/pass commit statuses.
        required: false
        type: boolean
        default: false

concurrency:
  group: dev-rc-cut-gate
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write
  statuses: write

jobs:
  evaluate-dev-soak:
    name: evaluate-dev-soak
    uses: ./.github/workflows/shared-soak-gate.yml
    with:
      candidate_ref: dev
      candidate_sha: ${{ inputs.candidate_sha || '' }}
      min_soak_hours: ${{ inputs.min_soak_hours || '24' }}
      required_runs_json: >-
        [
          {"workflow":"monitor-event-flow-distributed.yml","branch":"dev-staging","min_success":250}
        ]
      failure_contexts: |
        dev-soak/backend-simulator
      success_contexts: |
        dev-soak/backend-simulator
      pass_context: dev-rc-cut-pass
      pass_description: 'dev-rc-cut-gate passed; this dev commit can be cut to RC'
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

  track-cut-gate:
    needs: [evaluate-dev-soak]
    if: needs.evaluate-dev-soak.result == 'success' && needs.evaluate-dev-soak.outputs.candidate_sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Track dev -> rc cut gate
        uses: ./.github/actions/cut-issue
        with:
          github-token: ${{ github.token }}
          operation: upsert
          gate-key: dev-rc
          subject-id: ${{ needs.evaluate-dev-soak.outputs.candidate_sha }}
          title: 'cut-gate(dev-rc): ${{ needs.evaluate-dev-soak.outputs.candidate_sha }}'
          status: ${{ needs.evaluate-dev-soak.outputs.skipped == 'true' && 'waiting' || 'ready' }}
          summary: 'dev -> rc cut gate evaluated `${{ needs.evaluate-dev-soak.outputs.candidate_sha }}`.'
          details: |
            - Candidate ref: `dev`
            - Candidate SHA: `${{ needs.evaluate-dev-soak.outputs.candidate_sha }}`
            - Gate skipped: `${{ needs.evaluate-dev-soak.outputs.skipped }}`
            - Reason: `${{ needs.evaluate-dev-soak.outputs.reason }}`
            - Dry run: `${{ inputs.dry_run || false }}`
            - Next workflow: `dev-rc-cut`

  notify-failure:
    needs: [evaluate-dev-soak, track-cut-gate]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
      statuses: write
    uses: ./.github/workflows/shared-notify.yml
    with:
      failed: ${{ needs.evaluate-dev-soak.result != 'success' }}
      workflow_name: 'Dev RC Cut Gate'
      severity: 'P1-high'
      job_results: '{"evaluate-dev-soak":"${{ needs.evaluate-dev-soak.result }}","skipped":"${{ needs.evaluate-dev-soak.outputs.skipped }}","reason":"${{ needs.evaluate-dev-soak.outputs.reason }}","candidate_sha":"${{ needs.evaluate-dev-soak.outputs.candidate_sha }}"}'
    secrets: inherit
