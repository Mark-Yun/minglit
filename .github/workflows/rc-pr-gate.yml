name: rc-pr-gate

on:
  pull_request:
    branches: ['rc/**']

permissions:
  contents: write
  pull-requests: read
  checks: write
  issues: write

concurrency:
  group: rc-pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate-core:
    uses: ./.github/workflows/pr-gate.yml
    with:
      stage: rc
      base_ref: ${{ github.base_ref }}
    secrets: inherit

  rc-pr-gate:
    needs: [pr-gate-core]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish branch gate result
        run: |
          if [ "${{ needs.pr-gate-core.result }}" != "success" ]; then
            echo "::error::pr-gate-core result: ${{ needs.pr-gate-core.result }}"
            exit 1
          fi
          echo "rc-pr-gate passed"
