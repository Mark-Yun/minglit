name: shared-promo-tag

on:
  workflow_call:
    inputs:
      target_ref:
        description: Branch/ref to fetch before creating the tag.
        required: true
        type: string
      tag_name:
        description: Promotion marker tag name, e.g. promo/rc-2026-W22.
        required: true
        type: string
      commit_sha:
        description: Commit SHA to tag.
        required: true
        type: string
      env_file:
        description: minglit_env file for release bot credentials.
        required: false
        type: string
        default: minglit_env/dev/github.env

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release bot token
        id: release-bot
        uses: ./.github/actions/release-bot-token
        with:
          env-file: ${{ inputs.env_file }}
          fallback-app-id: ${{ secrets.MINGLIT_RELEASE_BOT_APP_ID }}
          fallback-private-key: ${{ secrets.MINGLIT_RELEASE_BOT_PRIVATE_KEY }}

      - name: Tag promotion marker
        env:
          RELEASE_BOT_TOKEN: ${{ steps.release-bot.outputs.token }}
          TARGET_REF: ${{ inputs.target_ref }}
          TAG_NAME: ${{ inputs.tag_name }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          if ! [[ "${TAG_NAME}" =~ ^promo/(rc-[0-9]{4}-W[0-9]{2}|main-[0-9]{4}-W[0-9]{2})$ ]]; then
            echo "::error::Invalid promotion tag: ${TAG_NAME}."
            exit 1
          fi

          git remote set-url origin "https://x-access-token:${RELEASE_BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "${TARGET_REF}" --tags --force

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists; skipping."
            exit 0
          fi

          git tag "${TAG_NAME}" "${COMMIT_SHA}"
          git push origin "refs/tags/${TAG_NAME}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
