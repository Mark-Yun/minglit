name: Update CI Goldens

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update goldens on'
        required: true
        type: string

jobs:
  update-goldens:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - package: app_user
            flutter_app: app_user
            working_directory: apps/app_user
          - package: app_partner
            flutter_app: app_partner
            working_directory: apps/app_partner
          - package: minglit_kit
            flutter_app: app_user
            working_directory: shared/packages/minglit_kit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        working-directory: ${{ matrix.working_directory }}
        run: flutter pub get

      - name: Update CI goldens
        working-directory: ${{ matrix.working_directory }}
        run: flutter test --dart-define=CI=true --update-goldens --tags golden

      - name: Commit updated goldens
        working-directory: ${{ matrix.working_directory }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "test/goldens/goldens/ci/" "test/goldens/goldens/ci/**"
          if git diff --cached --quiet; then
            echo "No golden changes for ${{ matrix.package }}"
          else
            git commit -m "chore(golden): update ${{ matrix.package }} CI goldens on Linux runner"
            git pull --rebase origin ${{ inputs.branch }}
            git push origin HEAD:${{ inputs.branch }}
          fi
