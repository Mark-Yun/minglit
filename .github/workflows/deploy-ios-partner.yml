name: deploy-ios-partner

on:
  workflow_call:
    inputs:
      target-ref:
        description: Git ref to deploy.
        required: false
        type: string
        default: ''
      deploy-stage:
        description: Deployment stage used for signing/env selection.
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      target-ref:
        description: Git ref to deploy. Defaults to the selected workflow ref.
        required: false
        type: string
      deploy-stage:
        description: Deployment stage used for signing/env selection. Defaults from target-ref/workflow ref.
        required: false
        type: string

concurrency:
  group: deploy-ios-partner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/shared-ios-deploy.yml
    with:
      app-name: partner
      app-directory: apps/app_partner
      bundle-id: com.minglit.appPartner
      provisioning-profile-dev-specifier: Minglit Partner App DEV Profile
      provisioning-profile-prod-specifier: Minglit Partner App Store Profile
      notify-workflow-name: iOS Deploy Partner
      target-ref: ${{ inputs.target-ref || github.ref }}
      deploy-stage: ${{ inputs.deploy-stage || ((inputs.target-ref == 'main' || inputs.target-ref == 'refs/heads/main' || (inputs.target-ref == '' && github.ref_name == 'main')) && 'main' || 'dev') }}
    secrets:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISION_PROFILE_DEV_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_PARTNER_DEV_BASE64 }}
      APPLE_PROVISION_PROFILE_PROD_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_PARTNER_BASE64 }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      SUPABASE_DEV_URL: ${{ secrets.SUPABASE_DEV_URL }}
      SUPABASE_DEV_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
      KAKAO_LOCAL_REST_API_KEY: ${{ secrets.KAKAO_LOCAL_REST_API_KEY }}
      JUSO_CONFIRM_KEY: ${{ secrets.JUSO_CONFIRM_KEY }}
      SENTRY_DSN_FLUTTER: ${{ secrets.SENTRY_DSN_FLUTTER }}
      SUPABASE_MAIN_URL: ${{ secrets.SUPABASE_MAIN_URL }}
      SUPABASE_MAIN_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_MAIN_PUBLISHABLE_KEY }}
      GH_PAT_VERSION_BUMP: ${{ secrets.GH_PAT_VERSION_BUMP }}
