name: shared-version-metadata

on:
  workflow_call:
    inputs:
      channel:
        description: Release channel, e.g. dev, rc, or main.
        required: true
        type: string
      source-ref:
        description: Ref or SHA to inspect.
        required: true
        type: string
    outputs:
      base_version:
        description: Platform-safe numeric version.
        value: ${{ jobs.metadata.outputs.base_version }}
      version_name:
        description: Human-facing version name.
        value: ${{ jobs.metadata.outputs.version_name }}
      build_number:
        description: Monotonic Flutter/Android/iOS build number.
        value: ${{ jobs.metadata.outputs.build_number }}
      release_tag:
        description: GitHub Release tag to publish artifacts under.
        value: ${{ jobs.metadata.outputs.release_tag }}
      release_name:
        description: GitHub Release title suffix.
        value: ${{ jobs.metadata.outputs.release_name }}
      pr_number:
        description: Revision PR number.
        value: ${{ jobs.metadata.outputs.pr_number }}
      source_sha:
        description: Resolved source SHA.
        value: ${{ jobs.metadata.outputs.source_sha }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_version: ${{ steps.metadata.outputs.base_version }}
      version_name: ${{ steps.metadata.outputs.version_name }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      pr_number: ${{ steps.metadata.outputs.pr_number }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
          fetch-depth: 0

      - name: Compute version metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          set -euo pipefail

          case "${CHANNEL}" in
            dev|rc|main) ;;
            *)
              echo "::error::Unsupported channel '${CHANNEL}'. Expected dev, rc, or main."
              exit 1
              ;;
          esac

          SOURCE_SHA="$(git rev-parse HEAD)"
          PR_NUM=""
          REVISION_SHA=""

          for sha in $(git rev-list --first-parent -n 80 HEAD); do
            candidate="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --jq '.[0].number // empty' || true)"

            if [ -z "${candidate}" ]; then
              candidate="$(git log -1 --format=%B "${sha}" | sed -nE 's/.*\(#([0-9]+)\).*/\1/p' | head -n 1)"
            fi

            if [[ "${candidate}" =~ ^[0-9]+$ ]]; then
              PR_NUM="${candidate}"
              REVISION_SHA="${sha}"
              break
            fi
          done

          if ! [[ "${PR_NUM}" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to determine revision PR number for ${SOURCE_SHA} (${SOURCE_REF})."
            exit 1
          fi

          YEAR="$(date -u +%Y)"
          MONTH="$(date -u +%-m)"
          BASE_VERSION="${YEAR}.${MONTH}.${PR_NUM}"
          if [ "${CHANNEL}" = "main" ]; then
            VERSION_NAME="${BASE_VERSION}"
          else
            VERSION_NAME="${BASE_VERSION}-${CHANNEL}"
          fi

          PR_NUMBER_INT=$((10#${PR_NUM}))
          BUILD_NUMBER="${PR_NUM}"
          BUILD_NUMBER_RULE="pr_number"
          LEGACY_SEED=""

          # Main channel keeps compatibility with legacy YYMM#### Android/iOS build numbers
          # so first deploy after switching to PR-based naming cannot go backwards.
          if [ "${CHANNEL}" = "main" ]; then
            YY="$(date -u +%y)"
            MM="$(date -u +%m)"
            LEGACY_SEED=$((10#${YY} * 1000000 + 10#${MM} * 10000))
            BUILD_NUMBER=$((LEGACY_SEED + PR_NUMBER_INT))
            BUILD_NUMBER_RULE="legacy_compat_main_YYMM0000_plus_PR"

            # Contract guard: main build number must stay above raw PR number.
            if [ "${BUILD_NUMBER}" -le "${PR_NUMBER_INT}" ]; then
              echo "::error::Main build_number must be monotonic and greater than PR number."
              exit 1
            fi
          fi

          {
            echo "base_version=${BASE_VERSION}"
            echo "version_name=${VERSION_NAME}"
            echo "build_number=${BUILD_NUMBER}"
            echo "release_tag=build-${CHANNEL}-v${VERSION_NAME}"
            echo "release_name=${CHANNEL} v${VERSION_NAME}"
            echo "pr_number=${PR_NUM}"
            echo "source_sha=${SOURCE_SHA}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Version metadata"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| channel | ${CHANNEL} |"
            echo "| source_ref | ${SOURCE_REF} |"
            echo "| source_sha | ${SOURCE_SHA} |"
            echo "| revision_sha | ${REVISION_SHA} |"
            echo "| pr_number | ${PR_NUM} |"
            echo "| base_version | ${BASE_VERSION} |"
            echo "| version_name | ${VERSION_NAME} |"
            echo "| build_number | ${BUILD_NUMBER} |"
            echo "| build_number_rule | ${BUILD_NUMBER_RULE} |"
            if [ "${CHANNEL}" = "main" ]; then
              echo "| legacy_seed | ${LEGACY_SEED} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
