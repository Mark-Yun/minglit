name: shared-android-deploy

on:
  workflow_call:
    inputs:
      app-name:
        description: 'App name (user or partner)'
        required: true
        type: string
      app-directory:
        description: 'App directory path (e.g., apps/app_user)'
        required: true
        type: string
      package-name:
        description: 'Android package name'
        required: true
        type: string
      gradle-cache-prefix:
        description: 'Gradle cache key prefix (e.g., gradle- or gradle-partner-)'
        required: true
        type: string
      artifact-name-apk:
        description: 'Artifact name for dev APK (e.g., app-dev-release.apk)'
        required: true
        type: string
      artifact-name-aab:
        description: 'Artifact name for prod AAB (e.g., app-prod-release.aab)'
        required: true
        type: string
      notify-workflow-name:
        description: 'Workflow name for failure notification'
        required: true
        type: string
      target-ref:
        description: 'Git ref to checkout. Defaults to the caller ref.'
        required: false
        type: string
        default: ''
      deploy-stage:
        description: 'Deployment stage used for flavor/env selection (dev or main).'
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      SUPABASE_DEV_URL:
        required: true
      SUPABASE_DEV_PUBLISHABLE_KEY:
        required: true
      SUPABASE_MAIN_URL:
        required: true
      SUPABASE_MAIN_PUBLISHABLE_KEY:
        required: true
      SENTRY_DSN_FLUTTER:
        required: true
      FIREBASE_APP_ID_ANDROID:
        required: true
      FIREBASE_SERVICE_ACCOUNT_JSON_DEV:
        required: true
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: true
      JUSO_CONFIRM_KEY:
        required: false
      MINGLIT_RELEASE_BOT_APP_ID:
        description: 'GitHub App ID for GitHub Releases publish'
        required: true
      MINGLIT_RELEASE_BOT_PRIVATE_KEY:
        description: 'GitHub App private key for GitHub Releases publish'
        required: true

jobs:
  version:
    uses: ./.github/workflows/shared-version-metadata.yml
    with:
      channel: ${{ inputs.deploy-stage == 'main' && 'main' || 'dev' }}
      source-ref: ${{ inputs.target-ref || github.ref }}

  build:
    needs: [version]
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy-stage == 'main' && 'production' || 'preview' }}
    permissions:
      contents: write
    outputs:
      version_name: ${{ needs.version.outputs.version_name }}
      build_number: ${{ needs.version.outputs.build_number }}
    defaults:
      run:
        working-directory: ./${{ inputs.app-directory }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target-ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: ${{ inputs.app-directory }}/android/build.gradle.kts

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'  # Fix #2640: flutter_quill 11.5.0 incompatible with Flutter 3.44.0
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ inputs.app-directory }}/android/.gradle
          key: ${{ runner.os }}-${{ inputs.gradle-cache-prefix }}${{ hashFiles(format('{0}/android/**/*.gradle.kts', inputs.app-directory), format('{0}/android/gradle/wrapper/gradle-wrapper.properties', inputs.app-directory)) }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.gradle-cache-prefix }}

      - name: Get dependencies
        run: flutter pub get

      - name: Validate deploy stage
        run: |
          case "${{ inputs.deploy-stage }}" in
            dev|main) ;;
            *)
              echo "::error::Unsupported deploy-stage '${{ inputs.deploy-stage }}'. Expected dev or main."
              exit 1
              ;;
          esac

      - name: Validate JUSO key for partner
        if: ${{ inputs.app-name == 'partner' }}
        env:
          JUSO_CONFIRM_KEY: ${{ secrets.JUSO_CONFIRM_KEY }}
        run: |
          if [ -z "$JUSO_CONFIRM_KEY" ]; then
            echo "JUSO_CONFIRM_KEY is required for partner deploy." >&2
            exit 1
          fi

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo $ANDROID_KEYSTORE_BASE64 | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Build APK (Dev)
        if: inputs.deploy-stage == 'dev'
        run: flutter build apk --flavor dev --release --build-name=${{ needs.version.outputs.version_name }} --build-number=${{ needs.version.outputs.build_number }} --dart-define=APP_VERSION=${{ needs.version.outputs.version_name }} --dart-define=APP_CHANNEL=dev --dart-define=SOURCE_BRANCH=dev --dart-define=GIT_SHA=${{ needs.version.outputs.source_sha }} --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_DEV_URL }} --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }} --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN_FLUTTER }} --dart-define=ENVIRONMENT=development --dart-define=JUSO_CONFIRM_KEY=${{ secrets.JUSO_CONFIRM_KEY }}

      - name: Build AAB (Main)
        if: inputs.deploy-stage == 'main'
        run: flutter build appbundle --flavor prod --release --build-name=${{ needs.version.outputs.version_name }} --build-number=${{ needs.version.outputs.build_number }} --dart-define=APP_VERSION=${{ needs.version.outputs.version_name }} --dart-define=APP_CHANNEL=main --dart-define=SOURCE_BRANCH=main --dart-define=GIT_SHA=${{ needs.version.outputs.source_sha }} --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_MAIN_URL }} --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_MAIN_PUBLISHABLE_KEY }} --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN_FLUTTER }} --dart-define=ENVIRONMENT=production --dart-define=JUSO_CONFIRM_KEY=${{ secrets.JUSO_CONFIRM_KEY }}

      - name: Generate release bot token
        id: release-bot
        uses: ./.github/actions/release-bot-token
        with:
          fallback-app-id: ${{ secrets.MINGLIT_RELEASE_BOT_APP_ID }}
          fallback-private-key: ${{ secrets.MINGLIT_RELEASE_BOT_PRIVATE_KEY }}

      # Publish to GitHub Releases (Firebase App Distribution 와 별개로,
      # 외부 공유 URL + 버전별 historical archive 제공).
      - name: Publish APK/AAB to Releases (Dev)
        if: inputs.deploy-stage == 'dev'
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          REPO: ${{ github.repository }}
          APP: ${{ inputs.app-name }}
          APP_DIR: ${{ inputs.app-directory }}
        run: |
          set -e
          cd ../../  # back to repo root for gh release
          VERSION="${{ needs.version.outputs.version_name }}"
          SRC="${APP_DIR}/build/app/outputs/flutter-apk/app-dev-release.apk"
          ASSET="app_${APP}-android-dev-v${VERSION}.apk"
          cp "$SRC" "/tmp/${ASSET}"

          HIST="build-android-${APP}-dev-v${VERSION}"
          NIGHTLY="nightly-android-${APP}-dev"

          # Versioned (영구, retention cron 으로 14 일 후 정리)
          if gh release view "$HIST" --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::$HIST already exists - skip"
          else
            gh release create "$HIST" \
              --title "android • app_${APP} (dev) v${VERSION}" \
              --notes "Built from ${GITHUB_SHA} (${VERSION})" \
              --prerelease \
              --repo "$REPO" \
              "/tmp/${ASSET}"
          fi

          # Nightly pointer (overwrite)
          gh release delete "$NIGHTLY" --yes --cleanup-tag --repo "$REPO" 2>/dev/null || true
          gh release create "$NIGHTLY" \
            --title "Nightly — android • app_${APP} (dev)" \
            --notes "Points to v${VERSION} • ${GITHUB_SHA}" \
            --prerelease \
            --repo "$REPO" \
            "/tmp/${ASSET}"

      - name: Publish AAB to Releases (Main)
        if: inputs.deploy-stage == 'main'
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          REPO: ${{ github.repository }}
          APP: ${{ inputs.app-name }}
          APP_DIR: ${{ inputs.app-directory }}
        run: |
          set -e
          cd ../../
          VERSION="${{ needs.version.outputs.version_name }}"
          SRC="${APP_DIR}/build/app/outputs/bundle/prodRelease/app-prod-release.aab"
          ASSET="app_${APP}-android-main-v${VERSION}.aab"
          cp "$SRC" "/tmp/${ASSET}"

          HIST="build-android-${APP}-main-v${VERSION}"
          NIGHTLY="nightly-android-${APP}-main"

          if gh release view "$HIST" --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::$HIST already exists - skip"
          else
            gh release create "$HIST" \
              --title "android • app_${APP} (main) v${VERSION}" \
              --notes "Built from ${GITHUB_SHA} (${VERSION})" \
              --prerelease \
              --repo "$REPO" \
              "/tmp/${ASSET}"
          fi

          gh release delete "$NIGHTLY" --yes --cleanup-tag --repo "$REPO" 2>/dev/null || true
          gh release create "$NIGHTLY" \
            --title "Nightly — android • app_${APP} (main)" \
            --notes "Points to v${VERSION} • ${GITHUB_SHA}" \
            --prerelease \
            --repo "$REPO" \
            "/tmp/${ASSET}"

      - name: Upload to Firebase App Distribution (Dev)
        if: inputs.deploy-stage == 'dev'
        uses: w9jds/firebase-action@a95a1d1dfeea8f7efbe0eb13fd3bf429cb4ac437 # v15.19.0
        with:
          args: appdistribution:distribute ${{ inputs.app-directory }}/build/app/outputs/flutter-apk/app-dev-release.apk --app ${{ secrets.FIREBASE_APP_ID_ANDROID }} --release-notes Dev-Build-${{ github.run_number }} --groups testers
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_DEV }}

      - name: Upload to Google Play (Prod)
        if: inputs.deploy-stage == 'main'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package-name }}
          releaseFiles: ${{ inputs.app-directory }}/build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: internal
          status: draft

  notify-failure:
    needs: [version, build]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
      statuses: write
    uses: ./.github/workflows/shared-notify.yml
    with:
      failed: ${{ needs.version.result != 'success' || needs.build.result != 'success' }}
      workflow_name: ${{ inputs.notify-workflow-name }}
      severity: 'P0-critical'
