name: triage-mds-issue

# Invoked by post-merge.yml on push to dev-staging (paths filter applied at caller level).
# Relies on github.event.before/head_commit; only safe under push context — caller gates with
# `if: github.event_name == 'push'` so workflow_dispatch on the caller does not call this.
on:
  workflow_call:

concurrency:
  group: triage-mds-issue-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  file-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 2

      - name: Collect changed spec files
        id: collect
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Use github.event.before as base; fall back to HEAD^ for first push to branch
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${HEAD_SHA}^"
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            'apps/mds/docs/public/specs/**' \
            'apps/mds/docs/src/lib/components.ts' \
            'apps/mds/docs/src/components/specs/**' || true)

          if [ -z "$CHANGED" ]; then
            echo "no spec files changed"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Build issue body
        if: steps.collect.outputs.skip != 'true'
        id: body
        env:
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          BASE_SHA: ${{ github.event.before }}
          CHANGED_FILES: ${{ steps.collect.outputs.files }}
        run: |
          COMMIT_URL="https://github.com/${REPO}/commit/${COMMIT_SHA}"
          COMMIT_MSG=$(git log -1 --pretty=%s "$COMMIT_SHA")

          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${COMMIT_SHA}^"
          fi

          {
            echo "body<<BODY_EOF"
            echo "## 변경된 mds spec"
            echo ""
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              echo "- \`$f\`"
            done <<< "$CHANGED_FILES"
            echo ""
            echo "## 원인 commit"
            echo ""
            echo "[\`${COMMIT_SHA:0:7}\`]($COMMIT_URL) — $COMMIT_MSG"
            echo "by @$AUTHOR"
            echo ""
            echo "## diff 요약 (최대 200줄)"
            echo ""
            echo '```diff'
            git diff "$BASE_SHA" "$COMMIT_SHA" -- \
              'apps/mds/docs/public/specs/**' \
              'apps/mds/docs/src/lib/components.ts' \
              'apps/mds/docs/src/components/specs/**' \
              | head -n 200
            echo '```'
            echo ""
            echo "## 관련 Flutter 코드 검색 힌트"
            echo ""
            echo '```bash'
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              base=$(basename "$f" .html)
              base=$(basename "$base" .tsx)
              echo "grep -r '$base' apps/app_user/lib/ apps/app_partner/lib/ shared/packages/minglit_kit/lib/"
            done <<< "$CHANGED_FILES"
            echo '```'
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create issue
        if: steps.collect.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          CHANGED_FILES: ${{ steps.collect.outputs.files }}
          BODY: ${{ steps.body.outputs.body }}
        run: |
          FILE_COUNT=$(echo "$CHANGED_FILES" | grep -c '.' || echo 0)

          gh issue create \
            --repo "$REPO" \
            --title "[mds-change] ${FILE_COUNT}개 spec 변경 — 구현·문서·CUJ 영향 검토 필요 (${COMMIT_SHA:0:7})" \
            --body "$BODY" \
            --label needs-arch
