name: monitor-event-flow-hourly

# Legacy manual smoke. Scheduled execution moved to monitor-event-flow-distributed.

on:
  workflow_dispatch:

concurrency:
  group: monitor-event-flow-dev
  cancel-in-progress: false

jobs:
  resolve-dev-sha:
    name: Resolve current dev HEAD
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dev_sha: ${{ steps.resolve.outputs.dev_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Resolve origin/dev
        id: resolve
        run: |
          set -euo pipefail
          git fetch origin dev --depth=1
          echo "dev_sha=$(git rev-parse origin/dev)" >> "${GITHUB_OUTPUT}"

  simulate:
    name: Run event-flow cascade (hourly smoke)
    needs: [resolve-dev-sha]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke event-flow-simulator
        run: |
          # Fix #1635: -s + 수동 status 검사 — error body 로깅 보장
          # Fix #2545: usersPerTick=20 + delayBetweenCallsMs=300 — Supabase per-trace
          # rate limit 회피. hourly 는 smoke 라 daily 보다 작은 payload.
          http_code=$(curl -s -o /tmp/sim_response.json -w "%{http_code}" -X POST \
            "${{ secrets.SUPABASE_DEV_URL }}/functions/v1/event-flow-simulator" \
            -H "apikey: ${{ secrets.SUPABASE_DEV_SECRET_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_DEV_SECRET_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"ticks": 1, "usersPerTick": 20, "delayBetweenCallsMs": 300}' \
            --max-time 180)
          cat /tmp/sim_response.json
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::event-flow-simulator returned HTTP $http_code"
            exit 1
          fi
          jq -e '.success == true' /tmp/sim_response.json

  notify-failure:
    needs: [resolve-dev-sha, simulate]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
      statuses: write
    uses: ./.github/workflows/shared-notify.yml
    with:
      failed: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      workflow_name: 'monitor-event-flow-hourly'
      severity: 'P1-high'
      job_results: '{"resolve-dev-sha":"${{ needs.resolve-dev-sha.result }}","simulate":"${{ needs.simulate.result }}"}'
      stage: 'dev-soak'
      signal: 'backend-simulator'
      blocks_rc_cut: true
      commit_sha: ${{ needs.resolve-dev-sha.outputs.dev_sha }}
      status_description: 'monitor-event-flow-hourly failed'
    secrets: inherit
