name: deploy-android-partner

on:
  workflow_call:
    inputs:
      target-ref:
        description: Git ref to deploy.
        required: false
        type: string
        default: ''
      deploy-stage:
        description: Deployment stage used for flavor/env selection.
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      target-ref:
        description: Git ref to deploy. Defaults to the selected workflow ref.
        required: false
        type: string
      deploy-stage:
        description: Deployment stage used for flavor/env selection. Defaults from target-ref/workflow ref.
        required: false
        type: string

concurrency:
  group: deploy-android-partner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/shared-android-deploy.yml
    with:
      app-name: partner
      app-directory: apps/app_partner
      package-name: com.minglit.app_partner
      gradle-cache-prefix: gradle-partner-
      artifact-name-apk: partner-app-dev-release.apk
      artifact-name-aab: partner-app-prod-release.aab
      notify-workflow-name: Android Deploy Partner
      target-ref: ${{ inputs.target-ref || github.ref }}
      deploy-stage: ${{ inputs.deploy-stage || ((inputs.target-ref == 'main' || inputs.target-ref == 'refs/heads/main' || (inputs.target-ref == '' && github.ref_name == 'main')) && 'main' || 'dev') }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SUPABASE_DEV_URL: ${{ secrets.SUPABASE_DEV_URL }}
      SUPABASE_DEV_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
      SUPABASE_MAIN_URL: ${{ secrets.SUPABASE_MAIN_URL }}
      SUPABASE_MAIN_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_MAIN_PUBLISHABLE_KEY }}
      SENTRY_DSN_FLUTTER: ${{ secrets.SENTRY_DSN_FLUTTER }}
      FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID_PARTNER_DEV }}
      FIREBASE_SERVICE_ACCOUNT_JSON_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_DEV }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      MINGLIT_RELEASE_BOT_APP_ID: ${{ secrets.MINGLIT_RELEASE_BOT_APP_ID }}
      MINGLIT_RELEASE_BOT_PRIVATE_KEY: ${{ secrets.MINGLIT_RELEASE_BOT_PRIVATE_KEY }}
      JUSO_CONFIRM_KEY: ${{ secrets.JUSO_CONFIRM_KEY }}
