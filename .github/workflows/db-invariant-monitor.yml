name: DB Invariant Monitor

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:       # Manual trigger

jobs:
  check:
    name: Run DB invariant checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Run check_db_invariants()
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_DEV_SECRET_KEY }}
        run: |
          RESPONSE=$(curl -sf \
            "${SUPABASE_URL}/rest/v1/rpc/check_db_invariants" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "Response: $RESPONSE"

          PASSED=$(echo "$RESPONSE" | jq -r '.passed')
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "response=$RESPONSE" >> "$GITHUB_OUTPUT"

          if [ "$PASSED" != "true" ]; then
            echo "::error::DB invariant violations detected"
            echo "$RESPONSE" | jq '.violations'
          fi

      - name: Create GitHub Issue on violation
        if: steps.check.outputs.passed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESPONSE: ${{ steps.check.outputs.response }}
        run: |
          VIOLATIONS=$(echo "$RESPONSE" | jq -r '.violations | map("| \(.id) | \(.severity) | \(.message) | \(.count) |") | join("\n")')
          CHECKED_AT=$(echo "$RESPONSE" | jq -r '.checked_at')

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "DB Invariant Violation — ${CHECKED_AT}" \
            --label "P0-critical,bug" \
            --body "## DB Invariant Violation

          | ID | Severity | Message | Count |
          |----|----------|---------|-------|
          ${VIOLATIONS}

          **Checked at**: ${CHECKED_AT}
          **Workflow**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ---
          *Auto-generated by DB Invariant Monitor (#1427)*"
