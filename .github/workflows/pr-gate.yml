name: pr-gate

on:
  workflow_call:
    inputs:
      stage:
        description: 'Logical gate stage: dev-staging, dev, rc, or main'
        required: false
        type: string
        default: 'dev'
      base_ref:
        description: 'Base branch used for diff-based checks when called as a reusable workflow'
        required: false
        type: string
        default: 'dev'
      run_cuj_integration:
        description: 'Debug-only CUJ switch. Regular CUJ health runs from monitor-dev-cuj on dev push.'
        required: false
        type: boolean
        default: false

concurrency:
  # Branch-specific wrappers own the user-facing required check name.
  # This reusable core only needs to avoid duplicate runs for the same caller/ref.
  group: pr-gate-core-${{ inputs.stage }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Consolidated fast read-only static checks that previously each ran in its own
  # ubuntu-latest job: migration version uniqueness + same-day gap warning,
  # env-manifest ↔ EnvKeyStore drift, workflow YAML parse validity, workflow
  # contract checks, androidx.test runner/orchestrator version alignment,
  # cross-feature import baseline, BLUEDOC freshness, and dev-staging PR issue
  # lifecycle intent.
  #
  # Why merge: each separate job paid runner startup + actions/checkout overhead
  # (~10-15s × 6 = ~70s of Actions minutes per PR). Combined into one job with a
  # shared checkout, that overhead is paid once. Wall time increases (checks run
  # sequentially instead of in parallel) by ~30-60s, but Actions minute usage and
  # workflow file complexity both drop.
  #
  # `if: ${{ !cancelled() }}` on each step lets later checks run after earlier
  # failures so the PR author sees the full failure list, not just the first one.
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # BLUEDOC freshness needs history for base-ref diff

      - name: Check PR issue reference
        if: ${{ !cancelled() }}
        env:
          PR_GATE_STAGE: ${{ inputs.stage }}
        run: bash .github/scripts/check-pr-issue-reference.sh

      - name: Check duplicate migration versions
        if: ${{ !cancelled() }}
        run: |
          VERSIONS=$(ls supabase/migrations/*.sql 2>/dev/null | xargs -n1 basename | cut -c1-14 | sort)
          DUPES=$(echo "$VERSIONS" | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "❌ Duplicate migration versions found:"
            echo "$DUPES"
            exit 1
          fi
          echo "✅ All migration versions unique ($(echo "$VERSIONS" | wc -l | tr -d ' ') files checked)"

      - name: Warn on same-day sequence gaps
        if: ${{ !cancelled() }}
        run: |
          GAP_FOUND=false
          for DATE in $(ls supabase/migrations/*.sql 2>/dev/null | xargs -n1 basename | sed 's/^\([0-9]\{8\}\).*/\1/' | sort -u); do
            SEQS=$(ls supabase/migrations/${DATE}*.sql 2>/dev/null | xargs -n1 basename | sed "s/^${DATE}\([0-9]*\)_.*/\1/" | sort -n)
            PREV=""
            for SEQ in $SEQS; do
              if [ -n "$PREV" ] && [ $((10#$SEQ - 10#$PREV)) -gt 1 ]; then
                echo "⚠️  Gap: ${DATE} jumps from ${PREV} to ${SEQ} — check KNOWN_GAPS.md or git history"
                GAP_FOUND=true
              fi
              PREV="$SEQ"
            done
          done
          if [ "$GAP_FOUND" = "true" ]; then
            echo "→ Undocumented gaps may indicate a deleted migration. Verify intentional."
          fi
          echo "✅ Sequence gap check complete"

      - name: Check env-manifest.json / EnvKeyStore sync
        if: ${{ !cancelled() }}
        run: bash scripts/check-env-manifest-sync.sh

      - name: Validate all workflow YAML files
        if: ${{ !cancelled() }}
        run: |
          FAILED=0
          for f in .github/workflows/*.yml; do
            if python3 -c "import yaml, sys; yaml.safe_load(open(sys.argv[1]))" "$f" 2>/dev/null; then
              echo "✅ $f"
            else
              echo "❌ YAML parse error: $f"
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "One or more workflow files failed YAML parsing."
            exit 1
          fi
          echo "✅ All workflow YAML files are valid"

      - name: Check Android deploy release archive contract
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check-android-deploy-workflow-contract.py

      - name: Check dev health workflow contract
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check-dev-soak-workflow-contract.py

      - name: Check dev cut workflow contract
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check-dev-cut-workflow-contract.py

      - name: Check residual DB hardening guards
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check-residual-db-hardening-guards.py

      - name: Check iOS deploy workflow contract
        if: ${{ !cancelled() }}
        run: bash .github/scripts/check-ios-deploy-branch-conditions.sh

      - name: Verify androidx.test runner/orchestrator version alignment
        if: ${{ !cancelled() }}
        # Fix #1780: runner와 orchestrator는 동일 major.minor 계열이어야 함 — Gradle
        # consistent resolution이 혼용 시 빌드 실패를 발생시키므로 사전 차단.
        run: |
          GRADLE_FILE="apps/app_user/android/app/build.gradle.kts"
          RUNNER=$(grep 'androidx\.test:runner:' "$GRADLE_FILE" | grep -oP '\d+\.\d+\.\d+' | head -1)
          ORCHESTRATOR=$(grep 'androidx\.test:orchestrator:' "$GRADLE_FILE" | grep -oP '\d+\.\d+\.\d+' | head -1)
          echo "runner: $RUNNER"
          echo "orchestrator: $ORCHESTRATOR"
          if [ -z "$RUNNER" ] || [ -z "$ORCHESTRATOR" ]; then
            echo "❌ Could not parse runner or orchestrator version from $GRADLE_FILE"
            exit 1
          fi
          RUNNER_MINOR=$(echo "$RUNNER" | cut -d. -f1,2)
          ORCHESTRATOR_MINOR=$(echo "$ORCHESTRATOR" | cut -d. -f1,2)
          if [ "$RUNNER_MINOR" != "$ORCHESTRATOR_MINOR" ]; then
            echo "❌ Version mismatch: runner $RUNNER vs orchestrator $ORCHESTRATOR"
            echo "Both must share the same major.minor series (e.g., both 1.5.x or both 1.6.x)"
            exit 1
          fi
          echo "✅ runner $RUNNER and orchestrator $ORCHESTRATOR are compatible ($RUNNER_MINOR series)"

      - name: Check cross-feature imports
        if: ${{ !cancelled() }}
        # Fix #1872: block new cross-feature imports; existing violations grandfathered in baseline.
        run: bash scripts/check-cross-feature-imports.sh

      - name: Check BLUEDOC freshness
        if: ${{ !cancelled() }}
        # 새 파일/폴더 추가 또는 파일 삭제 시 가장 가까운 ancestor BLUEDOC.md 갱신 강제.
        # 통과: 이정표 표 갱신 또는 BLUEDOC 의 '_Reviewed_' 날짜 bump.
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || inputs.base_ref && format('origin/{0}', inputs.base_ref) || 'origin/dev' }}
        run: |
          git fetch origin "${BASE_REF#origin/}" --depth=50 || true
          bash .github/scripts/check-bluedoc-freshness.sh

      - name: Build artifact secret scan self-test
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/scan-build-artifact-secrets.py --self-test

  # 변경 사항 감지 Job
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app_user: ${{ steps.filter.outputs.app_user }}
      app_partner: ${{ steps.filter.outputs.app_partner }}
      minglit_kit: ${{ steps.filter.outputs.minglit_kit }}
      minglit_lints: ${{ steps.filter.outputs.minglit_lints }}
      ios_connectivity_plus_cap: ${{ steps.filter.outputs.ios_connectivity_plus_cap }}
      demo_android: ${{ steps.filter.outputs.demo_android }}
      mds_core: ${{ steps.filter.outputs.mds_core }}
      app_user_or_kit: ${{ steps.filter.outputs.app_user == 'true' || steps.filter.outputs.minglit_kit == 'true' || steps.filter.outputs.mds_core == 'true' }}
      app_partner_or_kit: ${{ steps.filter.outputs.app_partner == 'true' || steps.filter.outputs.minglit_kit == 'true' || steps.filter.outputs.mds_core == 'true' }}
      kit_or_mds: ${{ steps.filter.outputs.minglit_kit == 'true' || steps.filter.outputs.mds_core == 'true' }}
      landing_user: ${{ steps.filter.outputs.landing_user }}
      landing_partner: ${{ steps.filter.outputs.landing_partner }}
      mds_docs: ${{ steps.filter.outputs.mds_docs }}
      mds_tokens: ${{ steps.filter.outputs.mds_tokens }}
      mds_icons: ${{ steps.filter.outputs.mds_icons }}
      supabase: ${{ steps.filter.outputs.supabase }}
      dart_files: ${{ steps.filter.outputs.dart_files }}
      artifact_secret_scan: ${{ steps.filter.outputs.artifact_secret_scan }}
      # 세분화 — 잡별 의존성에 맞춰 분리 (false positive 트리거 회피)
      supabase_migrations: ${{ steps.filter.outputs.supabase_migrations }}
      supabase_tests: ${{ steps.filter.outputs.supabase_tests }}
      supabase_functions: ${{ steps.filter.outputs.supabase_functions }}
      supabase_db_stack: ${{ steps.filter.outputs.supabase_migrations == 'true' || steps.filter.outputs.supabase_tests == 'true' }}
      supabase_ef_stack: ${{ steps.filter.outputs.supabase_migrations == 'true' || steps.filter.outputs.supabase_functions == 'true' }}
    steps:
    - uses: actions/checkout@v6
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        # merge_group 이벤트는 PR base 컨텍스트가 없어 paths-filter 가 비교 base 를
        # 못 찾고 전체 파일을 changed 로 잡음 → 큐의 batch 효율이 무너짐.
        # 명시적으로 큐의 base_ref(=dev) 와 비교하도록 지정.
        # workflow_call 은 caller 가 넘긴 base_ref 와 비교.
        # pull_request 이벤트일 때는 빈 값 → paths-filter 가 PR base 로 자동 fallback.
        base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_ref || inputs.base_ref || '' }}
        filters: |
          app_user:
            - 'apps/app_user/**'
          app_partner:
            - 'apps/app_partner/**'
          minglit_kit:
            - 'shared/packages/minglit_kit/**'
            - 'shared/packages/**'
          minglit_lints:
            - 'shared/packages/minglit_lints/**'
            - 'pubspec.yaml'
            - 'pubspec.lock'
          ios_connectivity_plus_cap:
            - 'pubspec.yaml'
            - 'pubspec.lock'
            - 'apps/app_user/pubspec.yaml'
            - 'apps/app_partner/pubspec.yaml'
            - 'shared/packages/minglit_kit/pubspec.yaml'
            - '.github/scripts/check-ios-connectivity-plus-cap.sh'
            - '.github/workflows/pr-gate.yml'
          demo_android:
            - '.github/workflows/pr-gate.yml'
            - 'pubspec.yaml'
            - 'pubspec.lock'
            - 'shared/packages/minglit_demo/**'
            - 'apps/app_user/lib/main_demo.dart'
            - 'apps/app_partner/lib/main_demo.dart'
            - 'apps/app_user/pubspec.yaml'
            - 'apps/app_partner/pubspec.yaml'
            - 'apps/app_user/android/app/build.gradle.kts'
            - 'apps/app_partner/android/app/build.gradle.kts'
            - 'apps/app_user/android/app/src/demo/**'
            - 'apps/app_partner/android/app/src/demo/**'
          mds_core:
            - 'shared/packages/mds/core/**'
          landing_user:
            - 'apps/landing_user/**'
            - 'shared/web/**'
          landing_partner:
            - 'apps/landing_partner/**'
            - 'shared/web/**'
          mds_docs:
            - 'apps/mds/docs/**'
          mds_tokens:
            - 'shared/packages/mds/tokens/**'
          mds_icons:
            - 'shared/packages/mds/icons/**'
          supabase:
            - 'supabase/**'
          dart_files:
            - '**/*.dart'
          artifact_secret_scan:
            - '.github/scripts/scan-build-artifact-secrets.py'
            - '.github/scripts/BLUEDOC.md'
            - '.github/workflows/pr-gate.yml'
          # migrations + seed + config — pgTAP / ef-integration 트리거
          supabase_migrations:
            - 'supabase/migrations/**'
            - 'supabase/seed*.sql'
            - 'supabase/config.toml'
          # pgTAP 테스트 파일 — pgTAP only
          supabase_tests:
            - 'supabase/tests/**'
          # EF 소스 + deno config — deno-ef / ef-integration 트리거
          # NOTE: dorny/paths-filter@v4 의 '!' negation 은 .some() OR 평가로 인해
          # filter 의도와 반대로 동작 (Fix #2669). negation 대신 explicit positive
          # patterns 로 .ts/.json/.npmrc 만 매치 → BLUEDOC.md / *.md 는 자연스레 제외.
          supabase_functions:
            - 'supabase/functions/**/*.ts'
            - 'supabase/functions/**/*.tsx'
            - 'supabase/functions/**/*.js'
            - 'supabase/functions/**/*.mjs'
            - 'supabase/functions/**/*.json'
            - 'supabase/functions/**/.npmrc'
            - 'supabase/deno.json'

  guard-ios-connectivity-plus-cap:
    name: guard-ios-connectivity-plus-cap
    needs: changes
    if: ${{ needs.changes.outputs.ios_connectivity_plus_cap == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'  # Fix #2640: flutter_quill 11.5.0 incompatible with Flutter 3.44.0
          cache: true
      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-ios-connectivity-plus-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install dependencies
        run: flutter pub get
      - name: Guard iOS connectivity_plus cap
        run: bash .github/scripts/check-ios-connectivity-plus-cap.sh

  test-minglit-lints:
    name: test-minglit-lints
    needs: changes
    if: ${{ needs.changes.outputs.minglit_lints == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'  # Fix #2640: flutter_quill 11.5.0 incompatible with Flutter 3.44.0
          cache: true
      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-minglit-lints-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install dependencies
        run: flutter pub get
      - name: Test minglit_lints
        run: dart test shared/packages/minglit_lints

  # App CI (User + Partner)
  test-flutter-apps:
    name: test-app-unit-widget-integration
    needs: changes
    if: ${{ needs.changes.outputs.app_user == 'true' || needs.changes.outputs.app_partner == 'true' || needs.changes.outputs.minglit_kit == 'true' || needs.changes.outputs.mds_core == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: app_user
            change_key: app_user_or_kit
            directory: apps/app_user
            report_name: 'User App Tests'
            artifact_name: app-user-coverage
            coverage_flag: app-user
            coverage_flag_logic: app-user-logic
          - app: app_partner
            change_key: app_partner_or_kit
            directory: apps/app_partner
            report_name: 'Partner App Tests'
            artifact_name: app-partner-coverage
            coverage_flag: app-partner
            coverage_flag_logic: app-partner-logic
          - app: minglit_kit
            change_key: minglit_kit
            directory: shared/packages/minglit_kit
            report_name: 'Minglit Kit Tests'
            artifact_name: minglit-kit-coverage
            coverage_flag: minglit-kit
            coverage_flag_logic: ''
          - app: mds_core
            change_key: mds_core
            directory: shared/packages/mds/core
            report_name: 'MDS Core Tests'
            artifact_name: mds-core-coverage
            coverage_flag: mds-core
            coverage_flag_logic: ''
    steps:
      - uses: actions/checkout@v6
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          # persist-credentials: false keeps the PAT out of git config during pub get,
          # analyze, and test steps; the PAT is injected only in the push step below.
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        with:
          flutter-version: '3.41.9'  # Fix #2640: flutter_quill 11.5.0 incompatible with Flutter 3.44.0
          cache: true
      - name: Cache pub packages
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install dependencies
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        run: flutter pub get
      - name: Analyze (minglit_kit)
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        run: flutter analyze --no-fatal-infos
        working-directory: shared/packages/minglit_kit
      - name: Analyze
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        run: flutter analyze --no-fatal-infos
        working-directory: ${{ matrix.directory }}
      - name: Custom lint (minglit_kit)
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        run: dart run custom_lint
        working-directory: .
      - name: Custom lint
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' && matrix.app != 'mds_core' }}
        run: dart run custom_lint
        working-directory: .
      - name: Test
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        run: dart run test_reporter -- flutter test --coverage --exclude-tags golden --file-reporter=json:test-results.json
        working-directory: ${{ matrix.directory }}
      - name: Integration Test
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' && (matrix.app == 'app_user' || matrix.app == 'app_partner') }}
        run: flutter test test/integration/
        working-directory: ${{ matrix.directory }}
      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ (success() || failure()) && needs.changes.outputs[matrix.change_key] == 'true' }}
        with:
          name: ${{ matrix.report_name }}
          path: ${{ matrix.directory }}/test-results.json
          reporter: dart-json
          fail-on-error: false
      - uses: actions/upload-artifact@v7
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.directory }}/coverage
      - name: Upload Allure Results
        uses: actions/upload-artifact@v7
        if: ${{ (success() || failure()) && needs.changes.outputs[matrix.change_key] == 'true' }}
        continue-on-error: true
        with:
          name: allure-results-${{ matrix.app }}
          path: ${{ matrix.directory }}/allure-results
          retention-days: 30
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        with:
          file: ${{ matrix.directory }}/coverage/lcov.info
          flags: ${{ matrix.coverage_flag }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload logic layer coverage
        uses: codecov/codecov-action@v6
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' && matrix.coverage_flag_logic != '' }}
        with:
          file: ${{ matrix.directory }}/coverage/lcov.info
          flags: ${{ matrix.coverage_flag_logic }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build-demo-android:
    name: build-demo-android
    needs: changes
    if: ${{ needs.changes.outputs.demo_android == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: app_user
            directory: apps/app_user
          - app: app_partner
            directory: apps/app_partner
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Tune Gradle memory for CI demo build
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx5G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError"
            echo "org.gradle.workers.max=2"
          } >> android/gradle.properties
        working-directory: ${{ matrix.directory }}
      - name: Build demo debug APK
        run: >
          flutter build apk
          --debug
          --flavor demo
          --target lib/main_demo.dart
          --dart-define=ENVIRONMENT=demo
          --dart-define=IS_DEMO=true
          --dart-define=SUPABASE_URL=https://demo.invalid
          --dart-define=SUPABASE_PUBLISHABLE_KEY=demo-publishable-key-not-used
        working-directory: ${{ matrix.directory }}

  # Landing User CI
  lint-landing-user:
    name: lint-and-build-landing-user
    needs: changes
    if: ${{ needs.changes.outputs.landing_user == 'true' || needs.changes.outputs.artifact_secret_scan == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/landing_user
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./apps/landing_user/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - name: Scan Next.js build artifact secrets
        run: python3 ../../.github/scripts/scan-build-artifact-secrets.py .next

  # Landing Partner CI
  lint-landing-partner:
    name: lint-and-build-landing-partner
    needs: changes
    if: ${{ needs.changes.outputs.landing_partner == 'true' || needs.changes.outputs.artifact_secret_scan == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/landing_partner
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./apps/landing_partner/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - name: Scan Next.js build artifact secrets
        run: python3 ../../.github/scripts/scan-build-artifact-secrets.py .next

  # Flutter release artifact secret scan (Android first; iOS requires macOS/signing deploy context).
  scan-flutter-artifact-secrets:
    name: scan-build-artifact-secrets
    needs: changes
    if: ${{ needs.changes.outputs.app_user == 'true' || needs.changes.outputs.app_partner == 'true' || needs.changes.outputs.artifact_secret_scan == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: app_user
            change_key: app_user
            directory: apps/app_user
          - app: app_partner
            change_key: app_partner
            directory: apps/app_partner
    defaults:
      run:
        working-directory: ./${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v6
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' || needs.changes.outputs.artifact_secret_scan == 'true' }}

      - name: Set up JDK 17
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' || needs.changes.outputs.artifact_secret_scan == 'true' }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: ${{ matrix.directory }}/android/build.gradle.kts

      - uses: subosito/flutter-action@v2
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' || needs.changes.outputs.artifact_secret_scan == 'true' }}
        with:
          flutter-version: '3.41.9'  # Fix #2640: flutter_quill 11.5.0 incompatible with Flutter 3.44.0
          cache: true

      - name: Cache Gradle
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' || needs.changes.outputs.artifact_secret_scan == 'true' }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ matrix.directory }}/android/.gradle
          key: ${{ runner.os }}-artifact-secret-scan-${{ matrix.app }}-${{ hashFiles(format('{0}/android/**/*.gradle.kts', matrix.directory), format('{0}/android/gradle/wrapper/gradle-wrapper.properties', matrix.directory)) }}
          restore-keys: |
            ${{ runner.os }}-artifact-secret-scan-${{ matrix.app }}-

      - name: Get dependencies
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' || needs.changes.outputs.artifact_secret_scan == 'true' }}
        run: flutter pub get

      - name: Decode Keystore
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' || needs.changes.outputs.artifact_secret_scan == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is required for release artifact scan}"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' || needs.changes.outputs.artifact_secret_scan == 'true' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required for release artifact scan}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required for release artifact scan}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required for release artifact scan}"
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build dev release APK
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' || needs.changes.outputs.artifact_secret_scan == 'true' }}
        env:
          SUPABASE_DEV_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_DEV_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
          SENTRY_DSN_FLUTTER: ${{ secrets.SENTRY_DSN_FLUTTER }}
          JUSO_CONFIRM_KEY: ${{ secrets.JUSO_CONFIRM_KEY }}
        run: |
          flutter build apk \
            --flavor dev \
            --release \
            --obfuscate \
            --split-debug-info=build/symbols/dev \
            --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL="$SUPABASE_DEV_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_DEV_PUBLISHABLE_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN_FLUTTER" \
            --dart-define=ENVIRONMENT=development \
            --dart-define=JUSO_CONFIRM_KEY="$JUSO_CONFIRM_KEY"

      - name: Build dev release AAB
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' || needs.changes.outputs.artifact_secret_scan == 'true' }}
        env:
          SUPABASE_DEV_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_DEV_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
          SENTRY_DSN_FLUTTER: ${{ secrets.SENTRY_DSN_FLUTTER }}
          JUSO_CONFIRM_KEY: ${{ secrets.JUSO_CONFIRM_KEY }}
        run: |
          flutter build appbundle \
            --flavor dev \
            --release \
            --obfuscate \
            --split-debug-info=build/symbols/dev \
            --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL="$SUPABASE_DEV_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_DEV_PUBLISHABLE_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN_FLUTTER" \
            --dart-define=ENVIRONMENT=development \
            --dart-define=JUSO_CONFIRM_KEY="$JUSO_CONFIRM_KEY"

      - name: Scan Flutter build artifact secrets
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' || needs.changes.outputs.artifact_secret_scan == 'true' }}
        working-directory: .
        run: |
          python3 .github/scripts/scan-build-artifact-secrets.py \
            "${{ matrix.directory }}/build/app/outputs/flutter-apk" \
            "${{ matrix.directory }}/build/app/outputs/bundle"

  # MDS Docs CI
  lint-mds-docs:
    name: lint-and-build-mds-docs
    needs: changes
    if: ${{ needs.changes.outputs.mds_docs == 'true' || needs.changes.outputs.mds_tokens == 'true' || needs.changes.outputs.mds_icons == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/mds/docs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run lint
      - run: npm run build
      - name: Build from repo root
        working-directory: .
        run: ./apps/mds/docs/node_modules/.bin/next build apps/mds/docs

  # MDS Icons CI — flutter analyze + npm build (codegen)
  lint-mds-icons:
    name: lint-mds-icons
    needs: changes
    if: ${{ needs.changes.outputs.mds_icons == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./shared/packages/mds/icons
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'  # Fix #2640: flutter_quill 11.5.0 incompatible with Flutter 3.44.0
          cache: true
      - uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-mds-icons-${{ hashFiles('shared/packages/mds/icons/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-mds-icons-
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./shared/packages/mds/icons/package-lock.json
      - run: npm ci
      - run: npm run build
        # Verify codegen runs cleanly and produces no diff against committed
        # icons.g.dart / manifest.json (drift detection).
      - name: Check codegen drift
        run: |
          if ! git diff --quiet lib/generated/icons.g.dart manifest.json; then
            echo "❌ Codegen drift detected. Run 'npm run build' and commit."
            git diff lib/generated/icons.g.dart manifest.json
            exit 1
          fi
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  # Supabase 통합 테스트 (pgTAP + backend-integration + e2e-scenarios)
  test-supabase:
    name: test-pgtap
    needs: changes
    # migrations / pgTAP tests / seed / config 변경 시만. EF source 만 바뀌면 skip.
    if: ${{ needs.changes.outputs.supabase_db_stack == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'  # Fix #2640: flutter_quill 11.5.0 incompatible with Flutter 3.44.0
          cache: true
      # Defensive cleanup in case the runner image or a retry leaves local
      # Supabase containers/volumes behind.
      - name: Reset stale Supabase state
        run: supabase stop --no-backup 2>/dev/null || true
      - name: Start Supabase
        # PostgREST can be unhealthy before `supabase db reset` creates all
        # configured schemas (for example `admin`). The DB is still available
        # for reset, so do not fail this setup step on pre-migration REST health.
        run: supabase start --ignore-health-check
      - name: Validate migrations (dry-run)
        run: |
          echo "🔄 Resetting DB and re-applying all migrations from scratch..."
          supabase db reset
          echo "✅ All migrations applied successfully"
      - name: Test (pgTAP)
        run: supabase test db
      - name: Stop Supabase
        if: always()
        # --no-backup wipes volumes on stop too, so the next run on this host
        # starts cleanly even if this run's setup step is skipped.
        run: supabase stop --no-backup

  # Deno Edge Function 테스트 (supabase 불필요)
  test-edge-functions:
    name: test-deno-ef
    needs: changes
    # EF source / deno.json 변경 시만. migrations / 문서 only 면 skip.
    if: ${{ needs.changes.outputs.supabase_functions == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # diff-cover 가 base 와의 merge base 찾으려면 full history 필요
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache Deno deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: ${{ runner.os }}-deno-${{ hashFiles('supabase/functions/**/deno.lock', 'supabase/functions/**/deno.json') }}
          restore-keys: ${{ runner.os }}-deno-
      - name: Validate deno.json presence
        run: |
          missing=()
          for dir in functions/*/; do
            name=$(basename "$dir")
            if [[ "$name" != _* ]] && [ ! -f "${dir}deno.json" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ deno.json missing in the following Edge Functions:"
            for ef in "${missing[@]}"; do
              echo "  - $ef"
            done
            exit 1
          fi
          echo "✅ All Edge Functions have deno.json"
        working-directory: supabase
      - name: Lint #4 — no legacy auth helpers (Fix #2184)
        run: |
          violations=()
          for f in functions/*/index.ts; do
            ef=$(basename "$(dirname "$f")")
            # Exclude comment-only lines (// ...) before checking
            if grep -v '^\s*//' "$f" | grep -qE 'from.*_shared/auth_utils|withHandler\b|withSentry\b|withSentryHandler\b|requireServiceRole\b|requireAuth\b|optionalAuth\b'; then
              violations+=("$ef")
            fi
          done
          if [ ${#violations[@]} -gt 0 ]; then
            echo "❌ Legacy auth helpers found in the following Edge Functions:"
            for ef in "${violations[@]}"; do
              echo "  - $ef"
              grep -v '^\s*//' "functions/${ef}/index.ts" | grep -nE 'from.*_shared/auth_utils|withHandler\b|withSentry\b|withSentryHandler\b|requireServiceRole\b|requireAuth\b|optionalAuth\b' || true
            done
            echo ""
            echo "Use minglitEdgeFunction from _shared/edge_function.ts instead."
            echo "See docs/architecture/edge-function-auth.md for migration guide."
            exit 1
          fi
          echo "✅ No legacy auth helpers found"
        working-directory: supabase
      - name: Test (edge functions) — with coverage
        run: deno test --allow-all --coverage=cov_profile functions/
        working-directory: supabase

      - name: Generate LCOV
        run: deno coverage --lcov cov_profile > coverage.lcov
        working-directory: supabase

      - name: Fetch base branch for diff
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=200

      - name: Diff coverage gate (≥90% on changed lines)
        if: github.event_name == 'pull_request'
        run: |
          python3 -m pip install --quiet --user diff-cover
          export PATH="$HOME/.local/bin:$PATH"
          diff-cover supabase/coverage.lcov \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=90 \
            --markdown-report=diff-cover.md \
            --include 'supabase/functions/**/*.ts' \
            --exclude 'supabase/functions/**/*_test.ts'

      - name: Upload diff-cover report
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v7
        with:
          name: diff-cover-report
          path: diff-cover.md
          if-no-files-found: ignore

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: diff-cover.md
          header: deno-diff-coverage
        continue-on-error: true

  # EF integration test — 빈 local Supabase + 외부 mock 으로 실 schema/trigger/RLS contract 검증
  # 설계: supabase/functions/_integration_tests/architecture.md
  test-ef-integration:
    name: test-ef-integration
    needs: [changes, test-supabase]
    # migrations 또는 EF source 변경 시 (full stack 가드). 문서/pgTAP only 면 skip.
    # Supabase CLI uses the configured project id for local Docker container
    # names, so pgTAP and EF integration must not start the same stack in
    # parallel on the same runner.
    if: >-
      ${{
        !cancelled() &&
        needs.changes.outputs.supabase_ef_stack == 'true' &&
        (needs.test-supabase.result == 'success' || needs.test-supabase.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Defensive cleanup in case a retry leaves local Supabase containers behind.
      - name: Reset stale Supabase state
        run: supabase stop --no-backup 2>/dev/null || true

      - name: Start local Supabase
        # Same rationale as pgTAP: migrations run after startup, so schema-cache
        # health can be temporarily red before `db reset --no-seed`.
        run: supabase start --ignore-health-check

      - name: Apply migrations only (db reset --no-seed)
        run: supabase db reset --no-seed

      - name: Capture supabase env
        id: env
        run: |
          {
            echo "url=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2-)"
            echo "service_role_key=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2-)"
            echo "anon_key=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2-)"
          } >> "$GITHUB_OUTPUT"

      - name: Run integration tests
        env:
          SUPABASE_URL: ${{ steps.env.outputs.url }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.env.outputs.service_role_key }}
          SUPABASE_ANON_KEY: ${{ steps.env.outputs.anon_key }}
          SIM_USER_PASSWORD: ${{ secrets.SIM_USER_PASSWORD }}
        run: deno test --allow-all supabase/functions/_integration_tests/cuj/

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

  # check-workflow-yaml, check-android-test-deps, check-cross-feature-imports
  # consolidated into `static-checks` job at top of this file.

  # Runs `dart format` on .dart-touching PRs and pushes a `chore: auto-format`
  # commit back to the PR branch when there's a diff. The format-check variant
  # (introduced in #2627) was reverted because failing CI on format issues
  # forced AI workers to do a second round-trip; auto-fix keeps the loop tight.
  # Fork PRs skip (can't push back), un-formatted code there fails downstream
  # build steps instead.
  auto-format:
    needs: changes
    if: ${{ needs.changes.outputs.dart_files == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # Use the same release bot for workflow write-backs. The old
      # minglit-agent-code-review app credentials are no longer part of the
      # branch-policy bot set.
      - name: Generate release bot token
        id: release-bot
        uses: ./.github/actions/release-bot-token
        with:
          fallback-app-id: ${{ secrets.MINGLIT_RELEASE_BOT_APP_ID }}
          fallback-private-key: ${{ secrets.MINGLIT_RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.release-bot.outputs.token }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'  # Fix #2640: flutter_quill 11.5.0 incompatible with Flutter 3.44.0
          cache: true
      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/app_user
      - name: Minglit Kit — Format
        run: dart format .
        working-directory: shared/packages/minglit_kit
      - name: App User — Format
        run: dart format .
        working-directory: apps/app_user
      - name: App Partner — Format
        run: dart format .
        working-directory: apps/app_partner
      - name: Commit changes if needed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "minglit-release-bot"
            git config user.email "minglit-release-bot@users.noreply.github.com"
            git add -- '**/*.dart'
            git commit -m "chore: auto-format"
            git push origin HEAD:"${GITHUB_HEAD_REF}"
          else
            echo "No formatting changes needed"
          fi

  # Gitleaks secret scan — formerly pr-setup-secret-scan.yml, absorbed into pr-gate as a required check.
  # Re-enabled 2026-05-20 (Fix #2541): swapped gitleaks/gitleaks-action@v2 (paid license for org repos)
  # → raw `gitleaks` binary from upstream release. Same `.gitleaks.toml` config, same exit-code semantics.
  # Scope: scans only the commits introduced by the PR (or merge-group / pushed range), NOT the full
  # repo history — historical leaks that were since removed (e.g. dev_main.dart in 2025-12) stay out
  # of the gate, while any new leak in the PR diff fails CI.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: '8.21.2'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Determine scan scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || inputs.base_ref || 'dev' }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              log_opts="origin/${BASE_REF}..HEAD"
              ;;
            merge_group)
              log_opts="${MERGE_BASE_SHA}..HEAD"
              ;;
            workflow_call)
              git fetch origin "${BASE_REF}" --depth=200
              log_opts="origin/${BASE_REF}..HEAD"
              ;;
            push)
              if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
                log_opts="HEAD~1..HEAD"
              else
                log_opts="${BEFORE_SHA}..HEAD"
              fi
              ;;
            *)
              log_opts="HEAD~1..HEAD"
              ;;
          esac
          echo "log_opts=${log_opts}" >> "$GITHUB_OUTPUT"
          echo "::notice::gitleaks scanning commits ${log_opts}"
      - name: Run gitleaks
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --source . \
            --log-opts="${{ steps.scope.outputs.log_opts }}" \
            --no-banner \
            --redact \
            --verbose

  # check-bluedoc-freshness consolidated into `static-checks` job at top of this file.

  # CUJ integration tests on emulator — reusable workflow.
  # Engine + BLUEDOC: apps/<app>/integration_test/cuj/BLUEDOC.md
  # Manual debug: `gh workflow run shared-cuj-integration.yml -f app-name=user --ref <branch>`
  test-integration-app-user-cuj:
    name: cuj-integration-user
    needs: changes
    if: inputs.run_cuj_integration && needs.changes.outputs.app_user_or_kit == 'true'
    uses: ./.github/workflows/shared-cuj-integration.yml
    with:
      app-name: user
    secrets: inherit

  test-integration-app-partner-cuj:
    name: cuj-integration-partner
    needs: changes
    if: inputs.run_cuj_integration && needs.changes.outputs.app_partner_or_kit == 'true'
    uses: ./.github/workflows/shared-cuj-integration.yml
    with:
      app-name: partner
    secrets: inherit
