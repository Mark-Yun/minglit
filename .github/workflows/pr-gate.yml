name: pr-gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "dev" ]
  merge_group:

concurrency:
  # merge_group 이벤트는 절대 cancel 금지 — 큐 전체가 thrash됨.
  # PR 단계(pull_request)에서만 새 푸시 시 이전 run cancel.
  group: pr-gate-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Consolidated fast read-only static checks: 6 verifications that previously each
  # ran in its own ubuntu-latest job (migration version uniqueness + same-day gap
  # warning, env-manifest ↔ EnvKeyStore drift, workflow YAML parse validity,
  # androidx.test runner/orchestrator version alignment, cross-feature import
  # baseline, BLUEDOC freshness).
  #
  # Why merge: each separate job paid runner startup + actions/checkout overhead
  # (~10-15s × 6 = ~70s of Actions minutes per PR). Combined into one job with a
  # shared checkout, that overhead is paid once. Wall time increases (checks run
  # sequentially instead of in parallel) by ~30-60s, but Actions minute usage and
  # workflow file complexity both drop.
  #
  # `if: ${{ !cancelled() }}` on each step lets later checks run after earlier
  # failures so the PR author sees the full failure list, not just the first one.
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # BLUEDOC freshness needs history for base-ref diff

      - name: Check duplicate migration versions
        if: ${{ !cancelled() }}
        run: |
          VERSIONS=$(ls supabase/migrations/*.sql 2>/dev/null | xargs -n1 basename | cut -c1-14 | sort)
          DUPES=$(echo "$VERSIONS" | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "❌ Duplicate migration versions found:"
            echo "$DUPES"
            exit 1
          fi
          echo "✅ All migration versions unique ($(echo "$VERSIONS" | wc -l | tr -d ' ') files checked)"

      - name: Warn on same-day sequence gaps
        if: ${{ !cancelled() }}
        run: |
          GAP_FOUND=false
          for DATE in $(ls supabase/migrations/*.sql 2>/dev/null | xargs -n1 basename | sed 's/^\([0-9]\{8\}\).*/\1/' | sort -u); do
            SEQS=$(ls supabase/migrations/${DATE}*.sql 2>/dev/null | xargs -n1 basename | sed "s/^${DATE}\([0-9]*\)_.*/\1/" | sort -n)
            PREV=""
            for SEQ in $SEQS; do
              if [ -n "$PREV" ] && [ $((10#$SEQ - 10#$PREV)) -gt 1 ]; then
                echo "⚠️  Gap: ${DATE} jumps from ${PREV} to ${SEQ} — check KNOWN_GAPS.md or git history"
                GAP_FOUND=true
              fi
              PREV="$SEQ"
            done
          done
          if [ "$GAP_FOUND" = "true" ]; then
            echo "→ Undocumented gaps may indicate a deleted migration. Verify intentional."
          fi
          echo "✅ Sequence gap check complete"

      - name: Check env-manifest.json / EnvKeyStore sync
        if: ${{ !cancelled() }}
        run: bash scripts/check-env-manifest-sync.sh

      - name: Validate all workflow YAML files
        if: ${{ !cancelled() }}
        run: |
          FAILED=0
          for f in .github/workflows/*.yml; do
            if python3 -c "import yaml, sys; yaml.safe_load(open(sys.argv[1]))" "$f" 2>/dev/null; then
              echo "✅ $f"
            else
              echo "❌ YAML parse error: $f"
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "One or more workflow files failed YAML parsing."
            exit 1
          fi
          echo "✅ All workflow YAML files are valid"

      - name: Verify androidx.test runner/orchestrator version alignment
        if: ${{ !cancelled() }}
        # Fix #1780: runner와 orchestrator는 동일 major.minor 계열이어야 함 — Gradle
        # consistent resolution이 혼용 시 빌드 실패를 발생시키므로 사전 차단.
        run: |
          GRADLE_FILE="apps/app_user/android/app/build.gradle.kts"
          RUNNER=$(grep 'androidx\.test:runner:' "$GRADLE_FILE" | grep -oP '\d+\.\d+\.\d+' | head -1)
          ORCHESTRATOR=$(grep 'androidx\.test:orchestrator:' "$GRADLE_FILE" | grep -oP '\d+\.\d+\.\d+' | head -1)
          echo "runner: $RUNNER"
          echo "orchestrator: $ORCHESTRATOR"
          if [ -z "$RUNNER" ] || [ -z "$ORCHESTRATOR" ]; then
            echo "❌ Could not parse runner or orchestrator version from $GRADLE_FILE"
            exit 1
          fi
          RUNNER_MINOR=$(echo "$RUNNER" | cut -d. -f1,2)
          ORCHESTRATOR_MINOR=$(echo "$ORCHESTRATOR" | cut -d. -f1,2)
          if [ "$RUNNER_MINOR" != "$ORCHESTRATOR_MINOR" ]; then
            echo "❌ Version mismatch: runner $RUNNER vs orchestrator $ORCHESTRATOR"
            echo "Both must share the same major.minor series (e.g., both 1.5.x or both 1.6.x)"
            exit 1
          fi
          echo "✅ runner $RUNNER and orchestrator $ORCHESTRATOR are compatible ($RUNNER_MINOR series)"

      - name: Check cross-feature imports
        if: ${{ !cancelled() }}
        # Fix #1872: block new cross-feature imports; existing violations grandfathered in baseline.
        run: bash scripts/check-cross-feature-imports.sh

      - name: Check BLUEDOC freshness
        if: ${{ !cancelled() }}
        # 새 파일/폴더 추가 또는 파일 삭제 시 가장 가까운 ancestor BLUEDOC.md 갱신 강제.
        # 통과: 이정표 표 갱신 또는 BLUEDOC 의 '_Reviewed_' 날짜 bump.
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref || 'dev' }}
        run: |
          git fetch origin "${BASE_REF#origin/}" --depth=50 || true
          bash .github/scripts/check-bluedoc-freshness.sh

  # 변경 사항 감지 Job
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app_user: ${{ steps.filter.outputs.app_user }}
      app_partner: ${{ steps.filter.outputs.app_partner }}
      minglit_kit: ${{ steps.filter.outputs.minglit_kit }}
      mds_core: ${{ steps.filter.outputs.mds_core }}
      app_user_or_kit: ${{ steps.filter.outputs.app_user == 'true' || steps.filter.outputs.minglit_kit == 'true' || steps.filter.outputs.mds_core == 'true' }}
      app_partner_or_kit: ${{ steps.filter.outputs.app_partner == 'true' || steps.filter.outputs.minglit_kit == 'true' || steps.filter.outputs.mds_core == 'true' }}
      kit_or_mds: ${{ steps.filter.outputs.minglit_kit == 'true' || steps.filter.outputs.mds_core == 'true' }}
      landing_user: ${{ steps.filter.outputs.landing_user }}
      landing_partner: ${{ steps.filter.outputs.landing_partner }}
      mds_docs: ${{ steps.filter.outputs.mds_docs }}
      mds_tokens: ${{ steps.filter.outputs.mds_tokens }}
      mds_icons: ${{ steps.filter.outputs.mds_icons }}
      supabase: ${{ steps.filter.outputs.supabase }}
      dart_files: ${{ steps.filter.outputs.dart_files }}
    steps:
    - uses: actions/checkout@v6
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        # merge_group 이벤트는 PR base 컨텍스트가 없어 paths-filter 가 비교 base 를
        # 못 찾고 전체 파일을 changed 로 잡음 → 큐의 batch 효율이 무너짐.
        # 명시적으로 큐의 base_ref(=dev) 와 비교하도록 지정.
        # pull_request 이벤트일 때는 빈 값 → paths-filter 가 PR base 로 자동 fallback.
        base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_ref || '' }}
        filters: |
          app_user:
            - 'apps/app_user/**'
          app_partner:
            - 'apps/app_partner/**'
          minglit_kit:
            - 'shared/packages/minglit_kit/**'
            - 'shared/packages/**'
          mds_core:
            - 'shared/packages/mds/core/**'
          landing_user:
            - 'apps/landing_user/**'
            - 'shared/web/**'
          landing_partner:
            - 'apps/landing_partner/**'
            - 'shared/web/**'
          mds_docs:
            - 'apps/mds/docs/**'
          mds_tokens:
            - 'shared/packages/mds/tokens/**'
          mds_icons:
            - 'shared/packages/mds/icons/**'
          supabase:
            - 'supabase/**'
          dart_files:
            - '**/*.dart'

  # App CI (User + Partner)
  test-flutter-apps:
    name: test-app-unit-widget-golden
    needs: changes
    if: ${{ needs.changes.outputs.app_user == 'true' || needs.changes.outputs.app_partner == 'true' || needs.changes.outputs.minglit_kit == 'true' || needs.changes.outputs.mds_core == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: app_user
            change_key: app_user_or_kit
            directory: apps/app_user
            report_name: 'User App Tests'
            artifact_name: app-user-coverage
            coverage_flag: app-user
            coverage_flag_logic: app-user-logic
          - app: app_partner
            change_key: app_partner_or_kit
            directory: apps/app_partner
            report_name: 'Partner App Tests'
            artifact_name: app-partner-coverage
            coverage_flag: app-partner
            coverage_flag_logic: app-partner-logic
          - app: minglit_kit
            change_key: minglit_kit
            directory: shared/packages/minglit_kit
            report_name: 'Minglit Kit Tests'
            artifact_name: minglit-kit-coverage
            coverage_flag: minglit-kit
            coverage_flag_logic: ''
          - app: mds_core
            change_key: mds_core
            directory: shared/packages/mds/core
            report_name: 'MDS Core Tests'
            artifact_name: mds-core-coverage
            coverage_flag: mds-core
            coverage_flag_logic: ''
    steps:
      - uses: actions/checkout@v6
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          # persist-credentials: false keeps the PAT out of git config during pub get,
          # analyze, and test steps; the PAT is injected only in the push step below.
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        with:
          channel: 'stable'
          cache: true
      - name: Cache pub packages
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install dependencies
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        run: flutter pub get
      - name: Analyze (minglit_kit)
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        run: flutter analyze --no-fatal-infos
        working-directory: shared/packages/minglit_kit
      - name: Analyze
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        run: flutter analyze --no-fatal-infos
        working-directory: ${{ matrix.directory }}
      - name: Test
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        run: dart run test_reporter -- flutter test --coverage --exclude-tags golden --file-reporter=json:test-results.json
        working-directory: ${{ matrix.directory }}
      - name: Integration Test
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' && (matrix.app == 'app_user' || matrix.app == 'app_partner') }}
        run: flutter test test/integration/
        working-directory: ${{ matrix.directory }}
      - name: Golden Test (comparison)
        id: golden_compare
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        continue-on-error: true
        run: |
          # Alchemist CI mode: compare against committed CI goldens (Ahem font).
          # Exit 79 = no tests matched the tag.
          set +e
          flutter test --dart-define=CI=true --tags golden
          rc=$?
          set -e
          if [ "$rc" -eq 79 ]; then exit 0; fi
          exit "$rc"
        working-directory: ${{ matrix.directory }}
      - name: Upload golden failures
        if: ${{ steps.golden_compare.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: golden-failures-${{ matrix.app }}
          path: ${{ matrix.directory }}/test/**/failures/
          retention-days: 14
      - name: Regenerate goldens
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        run: |
          set +e
          flutter test --dart-define=CI=true --tags golden --update-goldens
          rc=$?
          set -e
          if [ "$rc" -eq 79 ]; then exit 0; fi
          exit "$rc"
        working-directory: ${{ matrix.directory }}
      - name: Auto-commit updated goldens
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' && github.event_name == 'pull_request' }}
        env:
          PR_BRANCH: ${{ github.head_ref }}
          # PAT injected only here, not during pub get/analyze/test above.
          GH_PAT: ${{ secrets.GH_PAT_VERSION_BUMP }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '**/goldens/ci/**'
          if git diff --cached --quiet; then
            echo "No golden changes to commit"
          else
            git commit -m "chore(golden): update CI goldens on Linux runner [skip ci]"
            git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"
            for i in 1 2 3; do
              git pull --rebase origin "${PR_BRANCH}" 2>/dev/null || true
              git push origin "HEAD:${PR_BRANCH}" && break
              echo "Push attempt $i failed, retrying in 5s..."
              sleep 5
            done
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
      - name: Fail if golden comparison detected mismatch
        if: ${{ steps.golden_compare.outcome == 'failure' }}
        run: |
          echo "Golden comparison step detected mismatches."
          echo "Updated goldens have been auto-committed for review."
          exit 1
      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ (success() || failure()) && needs.changes.outputs[matrix.change_key] == 'true' }}
        with:
          name: ${{ matrix.report_name }}
          path: ${{ matrix.directory }}/test-results.json
          reporter: dart-json
          fail-on-error: false
      - uses: actions/upload-artifact@v7
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.directory }}/coverage
      - name: Upload Allure Results
        uses: actions/upload-artifact@v7
        if: ${{ (success() || failure()) && needs.changes.outputs[matrix.change_key] == 'true' }}
        continue-on-error: true
        with:
          name: allure-results-${{ matrix.app }}
          path: ${{ matrix.directory }}/allure-results
          retention-days: 30
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        with:
          file: ${{ matrix.directory }}/coverage/lcov.info
          flags: ${{ matrix.coverage_flag }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload logic layer coverage
        uses: codecov/codecov-action@v6
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' && matrix.coverage_flag_logic != '' }}
        with:
          file: ${{ matrix.directory }}/coverage/lcov.info
          flags: ${{ matrix.coverage_flag_logic }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Landing User CI
  lint-landing-user:
    name: lint-and-build-landing-user
    needs: changes
    if: ${{ needs.changes.outputs.landing_user == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/landing_user
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./apps/landing_user/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  # Landing Partner CI
  lint-landing-partner:
    name: lint-and-build-landing-partner
    needs: changes
    if: ${{ needs.changes.outputs.landing_partner == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/landing_partner
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./apps/landing_partner/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  # MDS Docs CI
  lint-mds-docs:
    name: lint-and-build-mds-docs
    needs: changes
    if: ${{ needs.changes.outputs.mds_docs == 'true' || needs.changes.outputs.mds_tokens == 'true' || needs.changes.outputs.mds_icons == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/mds/docs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run lint
      - run: npm run build

  # MDS Icons CI — flutter analyze + npm build (codegen)
  lint-mds-icons:
    name: lint-mds-icons
    needs: changes
    if: ${{ needs.changes.outputs.mds_icons == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./shared/packages/mds/icons
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-mds-icons-${{ hashFiles('shared/packages/mds/icons/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-mds-icons-
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./shared/packages/mds/icons/package-lock.json
      - run: npm ci
      - run: npm run build
        # Verify codegen runs cleanly and produces no diff against committed
        # icons.g.dart / manifest.json (drift detection).
      - name: Check codegen drift
        run: |
          if ! git diff --quiet lib/generated/icons.g.dart manifest.json; then
            echo "❌ Codegen drift detected. Run 'npm run build' and commit."
            git diff lib/generated/icons.g.dart manifest.json
            exit 1
          fi
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  # Supabase 통합 테스트 (pgTAP + backend-integration + e2e-scenarios)
  test-supabase:
    name: test-pgtap
    needs: changes
    if: ${{ needs.changes.outputs.supabase == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      # Wipe any volume left by a prior run on this host so `supabase start`
      # initializes a fresh DB and auto-applies all migrations from scratch.
      # Required on shared self-hosted runners — otherwise the next start
      # restores from the previous volume (which may pre-date schema-touching
      # migrations like admin/) and PostgREST 503s on schema cache load.
      - name: Reset stale Supabase state
        run: supabase stop --no-backup 2>/dev/null || true
      - name: Start Supabase
        run: supabase start
      - name: Validate migrations (dry-run)
        run: |
          echo "🔄 Resetting DB and re-applying all migrations from scratch..."
          supabase db reset
          echo "✅ All migrations applied successfully"
      - name: Test (pgTAP)
        run: supabase test db
      - name: Stop Supabase
        if: always()
        # --no-backup wipes volumes on stop too, so the next run on this host
        # starts cleanly even if this run's setup step is skipped.
        run: supabase stop --no-backup

  # Deno Edge Function 테스트 (supabase 불필요)
  test-edge-functions:
    name: test-deno-ef
    needs: changes
    if: ${{ needs.changes.outputs.supabase == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # diff-cover 가 base 와의 merge base 찾으려면 full history 필요
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache Deno deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: ${{ runner.os }}-deno-${{ hashFiles('supabase/functions/**/deno.lock', 'supabase/functions/**/deno.json') }}
          restore-keys: ${{ runner.os }}-deno-
      - name: Validate deno.json presence
        run: |
          missing=()
          for dir in functions/*/; do
            name=$(basename "$dir")
            if [[ "$name" != _* ]] && [ ! -f "${dir}deno.json" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ deno.json missing in the following Edge Functions:"
            for ef in "${missing[@]}"; do
              echo "  - $ef"
            done
            exit 1
          fi
          echo "✅ All Edge Functions have deno.json"
        working-directory: supabase
      - name: Lint #4 — no legacy auth helpers (Fix #2184)
        run: |
          violations=()
          for f in functions/*/index.ts; do
            ef=$(basename "$(dirname "$f")")
            # Exclude comment-only lines (// ...) before checking
            if grep -v '^\s*//' "$f" | grep -qE 'from.*_shared/auth_utils|withHandler\b|withSentry\b|withSentryHandler\b|requireServiceRole\b|requireAuth\b|optionalAuth\b'; then
              violations+=("$ef")
            fi
          done
          if [ ${#violations[@]} -gt 0 ]; then
            echo "❌ Legacy auth helpers found in the following Edge Functions:"
            for ef in "${violations[@]}"; do
              echo "  - $ef"
              grep -v '^\s*//' "functions/${ef}/index.ts" | grep -nE 'from.*_shared/auth_utils|withHandler\b|withSentry\b|withSentryHandler\b|requireServiceRole\b|requireAuth\b|optionalAuth\b' || true
            done
            echo ""
            echo "Use minglitEdgeFunction from _shared/edge_function.ts instead."
            echo "See docs/architecture/edge-function-auth.md for migration guide."
            exit 1
          fi
          echo "✅ No legacy auth helpers found"
        working-directory: supabase
      - name: Test (edge functions) — with coverage
        run: deno test --allow-all --coverage=cov_profile functions/
        working-directory: supabase

      - name: Generate LCOV
        run: deno coverage --lcov cov_profile > coverage.lcov
        working-directory: supabase

      - name: Fetch base branch for diff
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=200

      - name: Diff coverage gate (≥90% on changed lines)
        if: github.event_name == 'pull_request'
        run: |
          python3 -m pip install --quiet --user diff-cover
          export PATH="$HOME/.local/bin:$PATH"
          diff-cover supabase/coverage.lcov \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=90 \
            --markdown-report=diff-cover.md \
            --include 'supabase/functions/**/*.ts' \
            --exclude 'supabase/functions/**/*_test.ts'

      - name: Upload diff-cover report
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-cover-report
          path: diff-cover.md
          if-no-files-found: ignore

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: diff-cover.md
          header: deno-diff-coverage
        continue-on-error: true

  # EF integration test — 빈 local Supabase + 외부 mock 으로 실 schema/trigger/RLS contract 검증
  # 설계: supabase/functions/_integration_tests/architecture.md
  test-ef-integration:
    name: test-ef-integration
    needs: changes
    if: ${{ needs.changes.outputs.supabase == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Wipe stale volume from any prior run on this host so `supabase start`
      # initializes a fresh DB. See test-pgtap above for the rationale.
      - name: Reset stale Supabase state
        run: supabase stop --no-backup 2>/dev/null || true

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations only (db reset --no-seed)
        run: supabase db reset --no-seed

      - name: Capture supabase env
        id: env
        run: |
          {
            echo "url=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2-)"
            echo "service_role_key=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2-)"
            echo "anon_key=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2-)"
          } >> "$GITHUB_OUTPUT"

      - name: Run integration tests
        env:
          SUPABASE_URL: ${{ steps.env.outputs.url }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.env.outputs.service_role_key }}
          SUPABASE_ANON_KEY: ${{ steps.env.outputs.anon_key }}
          SIM_USER_PASSWORD: ${{ secrets.SIM_USER_PASSWORD }}
        run: deno test --allow-all supabase/functions/_integration_tests/cuj/

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

  # check-workflow-yaml, check-android-test-deps, check-cross-feature-imports
  # consolidated into `static-checks` job at top of this file.

  # Runs `dart format` on .dart-touching PRs and pushes a `chore: auto-format`
  # commit back to the PR branch when there's a diff. The format-check variant
  # (introduced in #2627) was reverted because failing CI on format issues
  # forced AI workers to do a second round-trip; auto-fix keeps the loop tight.
  # Fork PRs skip (can't push back), un-formatted code there fails downstream
  # build steps instead.
  auto-format:
    needs: changes
    if: ${{ needs.changes.outputs.dart_files == 'true' && github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          # persist-credentials: false keeps the default GITHUB_TOKEN out of
          # git config; the explicit PAT is injected only in the push step so
          # pub get / dart format don't see it.
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/app_user
      - name: Minglit Kit — Format
        run: dart format .
        working-directory: shared/packages/minglit_kit
      - name: App User — Format
        run: dart format .
        working-directory: apps/app_user
      - name: App Partner — Format
        run: dart format .
        working-directory: apps/app_partner
      - name: Commit changes if needed
        env:
          # PAT triggers downstream workflow re-runs on the push commit;
          # default GITHUB_TOKEN-authored pushes don't (anti-loop protection),
          # so a real PAT is required to keep CI in sync with the formatted tree.
          GH_PAT: ${{ secrets.GH_PAT_VERSION_BUMP }}
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -- '**/*.dart'
            git commit -m "chore: auto-format"
            git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin HEAD:"${GITHUB_HEAD_REF}"
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            echo "No formatting changes needed"
          fi

  # Gitleaks secret scan — formerly pr-setup-secret-scan.yml, absorbed into pr-gate as a required check.
  # Disabled 2026-05-19: post-org-transfer (Mark-Yun → team-minglit), gitleaks-action@v2 requires a
  # paid license for org repos. ci-result aggregates on "failure" only, so a "skipped" job here does
  # not block the required check. Re-enable by removing `if: false` once a GITLEAKS_LICENSE secret
  # is provisioned, or by switching to the raw `gitleaks` binary (no license required).
  gitleaks:
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # check-bluedoc-freshness consolidated into `static-checks` job at top of this file.

  # CUJ integration tests on emulator — reusable workflow.
  # Engine + BLUEDOC: apps/<app>/integration_test/cuj/BLUEDOC.md
  # Manual debug: `gh workflow run shared-cuj-integration.yml -f app-name=user --ref <branch>`
  test-integration-app-user-cuj:
    name: cuj-integration-user
    needs: changes
    if: needs.changes.outputs.app_user_or_kit == 'true'
    uses: ./.github/workflows/shared-cuj-integration.yml
    with:
      app-name: user
    secrets: inherit

  test-integration-app-partner-cuj:
    name: cuj-integration-partner
    needs: changes
    if: needs.changes.outputs.app_partner_or_kit == 'true'
    uses: ./.github/workflows/shared-cuj-integration.yml
    with:
      app-name: partner
    secrets: inherit

  ci-result:
    needs: [static-checks, auto-format, gitleaks, test-flutter-apps, test-integration-app-user-cuj, test-integration-app-partner-cuj, lint-landing-user, lint-landing-partner, lint-mds-docs, lint-mds-icons, test-supabase, test-edge-functions, test-ef-integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CI results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Check CI job results
          results='${{ toJSON(needs.*.result) }}'
          echo "Job results: $results"
          if echo "$results" | grep -q '"failure"'; then
            echo ""
            echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | select(.value.result == "failure") | "❌ \(.key)"'
            exit 1
          fi
          echo "✅ CI jobs passed"

          # CodeRabbit review wait was here. Removed: required-reviewer
          # branch protection already gates merge on human APPROVED review,
          # so the bot-review wait was duplicate enforcement that held a
          # self-hosted runner slot for up to 30 minutes per PR — under
          # cascade merges, that's the single biggest source of queue backlog.
          # CodeRabbit still posts its review as a status (visible on the PR);
          # we just stop blocking on it here.

          echo ""
          echo "✅ All checks passed"
