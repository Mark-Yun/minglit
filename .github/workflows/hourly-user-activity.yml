name: Hourly User Activity Simulation

on:
  schedule:
    - cron: '30 * * * *'  # Every hour at :30
  workflow_dispatch:

concurrency:
  group: supabase-dev-simulation
  cancel-in-progress: false

jobs:
  simulate:
    name: Run User Activity Simulation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run user activity simulation
        run: |
          for phase in approve refund run settle; do
            echo "▶ Running phase: $phase"
            curl -sf -X POST \
              "${{ secrets.SUPABASE_DEV_URL }}/functions/v1/backend-simulator" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_DEV_SECRET_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{\"phase\":\"$phase\",\"config\":{\"apps_per_event\":2}}" \
              --max-time 120
            echo "✅ Phase $phase complete"
          done

  notify-failure:
    needs: [simulate]
    if: always()
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      success: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
      workflow_name: 'Hourly User Activity'
    secrets: inherit
