name: dev-deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only; do not deploy web artifacts.
        required: false
        type: boolean
        default: false

concurrency:
  group: dev-deploy
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Summarize dev deploy plan
        run: |
          {
            echo "## dev-deploy plan"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| dry_run | ${{ inputs.dry_run || false }} |"
            echo "| target_ref | dev |"
            echo "| web | deploy-vercel(dev) |"
            echo "| mobile | frozen (web MVP pivot; deploy-android-*/deploy-ios-* not called) |"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    needs: [plan]
    if: inputs.dry_run != true
    uses: ./.github/workflows/deploy-vercel.yml
    with:
      deploy_branch: dev
    secrets: inherit

  # Mobile (android/ios) deploy jobs removed: Flutter mobile apps are frozen
  # for the web MVP pivot. deploy-android-*/deploy-ios-* workflow_call adapters
  # are kept in the repo but intentionally not called.

  notify-failure:
    needs: [plan, web]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
      statuses: write
    uses: ./.github/workflows/shared-notify.yml
    with:
      failed: ${{ inputs.dry_run != true && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
      workflow_name: 'Dev Deploy'
      severity: 'P1-high'
      job_results: '{"web":"${{ needs.web.result }}"}'
