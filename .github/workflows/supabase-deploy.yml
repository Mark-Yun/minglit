name: Deploy Supabase Migrations

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'env-manifest.json'
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: false   # DB 마이그레이션 보호 — 부분 적용 방지

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set environment variables
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "ENV=dev" >> "$GITHUB_OUTPUT"
            echo "PROJECT_ID=${{ secrets.SUPABASE_DEV_PROJECT_ID }}" >> "$GITHUB_OUTPUT"
            echo "DB_PASSWORD=${{ secrets.SUPABASE_DEV_DB_PASSWORD }}" >> "$GITHUB_OUTPUT"
            echo "PUBLISHABLE_KEY=${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}" >> "$GITHUB_OUTPUT"
            echo "SERVICE_ROLE_KEY=${{ secrets.SUPABASE_DEV_SECRET_KEY }}" >> "$GITHUB_OUTPUT"
            echo "ENVIRONMENT_VALUE=development" >> "$GITHUB_OUTPUT"
          else
            echo "ENV=main" >> "$GITHUB_OUTPUT"
            echo "PROJECT_ID=${{ secrets.SUPABASE_MAIN_PROJECT_ID }}" >> "$GITHUB_OUTPUT"
            echo "DB_PASSWORD=${{ secrets.SUPABASE_MAIN_DB_PASSWORD }}" >> "$GITHUB_OUTPUT"
            echo "PUBLISHABLE_KEY=${{ secrets.SUPABASE_MAIN_PUBLISHABLE_KEY }}" >> "$GITHUB_OUTPUT"
            echo "SERVICE_ROLE_KEY=${{ secrets.SUPABASE_MAIN_SECRET_KEY }}" >> "$GITHUB_OUTPUT"
            echo "ENVIRONMENT_VALUE=production" >> "$GITHUB_OUTPUT"
          fi

      # Fix #470: Dev/Main 배포 로직 통합 — 중복 제거 + Main에 누락된 SERVICE_ROLE_KEY 추가
      - name: Deploy to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ steps.env.outputs.DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ steps.env.outputs.PROJECT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.env.outputs.SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_ACCESS_TOKEN: ${{ secrets.GH_PAT_FOR_BUG_REPORT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_EDGE_FUNCTIONS }}
          STATSIG_SERVER_KEY: ${{ secrets.STATSIG_SERVER_KEY }}
          AXIOM_API_TOKEN: ${{ secrets.AXIOM_API_TOKEN }}
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_ID --password $SUPABASE_DB_PASSWORD

          supabase secrets set OPENAI_API_KEY=$OPENAI_API_KEY
          supabase secrets set GITHUB_ACCESS_TOKEN=$GITHUB_ACCESS_TOKEN
          supabase secrets set SENTRY_DSN=$SENTRY_DSN
          if [ -z "$AXIOM_API_TOKEN" ]; then
            echo "AXIOM_API_TOKEN is not set. Skipping."
          else
            supabase secrets set AXIOM_API_TOKEN=$AXIOM_API_TOKEN
            supabase secrets set AXIOM_DATASET=edge-functions
          fi
          if [ -z "$STATSIG_SERVER_KEY" ]; then
            echo "STATSIG_SERVER_KEY is not set. Skipping."
          else
            supabase secrets set STATSIG_SERVER_KEY=$STATSIG_SERVER_KEY
          fi
          supabase secrets set ENVIRONMENT=${{ steps.env.outputs.ENVIRONMENT_VALUE }}

          supabase db push --password $SUPABASE_DB_PASSWORD --include-all

          supabase functions deploy

      # --- Post-deploy verification (env-manifest based) ---

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verify vault secrets
        env:
          DB_PASSWORD: ${{ steps.env.outputs.DB_PASSWORD }}
          PROJECT_ID: ${{ steps.env.outputs.PROJECT_ID }}
        run: |
          # Fix #1130: gai.conf IPv4 precedence not effective for psql — /etc/hosts override
          # Fix #1153: dig +short A returns empty on some runners — fallback chain
          HOST="db.${PROJECT_ID}.supabase.co"
          is_valid_ipv4() {
            [[ $1 =~ ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9][0-9]|[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9][0-9]|[0-9])$ ]]
          }
          IPV4=""
          CANDIDATE=$(dig +short A "$HOST" | head -1)
          is_valid_ipv4 "$CANDIDATE" && IPV4="$CANDIDATE"
          if [ -z "$IPV4" ]; then
            CANDIDATE=$(getent ahostsv4 "$HOST" 2>/dev/null | head -1 | awk '{print $1}')
            is_valid_ipv4 "$CANDIDATE" && IPV4="$CANDIDATE"
          fi
          if [ -z "$IPV4" ]; then
            # Use "^Address: " (space) to exclude the DNS server line "Address:\t8.8.8.8#53" (tab)
            CANDIDATE=$(nslookup -type=A "$HOST" 2>/dev/null | awk '/^Address: /{print $2}' | tail -1)
            is_valid_ipv4 "$CANDIDATE" && IPV4="$CANDIDATE"
          fi
          if [ -z "$IPV4" ]; then
            CANDIDATE=$(host -t A "$HOST" 2>/dev/null | awk '/has address/ {print $4; exit}')
            is_valid_ipv4 "$CANDIDATE" && IPV4="$CANDIDATE"
          fi
          if [ -z "$IPV4" ]; then
            echo "::error::Failed to resolve IPv4 for ${HOST} (tried dig, getent, nslookup, host)"
            exit 1
          fi
          echo "${IPV4} ${HOST}" | sudo tee -a /etc/hosts > /dev/null
          echo "Resolved ${HOST} → ${IPV4}"

          REQUIRED=$(jq -r '.vault.required | keys[]' env-manifest.json)
          VAULT_MISSING=""
          for key in $REQUIRED; do
            EXISTS=$(PGPASSWORD="${DB_PASSWORD}" psql \
              "postgresql://postgres:${DB_PASSWORD}@db.${PROJECT_ID}.supabase.co:5432/postgres" \
              -t -A -c "SELECT count(*) FROM vault.decrypted_secrets WHERE name='$key';")
            if [ "$EXISTS" = "0" ]; then
              VAULT_MISSING="$VAULT_MISSING $key"
            fi
          done
          if [ -n "$VAULT_MISSING" ]; then
            echo "::error::Vault secrets missing:$VAULT_MISSING"
            exit 1
          fi
          echo "Vault secrets OK"

      - name: Verify Edge Function env vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANON_KEY: ${{ steps.env.outputs.PUBLISHABLE_KEY }}
          PROJECT_ID: ${{ steps.env.outputs.PROJECT_ID }}
          ENV_NAME: ${{ steps.env.outputs.ENV }}
        run: |
          RESPONSE=$(curl -sf "https://${PROJECT_ID}.supabase.co/functions/v1/health?env=true" \
            -H "Authorization: Bearer ${ANON_KEY}" --max-time 15) || {
            echo "::warning::Health endpoint unreachable — skipping EF env check"
            exit 0
          }

          if ! echo "$RESPONSE" | jq -e . > /dev/null 2>&1; then
            echo "::warning::Health endpoint returned invalid JSON — skipping EF env check"
            exit 0
          fi

          MISSING=$(echo "$RESPONSE" | jq -r \
            '.env_check.by_function // {} | to_entries[] | "\(.key): \(.value | join(", "))"')

          if [ -n "$MISSING" ]; then
            TITLE="Missing env vars after deploy on ${ENV_NAME}"
            EXISTING=$(gh issue list --search "\"${TITLE}\" in:title" --state open --json number -q '.[0].number')
            BODY=$(cat <<BODY_EOF
          **Missing EF env vars:**
          \`\`\`
          ${MISSING}
          \`\`\`
          **Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BODY_EOF
            )

            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY"
            else
              gh issue create --title "$TITLE" --label "ci-failure,P0-critical" --body "$BODY"
            fi
            echo "::warning::EF env vars missing (issue created/updated)"
          else
            echo "EF env vars OK"
          fi

      - name: Verify GitHub Secrets match manifest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REQUIRED=$(jq -r '.github_secrets.required | keys[]' env-manifest.json)
          EXISTING=$(gh secret list --json name -q '.[].name')
          GH_MISSING=""
          for key in $REQUIRED; do
            echo "$EXISTING" | grep -q "^${key}$" || GH_MISSING="$GH_MISSING $key"
          done
          if [ -n "$GH_MISSING" ]; then
            echo "::warning::GitHub Secrets missing from manifest:$GH_MISSING"
          else
            echo "GitHub Secrets OK"
          fi

  notify-failure:
    needs: [deploy]
    if: always()
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      success: ${{ needs.deploy.result == 'success' }}
      workflow_name: 'Deploy Supabase Migrations'
      job_results: '{"deploy":"${{ needs.deploy.result }}"}'