name: Secret Scanning

on:
  pull_request:
    branches: [ "main", "dev" ]

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  notify-failure:
    needs: [gitleaks]
    # Fix #563, #564: Only notify on actual failure, not on cancelled (from cancel-in-progress)
    if: ${{ always() && needs.gitleaks.result == 'failure' }}
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      success: false
      workflow_name: 'Secret Scan'
      # Fix #976: PR-triggered workflows should not create P0 noise issues
      create_issue: false