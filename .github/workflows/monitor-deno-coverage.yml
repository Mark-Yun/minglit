name: monitor-deno-coverage

# Manual coverage inspection only. This workflow intentionally does not commit
# generated reports back to protected branches; dev/rc/main must stay immutable
# except for human-reviewed PR merges and promotion operations.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: monitor-deno-coverage
  cancel-in-progress: false   # 누락 없이 직렬화

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run deno tests with coverage
        run: deno test --allow-all --coverage=cov_profile functions/
        working-directory: supabase

      - name: Generate LCOV
        run: deno coverage --lcov cov_profile > coverage.lcov
        working-directory: supabase

      - name: Generate markdown report
        run: |
          deno run --allow-read --allow-write functions/_coverage/coverage.ts \
            --lcov=coverage.lcov \
            --out=functions/_coverage/coverage-report.md
        working-directory: supabase

      - name: Summarize coverage report delta
        run: |
          if git diff --quiet supabase/functions/_coverage/coverage-report.md; then
            echo "coverage report is unchanged" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "coverage report would change; no commit was created"
            echo ""
            echo '```diff'
            git diff -- supabase/functions/_coverage/coverage-report.md | sed -n '1,200p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
