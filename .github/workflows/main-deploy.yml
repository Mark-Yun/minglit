name: main-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only; do not tag or deploy.
        required: false
        type: boolean
        default: false

concurrency:
  group: main-deploy
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      deploy_required: ${{ steps.plan.outputs.deploy_required }}
      promo_tag: ${{ steps.plan.outputs.promo_tag }}
      source_sha: ${{ steps.plan.outputs.source_sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Plan main deployment finalization
        id: plan
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          promo_week="$(TZ=Asia/Seoul date +%G-W%V)"
          echo "deploy_required=true" >> "$GITHUB_OUTPUT"
          echo "promo_tag=promo/main-${promo_week}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"

          {
            echo "## main-deploy plan"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| dry_run | ${{ inputs.dry_run || false }} |"
            echo "| source_sha | ${source_sha} |"
            echo "| promo_tag | promo/main-${promo_week} |"
            echo "| deploy | web + android + ios main |"
          } >> "$GITHUB_STEP_SUMMARY"

  tag-promo:
    needs: [plan]
    if: needs.plan.outputs.deploy_required == 'true' && inputs.dry_run != true
    uses: ./.github/workflows/shared-promo-tag.yml
    with:
      target_ref: main
      tag_name: ${{ needs.plan.outputs.promo_tag }}
      commit_sha: ${{ needs.plan.outputs.source_sha }}
    secrets: inherit

  web:
    needs: [plan, tag-promo]
    if: always() && needs.plan.outputs.deploy_required == 'true' && inputs.dry_run != true && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/deploy-vercel.yml
    with:
      deploy_branch: main
    secrets: inherit

  android_user:
    needs: [plan, tag-promo]
    if: always() && needs.plan.outputs.deploy_required == 'true' && inputs.dry_run != true && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/deploy-android-user.yml
    with:
      target-ref: main
      deploy-stage: main
    secrets: inherit

  android_partner:
    needs: [plan, tag-promo]
    if: always() && needs.plan.outputs.deploy_required == 'true' && inputs.dry_run != true && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/deploy-android-partner.yml
    with:
      target-ref: main
      deploy-stage: main
    secrets: inherit

  ios_user:
    needs: [plan, tag-promo]
    if: always() && needs.plan.outputs.deploy_required == 'true' && inputs.dry_run != true && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/deploy-ios-user.yml
    with:
      target-ref: main
      deploy-stage: main
    secrets: inherit

  ios_partner:
    needs: [plan, tag-promo]
    if: always() && needs.plan.outputs.deploy_required == 'true' && inputs.dry_run != true && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/deploy-ios-partner.yml
    with:
      target-ref: main
      deploy-stage: main
    secrets: inherit

  notify-failure:
    needs: [plan, tag-promo, web, android_user, android_partner, ios_user, ios_partner]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
      statuses: write
    uses: ./.github/workflows/shared-notify.yml
    with:
      failed: >-
        ${{
          needs.plan.outputs.deploy_required == 'true' &&
          inputs.dry_run != true &&
          (
            needs.plan.result != 'success' ||
            needs.tag-promo.result != 'success' ||
            needs.web.result != 'success' ||
            needs.android_user.result != 'success' ||
            needs.android_partner.result != 'success' ||
            needs.ios_user.result != 'success' ||
            needs.ios_partner.result != 'success'
          )
        }}
      workflow_name: 'Main Deploy'
      severity: 'P0-critical'
      job_results: '{"plan":"${{ needs.plan.result }}","tag-promo":"${{ needs.tag-promo.result }}","web":"${{ needs.web.result }}","android-user":"${{ needs.android_user.result }}","android-partner":"${{ needs.android_partner.result }}","ios-user":"${{ needs.ios_user.result }}","ios-partner":"${{ needs.ios_partner.result }}"}'
