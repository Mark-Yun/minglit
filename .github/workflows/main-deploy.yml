name: main-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional final version, e.g. 26.05.2572. Defaults to current rc version without suffix.
        required: false
        type: string

concurrency:
  group: main-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.plan.outputs.skipped }}
      release_version: ${{ steps.plan.outputs.release_version }}
      tag_name: ${{ steps.plan.outputs.tag_name }}
      promo_tag: ${{ steps.plan.outputs.promo_tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Plan main deployment finalization
        id: plan
        env:
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version || '' }}
        run: |
          set -euo pipefail

          current_version="$(awk '/^version:/ {print $2; exit}' apps/app_user/pubspec.yaml | sed 's/+.*//')"
          release_version="${REQUESTED_RELEASE_VERSION}"

          if [ -z "${release_version}" ]; then
            if [[ "${current_version}" =~ ^([0-9]{2}\.(0[1-9]|1[0-2])\.[0-9]+)-rc-[0-9]{2}$ ]]; then
              release_version="$(printf '%s' "${current_version}" | sed -E 's/-rc-[0-9]{2}$//')"
            else
              echo "main is already on a final/non-rc version (${current_version}); skipping."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if ! [[ "${release_version}" =~ ^[0-9]{2}\.(0[1-9]|1[0-2])\.[0-9]+$ ]]; then
            echo "::error::Invalid release_version: ${release_version}. Expected YY.MM.PR#."
            exit 1
          fi

          promo_week="$(TZ=Asia/Seoul date +%G-W%V)"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${release_version}" >> "$GITHUB_OUTPUT"
          echo "promo_tag=promo/main-${promo_week}" >> "$GITHUB_OUTPUT"

  finalize-version:
    needs: [plan]
    if: needs.plan.outputs.skipped != 'true'
    uses: ./.github/workflows/version-bump.yml
    with:
      target_ref: main
      version: ${{ needs.plan.outputs.release_version }}
      release_version: ${{ needs.plan.outputs.release_version }}
      tag_name: ${{ needs.plan.outputs.tag_name }}
      create_release: true
      skip_ci: true
    secrets: inherit

  tag-promo:
    needs: [plan, finalize-version]
    if: needs.plan.outputs.skipped != 'true'
    uses: ./.github/workflows/shared-promo-tag.yml
    with:
      target_ref: main
      tag_name: ${{ needs.plan.outputs.promo_tag }}
      commit_sha: ${{ needs.finalize-version.outputs.commit_sha }}
    secrets: inherit

  notify-failure:
    needs: [plan, finalize-version, tag-promo]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
      statuses: write
    uses: ./.github/workflows/shared-notify.yml
    with:
      failed: >-
        ${{
          needs.plan.outputs.skipped != 'true' &&
          (
            needs.plan.result != 'success' ||
            needs.finalize-version.result != 'success' ||
            needs.tag-promo.result != 'success'
          )
        }}
      workflow_name: 'Main Deploy'
      severity: 'P0-critical'
      job_results: '{"plan":"${{ needs.plan.result }}","finalize-version":"${{ needs.finalize-version.result }}","tag-promo":"${{ needs.tag-promo.result }}"}'
