name: sync-version

on:
  pull_request:
    types: [closed]
    branches: [dev, main]

concurrency:
  group: sync-version-${{ github.base_ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: >-
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.title, 'chore: bump version')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout minglit_env submodule
        env:
          MINGLIT_ENV_PAT: ${{ secrets.MINGLIT_ENV_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${MINGLIT_ENV_PAT:-}" ]; then
            echo "::warning::MINGLIT_ENV_PAT is not configured; falling back to GitHub Actions secrets for release bot credentials."
            exit 0
          fi

          git -c "url.https://x-access-token:${MINGLIT_ENV_PAT}@github.com/.insteadOf=https://github.com/" \
            submodule update --init --recursive minglit_env

      - name: Load release bot credentials
        env:
          FALLBACK_APP_ID: ${{ secrets.MINGLIT_RELEASE_BOT_APP_ID }}
          FALLBACK_PRIVATE_KEY: ${{ secrets.MINGLIT_RELEASE_BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          env_file="minglit_env/dev/github.env"

          if [ -f "${env_file}" ]; then
            set -a
            # shellcheck disable=SC1090
            . "${env_file}"
            set +a
          else
            echo "::warning::${env_file} not found; using GitHub Actions secrets fallback."
          fi

          MINGLIT_RELEASE_BOT_APP_ID="${MINGLIT_RELEASE_BOT_APP_ID:-${FALLBACK_APP_ID:-}}"
          MINGLIT_RELEASE_BOT_OWNER="${MINGLIT_RELEASE_BOT_OWNER:-Mark-Yun}"
          MINGLIT_RELEASE_BOT_REPOSITORIES="${MINGLIT_RELEASE_BOT_REPOSITORIES:-minglit}"

          if [ -n "${MINGLIT_RELEASE_BOT_PRIVATE_KEY_BASE64:-}" ]; then
            {
              echo "MINGLIT_RELEASE_BOT_PRIVATE_KEY<<EOF"
              printf '%s' "${MINGLIT_RELEASE_BOT_PRIVATE_KEY_BASE64}" | base64 --decode
              echo
              echo "EOF"
            } >> "${GITHUB_ENV}"
          elif [ -n "${FALLBACK_PRIVATE_KEY:-}" ]; then
            {
              echo "MINGLIT_RELEASE_BOT_PRIVATE_KEY<<EOF"
              printf '%s\n' "${FALLBACK_PRIVATE_KEY}"
              echo "EOF"
            } >> "${GITHUB_ENV}"
          else
            echo "::error::Missing release bot private key. Configure minglit_env/dev/github.env or MINGLIT_RELEASE_BOT_PRIVATE_KEY."
            exit 1
          fi

          if [ -z "${MINGLIT_RELEASE_BOT_APP_ID}" ]; then
            echo "::error::Missing release bot app ID. Configure minglit_env/dev/github.env or MINGLIT_RELEASE_BOT_APP_ID."
            exit 1
          fi

          {
            echo "MINGLIT_RELEASE_BOT_APP_ID=${MINGLIT_RELEASE_BOT_APP_ID}"
            echo "MINGLIT_RELEASE_BOT_OWNER=${MINGLIT_RELEASE_BOT_OWNER}"
            echo "MINGLIT_RELEASE_BOT_REPOSITORIES=${MINGLIT_RELEASE_BOT_REPOSITORIES}"
          } >> "${GITHUB_ENV}"

      - name: Generate release bot token
        id: release-bot
        uses: ./.github/actions/release-bot-token
        with:
          app-id: ${{ env.MINGLIT_RELEASE_BOT_APP_ID }}
          private-key: ${{ env.MINGLIT_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ env.MINGLIT_RELEASE_BOT_OWNER }}
          repositories: ${{ env.MINGLIT_RELEASE_BOT_REPOSITORIES }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Calculate next CalVer version
        id: version
        run: |
          BRANCH="${{ github.base_ref }}"
          CURRENT=$(grep "^version:" apps/app_user/pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | sed 's/-dev$//')
          echo "current=$CURRENT"

          # Current year/month (2-digit)
          NOW_YY=$(date -u +%y)
          NOW_MM=$(date -u +%m)

          # Use the merged PR number as the revision
          PR_NUM="${{ github.event.pull_request.number }}"

          BASE="${NOW_YY}.${NOW_MM}.${PR_NUM}"

          if [ "$BRANCH" = "dev" ]; then
            NEW_VERSION="${BASE}-dev"
          else
            NEW_VERSION="${BASE}"
          fi

          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEW_VERSION"

      - name: Run bump-version.sh
        run: bash scripts/bump-version.sh "${{ steps.version.outputs.new }}"

      - name: Commit and push version bump
        env:
          RELEASE_BOT_TOKEN: ${{ steps.release-bot.outputs.token }}
        run: |
          NEW_VERSION="${{ steps.version.outputs.new }}"
          BRANCH="${{ github.base_ref }}"

          git config user.name "minglit-release-bot"
          git config user.email "minglit-release-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${RELEASE_BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add -A
          git diff --cached --quiet && { echo "No version changes to commit."; exit 0; }
          git commit -m "chore: bump version to v${NEW_VERSION} [skip ci]"

          # Fix #1506: push race — dev가 다른 경로로 전진할 수 있어 pull --rebase + retry
          MAX_ATTEMPTS=5
          ATTEMPT=0
          until git push origin HEAD:${BRANCH}; do
            ATTEMPT=$((ATTEMPT+1))
            if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
              echo "::error::push failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "::warning::push rejected (attempt $ATTEMPT/$MAX_ATTEMPTS), rebasing on origin/${BRANCH} and retrying..."
            git fetch origin ${BRANCH}
            git rebase origin/${BRANCH} || {
              echo "::error::rebase failed — manual resolution required"
              exit 1
            }
            # linear backoff: 2s, 4s, 6s, 8s
            sleep $((2 * ATTEMPT))
          done
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Create GitHub release (main only)
        if: github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
        run: |
          VERSION="${{ steps.version.outputs.base }}"
          gh release create "v${VERSION}" \
            --generate-notes \
            --target main \
            --title "v${VERSION}"

  notify-failure:
    needs: [bump]
    if: always()
    permissions:
      issues: write
    uses: ./.github/workflows/shared-notify.yml
    with:
      success: ${{ needs.bump.result == 'success' || needs.bump.result == 'skipped' }}
      workflow_name: 'Version Bump'
      job_results: '{"bump":"${{ needs.bump.result }}"}'
