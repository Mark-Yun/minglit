name: "Hourly: Tick Simulator (backend full-phase)"

on:
  schedule:
    - cron: '0 * * * *'  # Every hour at :00 (hourly-tick-simulator.yml runs at :30)
  workflow_dispatch:

concurrency:
  group: supabase-dev-simulation  # Same group as hourly-tick-simulator to prevent concurrent EF calls
  cancel-in-progress: false

jobs:
  simulate:
    name: Run backend-simulator (full phase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger backend-simulator EF
        run: |
          # Fix #1596: use -s (not -sf) so error response body is printed before failing.
          # HTTP status is checked manually so curl does not swallow the body on 4xx/5xx.
          http_code=$(curl -s -o /tmp/sim_response.json -w "%{http_code}" -X POST \
            "${{ secrets.SUPABASE_DEV_URL }}/functions/v1/backend-simulator" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_DEV_SECRET_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 600)
          cat /tmp/sim_response.json
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "HTTP $http_code — backend-simulator returned an error"
            exit 1
          fi
          jq -e '.success == true' /tmp/sim_response.json

  notify-failure:
    needs: [simulate]
    if: always()
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      success: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
      workflow_name: 'Hourly: Tick Simulator (backend full-phase)'
    secrets: inherit
