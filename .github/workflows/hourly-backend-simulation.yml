name: "Hourly: Tick Simulator (backend full-phase)"

on:
  schedule:
    - cron: '0 * * * *'  # Every hour at :00 (hourly-tick-simulator.yml runs at :30)
  workflow_dispatch:

concurrency:
  group: supabase-dev-simulation  # Same group as hourly-tick-simulator to prevent concurrent EF calls
  cancel-in-progress: false

jobs:
  simulate:
    name: Run backend-simulator (full phase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger backend-simulator EF
        run: |
          response=$(curl -sf -X POST \
            "${{ secrets.SUPABASE_DEV_URL }}/functions/v1/backend-simulator" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_DEV_SECRET_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 600)
          echo "$response"
          echo "$response" | jq -e '.success == true'

  notify-failure:
    needs: [simulate]
    if: always()
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      success: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
      workflow_name: 'Hourly: Tick Simulator (backend full-phase)'
    secrets: inherit
