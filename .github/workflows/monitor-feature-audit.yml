name: monitor-feature-audit

# 8개 카테고리 (docs/features/<cat>/) 의 FRESH_DOC 을 매일 스캔.
# stale 시 GitHub Issue 자동 생성 — AI agent 가 feature audit 수행.
#
# 본 워크플로우는 features 카테고리만 처리하는 focused 버전.
# (전체 FRESH_DOC 처리는 후속 doc-freshness.yml 에서 — spec: docs/infra/fresh-doc/)

on:
  schedule:
    - cron: '0 1 * * *'  # UTC 01:00 = KST 10:00 (mds-render / cuj-coverage 와 시차)
  workflow_dispatch:
    inputs:
      force:
        description: 'Force issue creation regardless of stale judgment (bootstrap mode)'
        required: false
        type: boolean
        default: false

concurrency:
  group: monitor-feature-audit
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Manage feature audit issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}/blob/dev
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -e
          TODAY=$(date -u +%Y-%m-%d)

          for FRESH_DOC in docs/features/*/FRESH_DOC; do
            CATEGORY=$(basename "$(dirname "$FRESH_DOC")")
            CYCLE=$(grep -E "^cycle:" "$FRESH_DOC" | awk '{print $2}' | tr -d 'd')
            LAST_VERIFIED=$(grep -E "^last_verified:" "$FRESH_DOC" | awk '{print $2}')

            # Days since last_verified (BSD date — macOS runner)
            DAYS_SINCE=$(( ( $(date -u -d "$TODAY" +%s 2>/dev/null || date -u -j -f "%Y-%m-%d" "$TODAY" +%s) - $(date -u -d "$LAST_VERIFIED" +%s 2>/dev/null || date -u -j -f "%Y-%m-%d" "$LAST_VERIFIED" +%s) ) / 86400 ))

            STALE="false"
            if [ "$DAYS_SINCE" -ge "$CYCLE" ]; then STALE="true"; fi

            echo "── $CATEGORY ──"
            echo "  cycle: ${CYCLE}d / last_verified: $LAST_VERIFIED / days_since: $DAYS_SINCE / stale: $STALE / force: $FORCE"

            if [ "$STALE" != "true" ] && [ "$FORCE" != "true" ]; then
              echo "  ⏭ not stale, skip"
              continue
            fi

            # Dedup — open issue with [doc-refresh] docs/features/<cat> already exists?
            ISSUE_TITLE_PREFIX="[doc-refresh] docs/features/${CATEGORY}"
            EXISTING=$(gh issue list \
              --search "$ISSUE_TITLE_PREFIX in:title state:open" \
              --json number,title \
              --jq '.[0].number // empty')

            if [ -n "$EXISTING" ]; then
              echo "  ⏭ open issue #$EXISTING already exists, skip"
              continue
            fi

            # Spec files list (only features with both prd.md and spec.md = migrated to 5섹션)
            SPEC_FILES=""
            for FEATURE_DIR in "docs/features/$CATEGORY"/*/; do
              FEATURE=$(basename "$FEATURE_DIR")
              if [ -f "${FEATURE_DIR}spec.md" ]; then
                SPEC_FILES+="- [\`${CATEGORY}/${FEATURE}\`](${REPO_URL}/docs/features/${CATEGORY}/${FEATURE}/) — [prd.md](${REPO_URL}/docs/features/${CATEGORY}/${FEATURE}/prd.md) · [spec.md](${REPO_URL}/docs/features/${CATEGORY}/${FEATURE}/spec.md)"$'\n'
              fi
            done

            # refresh_method body (multi-line)
            REFRESH_METHOD=$(awk '/^refresh_method:/{flag=1; next} /^[a-z_]+:/{flag=0} flag' "$FRESH_DOC" | sed 's/^  //')

            BODY=$(cat <<EOF
          ## Provenance

          | 항목 | 값 |
          |------|-----|
          | Workflow | [\`monitor-feature-audit.yml\`](${REPO_URL}/.github/workflows/monitor-feature-audit.yml) |
          | Latest run | [#${{ github.run_id }}](${RUN_URL}) |
          | Trigger | \`${TRIGGER}\` |
          | Generated at | ${TODAY} |

          ## Task

          \`${CATEGORY}\` 카테고리 feature audit 수행. AI agent 는 [\`feature_audit_report_template.md\`](${REPO_URL}/docs/features/feature_audit_report_template.md) 의 **"AI 실행 절차"** 섹션 (6 step + 정확한 명령어) 을 따라 진행:

          1. 입력 수집 (도구 실행)
          2. Section 1 (Spec 점검) 채움
          3. Section 2 (UI 완성도) 채움
          4. Section 3 (테스트 현황) 채움
          5. Action Items 와 Findings 파일링 (P0/P1/P2/P3 별 GitHub Issue)
          6. last_verified 갱신 + 본 issue close

          ## Trigger info

          - 본 FRESH_DOC: [\`docs/features/${CATEGORY}/FRESH_DOC\`](${REPO_URL}/docs/features/${CATEGORY}/FRESH_DOC)
          - Cycle: ${CYCLE}d
          - Last verified: ${LAST_VERIFIED}
          - Days since: ${DAYS_SINCE}
          - Stale judgment: ${STALE}
          - Force mode: ${FORCE}

          ## Refresh method (FRESH_DOC 본문)

          \`\`\`
          ${REFRESH_METHOD}
          \`\`\`

          ## Context — 먼저 읽기

          | 문서 | 내용 |
          |------|------|
          | [\`feature_audit_report_template.md\`](${REPO_URL}/docs/features/feature_audit_report_template.md) | 출력 보고서 구조 + AI 실행 절차 6 step |
          | [\`docs/features/BLUEDOC.md\`](${REPO_URL}/docs/features/BLUEDOC.md) | 컨벤션 (PRD + spec.md 5섹션, CUJ ID, 테스트 매핑) |
          | [\`docs/features/_template/{prd,spec}.md\`](${REPO_URL}/docs/features/_template/) | placeholder skeleton |
          | [\`docs/architecture/client.md\`](${REPO_URL}/docs/architecture/client.md) | Flutter 클라이언트 아키텍처 |

          ## Canonical examples (모방 대상)

          | 파일 | 시연 |
          |------|------|
          | [\`account/signup-consent/prd.md\`](${REPO_URL}/docs/features/account/signup-consent/prd.md) | PRD 8섹션 |
          | [\`account/signup-consent/spec.md\`](${REPO_URL}/docs/features/account/signup-consent/spec.md) | spec.md 5섹션 + CUJ 테이블 + Edge Cases |
          | [\`apps/app_user/integration_test/cuj/account/signup_consent_test.dart\`](${REPO_URL}/apps/app_user/integration_test/cuj/account/signup_consent_test.dart) | CUJ test 패턴 (cujGroup + cujCase + mocktail) |

          ## 본 카테고리의 spec.md 목록

          ${SPEC_FILES}

          ## 도구 (Step 1 입력 수집)

          \`\`\`bash
          # CUJ test 커버리지 (본 카테고리 filter)
          dart run scripts/cuj_coverage.dart --json | jq '.per_feature[] | select(.category == "${CATEGORY}")'

          # MDS render 커버리지
          dart run scripts/mds_render_coverage.dart --json

          # 최근 7일 본 카테고리 활동
          gh issue list --label "feature/${CATEGORY}-*" --state all --search "updated:>7d" --json number,title,state
          gh pr list --state all --search "updated:>7d" --json number,title,headRefName | jq '[.[] | select(.headRefName | contains("${CATEGORY}"))]'
          \`\`\`

          ## 출력 파일

          [\`docs/features/${CATEGORY}/feature_audit_report.md\`](${REPO_URL}/docs/features/${CATEGORY}/feature_audit_report.md) — 본 audit 결과 작성 위치.

          ## Closing rule

          - 부분 처리 (일부 Action Item 만 파일링): PR body 에 \`Refs #<이슈번호>\` (close 금지)
          - 완전 처리 (audit 완료 + last_verified 갱신): PR body 에 \`Closes #<이슈번호>\`
          EOF
          )

            gh issue create \
              --title "${ISSUE_TITLE_PREFIX} — 문서 검토 필요" \
              --body "$BODY"

            echo "  ✓ created issue"
          done
