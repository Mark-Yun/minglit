name: main-pr-gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read
  checks: write
  issues: write
  statuses: read

concurrency:
  group: main-pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate-core:
    uses: ./.github/workflows/pr-gate.yml
    with:
      stage: main
      base_ref: main
    secrets: inherit

  validate-rc-promotion:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate rc promotion markers
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          status_state() {
            local sha="$1"
            local context="$2"
            gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/status" \
              --jq ".statuses | map(select(.context == \"${context}\")) | first | .state // empty" || true
          }

          if ! [[ "${HEAD_REF}" =~ ^rc/[0-9]{4}-W[0-9]{2}$ ]]; then
            echo "::error::main only accepts rc/YYYY-Www promotion PRs; got head ref '${HEAD_REF}'."
            exit 1
          fi

          current_sha="$(git rev-parse HEAD)"
          if [ "${current_sha}" != "${HEAD_SHA}" ]; then
            echo "::error::Checked out ${current_sha}, expected pull request head ${HEAD_SHA}."
            exit 1
          fi

          labels="$(gh pr view "${PR_NUMBER}" --json labels --jq '.labels[].name')"
          if ! grep -Fxq "rc-main-cut-pass" <<< "${labels}"; then
            echo "::error::Missing required PR label: rc-main-cut-pass."
            exit 1
          fi

          rc_main_state="$(status_state "${HEAD_SHA}" "rc-main-cut-pass")"
          if [ "${rc_main_state}" != "success" ]; then
            echo "::error::PR head ${HEAD_SHA} does not have successful rc-main-cut-pass status."
            exit 1
          fi

          dev_rc_source=""
          while read -r candidate_sha; do
            [ -n "${candidate_sha}" ] || continue
            state="$(status_state "${candidate_sha}" "dev-rc-cut-pass")"
            if [ "${state}" = "success" ]; then
              dev_rc_source="${candidate_sha}"
              break
            fi
          done < <(git rev-list --first-parent -n 300 "${HEAD_SHA}")

          if [ -z "${dev_rc_source}" ]; then
            echo "::error::No successful dev-rc-cut-pass status found in the first-parent lineage of ${HEAD_SHA}."
            exit 1
          fi

          echo "::notice::Validated rc promotion: head=${HEAD_SHA}, dev_rc_source=${dev_rc_source}."

  main-pr-gate:
    needs: [pr-gate-core, validate-rc-promotion]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish branch gate result
        run: |
          if [ "${{ needs.pr-gate-core.result }}" != "success" ]; then
            echo "::error::pr-gate-core result: ${{ needs.pr-gate-core.result }}"
            exit 1
          fi
          if [ "${{ needs.validate-rc-promotion.result }}" != "success" ]; then
            echo "::error::validate-rc-promotion result: ${{ needs.validate-rc-promotion.result }}"
            exit 1
          fi
          echo "main-pr-gate passed"
