name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "dev" ]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 변경 사항 감지 Job
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app_user: ${{ steps.filter.outputs.app_user }}
      app_partner: ${{ steps.filter.outputs.app_partner }}
      landing_user: ${{ steps.filter.outputs.landing_user }}
      landing_partner: ${{ steps.filter.outputs.landing_partner }}
      supabase: ${{ steps.filter.outputs.supabase }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          app_user:
            - 'apps/app_user/**'
            - 'shared/packages/minglit_kit/**'
          app_partner:
            - 'apps/app_partner/**'
            - 'shared/packages/minglit_kit/**'
          landing_user:
            - 'apps/landing_user/**'
            - 'shared/web/**'
          landing_partner:
            - 'apps/landing_partner/**'
            - 'shared/web/**'
          supabase:
            - 'supabase/**'
            - 'tests/backend_integration/**'

  # App User CI
  test-app-user:
    needs: changes
    if: ${{ needs.changes.outputs.app_user == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze (minglit_kit)
        run: flutter analyze
        working-directory: shared/packages/minglit_kit
      - name: Analyze
        run: flutter analyze
        working-directory: apps/app_user
      - name: Test
        run: flutter test --coverage
        working-directory: apps/app_user
      - uses: actions/upload-artifact@v4
        with:
          name: app-user-coverage
          path: apps/app_user/coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: apps/app_user/coverage/lcov.info
          flags: app-user
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # App Partner CI
  test-app-partner:
    needs: changes
    if: ${{ needs.changes.outputs.app_partner == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze (minglit_kit)
        run: flutter analyze
        working-directory: shared/packages/minglit_kit
      - name: Analyze
        run: flutter analyze
        working-directory: apps/app_partner
      - name: Test
        run: flutter test --coverage
        working-directory: apps/app_partner
      - uses: actions/upload-artifact@v4
        with:
          name: app-partner-coverage
          path: apps/app_partner/coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: apps/app_partner/coverage/lcov.info
          flags: app-partner
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # Landing User CI
  lint-landing-user:
    needs: changes
    if: ${{ needs.changes.outputs.landing_user == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/landing_user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./apps/landing_user/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Landing Partner CI
  lint-landing-partner:
    needs: changes
    if: ${{ needs.changes.outputs.landing_partner == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/landing_partner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./apps/landing_partner/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Supabase Check
  check-supabase:
    needs: changes
    if: ${{ needs.changes.outputs.supabase == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase -v # CLI 설치 확인
      - name: Start Supabase
        run: supabase start
      - name: Test (pgTAP)
        run: supabase test db
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies (integration)
        run: flutter pub get
        working-directory: tests/backend_integration
      - name: Test (integration)
        run: dart test
        working-directory: tests/backend_integration
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_LOCAL_SERVICE_ROLE_KEY }}
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test (edge functions)
        run: deno test --allow-all functions/
        working-directory: supabase
      - name: Install dependencies (e2e scenarios)
        run: flutter pub get
        working-directory: apps/integration_scenario_tester
      - name: Test (e2e scenarios)
        run: flutter test integration_test/
        working-directory: apps/integration_scenario_tester
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_LOCAL_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_LOCAL_SERVICE_ROLE_KEY }}
      - name: Stop Supabase
        if: always()
        run: supabase stop
