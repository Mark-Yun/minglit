name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # 변경 사항 감지 Job
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app_user: ${{ steps.filter.outputs.app_user }}
      app_partner: ${{ steps.filter.outputs.app_partner }}
      landing_user: ${{ steps.filter.outputs.landing_user }}
      landing_partner: ${{ steps.filter.outputs.landing_partner }}
      supabase: ${{ steps.filter.outputs.supabase }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          app_user:
            - 'apps/app_user/**'
            - 'shared/packages/minglit_kit/**'
          app_partner:
            - 'apps/app_partner/**'
            - 'shared/packages/minglit_kit/**'
          landing_user:
            - 'apps/landing_user/**'
            - 'shared/web/**'
          landing_partner:
            - 'apps/landing_partner/**'
            - 'shared/web/**'
          supabase:
            - 'backend/**'
            - 'backend/supabase/**'

  # App User CI
  test-app-user:
    needs: changes
    if: ${{ needs.changes.outputs.app_user == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/app_user
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: app-user-coverage
          path: apps/app_user/coverage

  # App Partner CI
  test-app-partner:
    needs: changes
    if: ${{ needs.changes.outputs.app_partner == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/app_partner
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: app-partner-coverage
          path: apps/app_partner/coverage

  # Landing User CI
  lint-landing-user:
    needs: changes
    if: ${{ needs.changes.outputs.landing_user == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/landing_user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./apps/landing_user/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Landing Partner CI
  lint-landing-partner:
    needs: changes
    if: ${{ needs.changes.outputs.landing_partner == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/landing_partner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./apps/landing_partner/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Supabase Check
  check-supabase:
    needs: changes
    if: ${{ needs.changes.outputs.supabase == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase -v # CLI 설치 확인
      - name: Start Supabase
        run: supabase start
        working-directory: backend
      - name: Run pgTAP Database Tests
        run: supabase test db
        working-directory: backend
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Edge Function Tests
        run: deno test --allow-all functions/
        working-directory: backend/supabase
      - name: Stop Supabase
        if: always()
        run: supabase stop
        working-directory: backend
