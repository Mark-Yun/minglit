name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "dev" ]
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Migration version 중복 검사 (항상 실행 — path filter 없음)
  check-migration-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check duplicate migration versions
        run: |
          VERSIONS=$(ls supabase/migrations/*.sql 2>/dev/null | xargs -n1 basename | cut -c1-14 | sort)
          DUPES=$(echo "$VERSIONS" | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "❌ Duplicate migration versions found:"
            echo "$DUPES"
            exit 1
          fi
          echo "✅ All migration versions unique ($(echo "$VERSIONS" | wc -l | tr -d ' ') files checked)"

  # 변경 사항 감지 Job
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app_user: ${{ steps.filter.outputs.app_user }}
      app_partner: ${{ steps.filter.outputs.app_partner }}
      landing_user: ${{ steps.filter.outputs.landing_user }}
      landing_partner: ${{ steps.filter.outputs.landing_partner }}
      supabase: ${{ steps.filter.outputs.supabase }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          app_user:
            - 'apps/app_user/**'
            - 'shared/packages/minglit_kit/**'
          app_partner:
            - 'apps/app_partner/**'
            - 'shared/packages/minglit_kit/**'
          landing_user:
            - 'apps/landing_user/**'
            - 'shared/web/**'
          landing_partner:
            - 'apps/landing_partner/**'
            - 'shared/web/**'
          supabase:
            - 'supabase/**'
            - 'tests/backend_integration/**'

  # App CI (User + Partner)
  test-flutter-apps:
    needs: changes
    if: ${{ needs.changes.outputs.app_user == 'true' || needs.changes.outputs.app_partner == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: app_user
            change_key: app_user
            directory: apps/app_user
            report_name: 'User App Tests'
            artifact_name: app-user-coverage
            coverage_flag: app-user
          - app: app_partner
            change_key: app_partner
            directory: apps/app_partner
            report_name: 'Partner App Tests'
            artifact_name: app-partner-coverage
            coverage_flag: app-partner
          - app: minglit_kit
            change_key: app_user
            directory: shared/packages/minglit_kit
            report_name: 'Minglit Kit Tests'
            artifact_name: minglit-kit-coverage
            coverage_flag: minglit-kit
    steps:
      - uses: actions/checkout@v4
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
      - uses: subosito/flutter-action@v2
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        with:
          channel: 'stable'
          cache: true
      - name: Cache pub packages
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install dependencies
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        run: flutter pub get
      - name: Analyze (minglit_kit)
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        run: flutter analyze --no-fatal-infos
        working-directory: shared/packages/minglit_kit
      - name: Analyze
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        run: flutter analyze --no-fatal-infos
        working-directory: ${{ matrix.directory }}
      - name: Test
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        run: flutter test --coverage --file-reporter=json:test-results.json
        working-directory: ${{ matrix.directory }}
      - name: Integration Test
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' && matrix.app == 'app_user' }}
        run: flutter test test/integration/
        working-directory: ${{ matrix.directory }}
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: ${{ (success() || failure()) && needs.changes.outputs[matrix.change_key] == 'true' }}
        with:
          name: ${{ matrix.report_name }}
          path: ${{ matrix.directory }}/test-results.json
          reporter: dart-json
          fail-on-error: false
      - uses: actions/upload-artifact@v4
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.directory }}/coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: ${{ needs.changes.outputs[matrix.change_key] == 'true' }}
        with:
          file: ${{ matrix.directory }}/coverage/lcov.info
          flags: ${{ matrix.coverage_flag }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Landing User CI
  lint-landing-user:
    needs: changes
    if: ${{ needs.changes.outputs.landing_user == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/landing_user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./apps/landing_user/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Landing Partner CI
  lint-landing-partner:
    needs: changes
    if: ${{ needs.changes.outputs.landing_partner == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/landing_partner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./apps/landing_partner/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Supabase 통합 테스트 (pgTAP + backend-integration + e2e-scenarios)
  test-supabase:
    needs: changes
    if: ${{ needs.changes.outputs.supabase == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Start Supabase
        run: supabase start
      - name: Test (pgTAP)
        run: supabase test db
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install dependencies (integration)
        if: ${{ vars.ENABLE_BACKEND_INTEGRATION == 'true' }}
        run: flutter pub get
        working-directory: tests/backend_integration
      - name: Test (integration)
        if: ${{ vars.ENABLE_BACKEND_INTEGRATION == 'true' }}
        run: flutter test src/ --coverage
        working-directory: tests/backend_integration
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_LOCAL_SERVICE_ROLE_KEY }}
      - name: Format coverage
        if: ${{ vars.ENABLE_BACKEND_INTEGRATION == 'true' }}
        run: dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
        working-directory: tests/backend_integration
      - uses: codecov/codecov-action@v4
        if: ${{ vars.ENABLE_BACKEND_INTEGRATION == 'true' }}
        with:
          file: tests/backend_integration/coverage/lcov.info
          flags: backend-integration
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Install dependencies (e2e scenarios)
        if: ${{ vars.ENABLE_E2E_SCENARIOS == 'true' }}
        run: flutter pub get
        working-directory: apps/integration_scenario_tester
      - name: Test (e2e scenarios)
        if: ${{ vars.ENABLE_E2E_SCENARIOS == 'true' }}
        run: flutter test integration_test/
        working-directory: apps/integration_scenario_tester
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_LOCAL_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_LOCAL_SERVICE_ROLE_KEY }}
      - name: Stop Supabase
        if: always()
        run: supabase stop

  # Deno Edge Function 테스트 (supabase 불필요)
  test-edge-functions:
    needs: changes
    if: ${{ needs.changes.outputs.supabase == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test (edge functions)
        run: deno test --allow-all functions/
        working-directory: supabase

  ci-result:
    needs: [check-migration-versions, test-flutter-apps, lint-landing-user, lint-landing-partner, test-supabase, test-edge-functions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CI results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Check CI job results
          results='${{ toJSON(needs.*.result) }}'
          echo "Job results: $results"
          if echo "$results" | grep -q '"failure"'; then
            echo ""
            echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | select(.value.result == "failure") | "❌ \(.key)"'
            exit 1
          fi
          echo "✅ CI jobs passed"

          # 2. Wait for CodeRabbit review (PR only)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHA="${{ github.event.pull_request.head.sha }}"
            echo ""
            echo "Waiting for CodeRabbit review on $SHA ..."
            for i in $(seq 1 60); do
              STATE=$(gh api repos/${{ github.repository }}/commits/$SHA/status --jq '[.statuses[] | select(.context=="CodeRabbit") | .state][0] // ""' 2>/dev/null || echo "")
              if [ "$STATE" = "success" ]; then
                echo "✅ CodeRabbit review completed"
                break
              elif [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
                echo "❌ CodeRabbit review failed: $STATE"
                exit 1
              fi
              echo "  ⏳ Attempt $i/60 — state: ${STATE:-pending} — waiting 30s..."
              sleep 30
            done
            if [ "$STATE" != "success" ]; then
              echo "❌ CodeRabbit review did not complete within 30 minutes"
              exit 1
            fi
          fi

          echo ""
          echo "✅ All checks passed"

  notify-failure:
    needs: [check-migration-versions, test-flutter-apps, lint-landing-user, lint-landing-partner, test-supabase, test-edge-functions]
    if: always()
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      success: ${{ !contains(needs.*.result, 'failure') }}
      workflow_name: 'CI'