name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 변경 사항 감지 Job
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      app_user: ${{ steps.filter.outputs.app_user }}
      app_partner: ${{ steps.filter.outputs.app_partner }}
      landing_user: ${{ steps.filter.outputs.landing_user }}
      landing_partner: ${{ steps.filter.outputs.landing_partner }}
      supabase: ${{ steps.filter.outputs.supabase }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          app_user:
            - 'apps/app_user/**'
            - 'shared/packages/minglit_kit/**'
          app_partner:
            - 'apps/app_partner/**'
            - 'shared/packages/minglit_kit/**'
          landing_user:
            - 'apps/landing_user/**'
            - 'shared/web/**'
          landing_partner:
            - 'apps/landing_partner/**'
            - 'shared/web/**'
          supabase:
            - 'backend/supabase/**'

  # App User CI
  test-app-user:
// ... (keep existing Flutter jobs)
  # Landing User CI
  lint-landing-user:
    needs: changes
    if: ${{ needs.changes.outputs.landing_user == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/landing_user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./apps/landing_user/package-lock.json
      - run: npm ci
      - run: npm run lint

  # Landing Partner CI
  lint-landing-partner:
    needs: changes
    if: ${{ needs.changes.outputs.landing_partner == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/landing_partner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./apps/landing_partner/package-lock.json
      - run: npm ci
      - run: npm run lint

  # Supabase Check
  check-supabase:
    needs: changes
    if: ${{ needs.changes.outputs.supabase == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase -v # CLI 설치 확인
