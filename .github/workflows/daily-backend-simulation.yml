name: "Daily: Tick Simulator Pipeline + Emulator CUJ"

on:
  schedule:
    - cron: '0 22 * * *'  # KST 07:00
  workflow_dispatch:

concurrency:
  group: supabase-dev-simulation
  cancel-in-progress: false

jobs:
  seed-and-simulate:
    name: Seed and Simulate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # Fix #1413: seed.dev.sql 직접 실행 — psql 1번으로 560명 시딩 (~3초)
      # checkout이 필요한 이유: psql -f supabase/seed.dev.sql은 로컬 파일을 참조
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Seed users/partners (psql direct)
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
          PROJECT_ID: ${{ secrets.SUPABASE_DEV_PROJECT_ID }}
          # Fix #1553: Supabase 인프라 이전 — aws-0 → aws-1
          POOLER_HOST: aws-1-ap-northeast-2.pooler.supabase.com
        run: |
          PGPASSWORD="${DB_PASSWORD}" psql \
            "postgresql://postgres.${PROJECT_ID}:${DB_PASSWORD}@${POOLER_HOST}:5432/postgres?sslmode=require" \
            -v ON_ERROR_STOP=1 \
            -f supabase/seed.dev.sql

      - name: Upload seed images
        run: |
          # Fix #1635: use -s (not -sf) so error response body is printed before failing
          http_code=$(curl -s -o /tmp/seed_response.json -w "%{http_code}" -X POST \
            "${{ secrets.SUPABASE_DEV_URL }}/functions/v1/dev-seed?mode=images-only" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_DEV_SECRET_KEY }}" \
            --max-time 30)
          cat /tmp/seed_response.json
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "HTTP $http_code — dev-seed images-only returned an error"
            exit 1
          fi

      - name: Create parties and events
        run: |
          # Fix #705: backend-simulator create phase needs more time (cold start + data growth)
          # Fix #1635: use -s (not -sf) so error response body is printed before failing
          http_code=$(curl -s -o /tmp/sim_response.json -w "%{http_code}" -X POST \
            "${{ secrets.SUPABASE_DEV_URL }}/functions/v1/backend-simulator" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_DEV_SECRET_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"phase":"create"}' \
            --max-time 300)
          cat /tmp/sim_response.json
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "HTTP $http_code — backend-simulator phase=create returned an error"
            exit 1
          fi

      - name: Run full simulation (approve → refund → run → settle)
        run: |
          # Fix #1635: use -s (not -sf) so error response body is printed before failing
          for phase in approve refund run settle; do
            echo "▶ Running phase: $phase"
            http_code=$(curl -s -o /tmp/sim_response.json -w "%{http_code}" -X POST \
              "${{ secrets.SUPABASE_DEV_URL }}/functions/v1/backend-simulator" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_DEV_SECRET_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{\"phase\":\"$phase\"}" \
              --max-time 120)
            cat /tmp/sim_response.json
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "HTTP $http_code — backend-simulator phase=$phase returned an error"
              exit 1
            fi
            echo "✅ Phase $phase complete"
          done

  client-cuj-test:
    needs: seed-and-simulate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Create dev Flutter env file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
          ENVIRONMENT: development
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_FLUTTER }}
          STATSIG_CLIENT_KEY: ${{ secrets.STATSIG_CLIENT_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_DEV_WEB_CLIENT_ID }}
          KAKAO_LOCAL_REST_API_KEY: ${{ secrets.KAKAO_LOCAL_REST_API_KEY }}
          KAKAO_MAP_JAVASCRIPT_KEY: ${{ secrets.KAKAO_MAP_JAVASCRIPT_KEY }}
          JUSO_CONFIRM_KEY: ${{ secrets.JUSO_CONFIRM_KEY }}
          IAMPORT_USER_CODE: ${{ secrets.IAMPORT_USER_CODE }}
          MOBILE_REDIRECT_SCHEME: ${{ secrets.MOBILE_REDIRECT_SCHEME }}
        run: bash .github/scripts/create-dev-flutter-env.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run client CUJ tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          script: bash .github/scripts/run-client-cuj.sh

      - name: Upload CUJ screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-cuj-screenshots-${{ github.run_id }}
          path: apps/app_user/test/integration/goldens/
          if-no-files-found: ignore
          retention-days: 14

  partner-cuj-test:
    needs: seed-and-simulate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Create dev Flutter env file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
          ENVIRONMENT: development
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_FLUTTER }}
          STATSIG_CLIENT_KEY: ${{ secrets.STATSIG_CLIENT_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_DEV_WEB_CLIENT_ID }}
          KAKAO_LOCAL_REST_API_KEY: ${{ secrets.KAKAO_LOCAL_REST_API_KEY }}
          KAKAO_MAP_JAVASCRIPT_KEY: ${{ secrets.KAKAO_MAP_JAVASCRIPT_KEY }}
          JUSO_CONFIRM_KEY: ${{ secrets.JUSO_CONFIRM_KEY }}
          IAMPORT_USER_CODE: ${{ secrets.IAMPORT_USER_CODE }}
          MOBILE_REDIRECT_SCHEME: ${{ secrets.MOBILE_REDIRECT_SCHEME }}
        run: bash .github/scripts/create-dev-flutter-env.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run partner CUJ tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          script: bash .github/scripts/run-partner-cuj.sh

      - name: Upload CUJ screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partner-cuj-screenshots-${{ github.run_id }}
          path: apps/app_partner/test/integration/goldens/
          if-no-files-found: ignore
          retention-days: 14

  notify-failure:
    needs: [seed-and-simulate, client-cuj-test, partner-cuj-test]
    if: always()
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      success: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
      workflow_name: 'Daily: Tick Simulator Pipeline + Emulator CUJ'
    secrets: inherit
