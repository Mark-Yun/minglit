name: iOS Partner App Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "apps/app_partner/**"
      - "shared/packages/minglit_kit/**"
      - "pubspec.yaml"
  schedule:
    - cron: '0 10 * * *'  # Daily dev build (KST 19:00) — runs on default branch (dev)
  workflow_dispatch:

concurrency:
  group: ios-partner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-deploy:
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: iOS Deploy
        uses: ./.github/actions/ios-deploy
        with:
          app-name: partner
          app-directory: apps/app_partner
          bundle-id: com.minglit.appPartner
          provisioning-profile-dev-specifier: Minglit Partner App DEV Profile
          provisioning-profile-prod-specifier: Minglit Partner App Store Profile
          git-ref: ${{ github.ref }}
          run-number: ${{ github.run_number }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISION_PROFILE_DEV_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_PARTNER_DEV_BASE64 }}
          APPLE_PROVISION_PROFILE_PROD_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_PARTNER_BASE64 }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          SUPABASE_DEV_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_DEV_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
          KAKAO_LOCAL_REST_API_KEY: ${{ secrets.KAKAO_LOCAL_REST_API_KEY }}
          SENTRY_DSN_FLUTTER: ${{ secrets.SENTRY_DSN_FLUTTER }}
          SUPABASE_MAIN_URL: ${{ secrets.SUPABASE_MAIN_URL }}
          SUPABASE_MAIN_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_MAIN_PUBLISHABLE_KEY }}

  notify-failure:
    needs: [ios-deploy]
    if: always()
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      success: ${{ needs.ios-deploy.result == 'success' }}
      workflow_name: 'iOS Deploy Partner'
      job_results: '{"ios-deploy":"${{ needs.ios-deploy.result }}"}'
