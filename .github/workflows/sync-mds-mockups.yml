name: sync-mds-mockups

# Invoked by post-merge.yml on push to dev (paths filter applied at caller level).
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: sync-mds-mockups
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: [self-hosted, ephemeral]
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright + Chromium + Turndown
        working-directory: apps/mds/docs
        run: |
          npm install --no-save playwright turndown
          npx playwright install --with-deps chromium

      - name: Sync MDS tokens
        working-directory: apps/mds/docs
        run: npm run tokens:sync

      - name: Render spec assets (PNG + MD)
        working-directory: apps/mds/docs
        run: node scripts/render-spec-mockups.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'apps/mds/docs/public/specs/**/*.png' 'apps/mds/docs/public/specs/**/index.md'
          if git diff --staged --quiet; then
            echo "변경 없음 — commit skip"
            exit 0
          fi
          CHANGED=$(git diff --staged --name-only | wc -l)
          git commit -m "chore(mds): auto-regen $CHANGED spec asset(s) [skip ci]"
          git push
