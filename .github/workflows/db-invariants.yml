name: "Hourly: DB Invariant Monitor"

on:
  schedule:
    - cron: '5 * * * *'  # Every hour at :05 (avoid :00 congestion)
  workflow_dispatch:

concurrency:
  group: db-invariant-monitor
  cancel-in-progress: false

jobs:
  check:
    name: Run DB invariant checks
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write
    steps:
      - name: Run check_db_invariants()
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_DEV_SECRET_KEY }}
        run: |
          RESPONSE=$(curl -s \
            "${SUPABASE_URL}/rest/v1/rpc/check_db_invariants" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "Response: $RESPONSE"

          # Fallback to false if curl fails or response is not valid JSON
          PASSED=$(echo "$RESPONSE" | jq -r '.passed // "false"' 2>/dev/null || echo "false")
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "response=$RESPONSE" >> "$GITHUB_OUTPUT"

          if [ "$PASSED" != "true" ]; then
            echo "::error::DB invariant violations detected"
            echo "$RESPONSE" | jq '.violations'
          fi

      - name: Create or update GitHub Issue on violation
        if: steps.check.outputs.passed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESPONSE: ${{ steps.check.outputs.response }}
        run: |
          VIOLATIONS=$(echo "$RESPONSE" | jq -r '.violations | map("| \(.id) | \(.severity) | \(.message) | \(.count) |") | join("\n")')
          CHECKED_AT=$(echo "$RESPONSE" | jq -r '.checked_at')

          # Derive label from highest severity in violations (P0 > P1)
          HAS_P0=$(echo "$RESPONSE" | jq -r '[.violations[] | select(.severity == "P0")] | length > 0')
          if [ "$HAS_P0" = "true" ]; then
            LABEL="P0-critical,bug"
          else
            LABEL="P1-high,bug"
          fi

          BODY=$(printf '%s\n' \
            "## DB Invariant Violation" \
            "" \
            "| ID | Severity | Message | Count |" \
            "|----|----------|---------|-------|" \
            "${VIOLATIONS}" \
            "" \
            "**Checked at**: ${CHECKED_AT}" \
            "**Workflow**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "" \
            "---" \
            "*Auto-generated by DB Invariant Monitor (#1427)*")

          # Dedup: update existing open invariant-monitor issue if one exists (search by title)
          EXISTING=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "DB Invariant Violation in:title" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" \
              --repo "${{ github.repository }}" \
              --body "$BODY"
            echo "Updated existing issue #${EXISTING}"
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "DB Invariant Violation" \
              --label "${LABEL}" \
              --body "$BODY"
          fi
