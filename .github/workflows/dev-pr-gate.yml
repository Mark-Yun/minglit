name: dev-pr-gate

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write
  pull-requests: read
  checks: write
  issues: write

concurrency:
  group: dev-pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-guard:
    uses: ./.github/workflows/shared-pr-source-guard.yml
    with:
      target: dev
      normal_head_regex: '^cut/dev-staging-dev/'
      hotfix_head_regex: '^dev/hotfix/'
      hotfix_label: 'hotfix:dev-approved'
    secrets: inherit

  pr-gate-core:
    uses: ./.github/workflows/pr-gate.yml
    with:
      stage: dev
      base_ref: dev
    secrets: inherit

  dev-pr-gate:
    needs: [source-guard, pr-gate-core]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish branch gate result
        run: |
          if [ "${{ needs.source-guard.result }}" != "success" ]; then
            echo "::error::source-guard result: ${{ needs.source-guard.result }}"
            exit 1
          fi
          if [ "${{ needs.pr-gate-core.result }}" != "success" ]; then
            echo "::error::pr-gate-core result: ${{ needs.pr-gate-core.result }}"
            exit 1
          fi
          echo "dev-pr-gate passed"
