name: Version Bump

on:
  pull_request:
    types: [closed]
    branches: [dev, main]

concurrency:
  group: version-bump-${{ github.base_ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: >-
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.title, 'chore: bump version')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_VERSION_BUMP }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Calculate next CalVer version
        id: version
        run: |
          BRANCH="${{ github.base_ref }}"
          CURRENT=$(grep "^version:" apps/app_user/pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | sed 's/-dev$//')
          echo "current=$CURRENT"

          IFS='.' read -r CUR_YY CUR_MM CUR_PR <<< "$CURRENT"

          # Current year/month (2-digit)
          NOW_YY=$(date -u +%y)
          NOW_MM=$(date -u +%m)

          if [ "$CUR_YY" = "$NOW_YY" ] && [ "$CUR_MM" = "$NOW_MM" ]; then
            # Same month → increment PR#
            NEXT_PR=$(( 10#$CUR_PR + 1 ))
          else
            # New month → reset PR# to 1
            NEXT_PR=1
          fi

          BASE="${NOW_YY}.${NOW_MM}.${NEXT_PR}"

          if [ "$BRANCH" = "dev" ]; then
            NEW_VERSION="${BASE}-dev"
          else
            NEW_VERSION="${BASE}"
          fi

          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEW_VERSION"

      - name: Run bump-version.sh
        run: bash scripts/bump-version.sh "${{ steps.version.outputs.new }}"

      - name: Commit and push version bump
        run: |
          NEW_VERSION="${{ steps.version.outputs.new }}"
          BRANCH="${{ github.base_ref }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet && { echo "No version changes to commit."; exit 0; }
          git commit -m "chore: bump version to v${NEW_VERSION} [skip ci]"
          git push origin HEAD:${BRANCH}

  notify-failure:
    needs: [bump]
    if: always()
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      success: ${{ needs.bump.result == 'success' }}
      workflow_name: 'Version Bump'
