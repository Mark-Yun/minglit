name: Version Bump

on:
  pull_request:
    types: [closed]
    branches: [dev, main]

concurrency:
  group: version-bump-${{ github.base_ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: >-
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.title, 'chore: bump version')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_VERSION_BUMP }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Calculate next CalVer version
        id: version
        run: |
          BRANCH="${{ github.base_ref }}"
          CURRENT=$(grep "^version:" apps/app_user/pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | sed 's/-dev$//')
          echo "current=$CURRENT"

          # Current year/month (2-digit)
          NOW_YY=$(date -u +%y)
          NOW_MM=$(date -u +%m)

          # Use the merged PR number as the revision
          PR_NUM="${{ github.event.pull_request.number }}"

          BASE="${NOW_YY}.${NOW_MM}.${PR_NUM}"

          if [ "$BRANCH" = "dev" ]; then
            NEW_VERSION="${BASE}-dev"
          else
            NEW_VERSION="${BASE}"
          fi

          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEW_VERSION"

      - name: Run bump-version.sh
        run: bash scripts/bump-version.sh "${{ steps.version.outputs.new }}"

      - name: Commit and push version bump
        run: |
          NEW_VERSION="${{ steps.version.outputs.new }}"
          BRANCH="${{ github.base_ref }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet && { echo "No version changes to commit."; exit 0; }
          git commit -m "chore: bump version to v${NEW_VERSION} [skip ci]"
          # Fix #1554: push race — dev가 다른 경로로 전진할 수 있어 pull --rebase + retry
          MAX_ATTEMPTS=5
          ATTEMPT=0
          until git push origin HEAD:${BRANCH}; do
            ATTEMPT=$((ATTEMPT+1))
            if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
              echo "::error::push failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "::warning::push rejected (attempt $ATTEMPT/$MAX_ATTEMPTS), rebasing on origin/${BRANCH} and retrying..."
            git fetch origin ${BRANCH}
            git rebase origin/${BRANCH} || {
              echo "::error::rebase failed — manual resolution required"
              exit 1
            }
            sleep $((2 * ATTEMPT))
          done

      - name: Create GitHub release (main only)
        if: github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_VERSION_BUMP }}
        run: |
          VERSION="${{ steps.version.outputs.base }}"
          gh release create "v${VERSION}" \
            --generate-notes \
            --target main \
            --title "v${VERSION}"

  notify-failure:
    needs: [bump]
    if: always()
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      success: ${{ needs.bump.result == 'success' || needs.bump.result == 'skipped' }}
      workflow_name: 'Version Bump'
      job_results: '{"bump":"${{ needs.bump.result }}"}'