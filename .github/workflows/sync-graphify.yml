name: sync-graphify

on:
  push:
    branches: [dev-staging]
    paths-ignore:
      - 'graphify-out/**'
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC = 13:00 KST, daily safety net
  workflow_dispatch:

concurrency:
  group: sync-graphify
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev-staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev-staging
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release bot token
        id: release-bot
        uses: ./.github/actions/release-bot-token
        with:
          fallback-app-id: ${{ secrets.MINGLIT_RELEASE_BOT_APP_ID }}
          fallback-private-key: ${{ secrets.MINGLIT_RELEASE_BOT_PRIVATE_KEY }}

      - name: Guard target branch
        run: |
          branch="$(git branch --show-current)"
          if [ "${branch}" != "dev-staging" ]; then
            echo "::error::Graphify sync is allowed to commit only on dev-staging; checked out ${branch}."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-graphifyy-0.8.8

      - name: Install graphify
        run: pip install graphifyy==0.8.8

      - name: Update graph
        run: graphify update .

      - name: Commit & push if changed
        env:
          RELEASE_BOT_TOKEN: ${{ steps.release-bot.outputs.token }}
        run: |
          if [[ -n "$(git status --porcelain graphify-out/)" ]]; then
            git config user.name "minglit-release-bot"
            git config user.email "minglit-release-bot@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${RELEASE_BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git add graphify-out/
            git commit -m "chore(graphify): auto-update [skip ci]"
            git push origin HEAD:dev-staging
          else
            echo "No graph changes"
          fi
