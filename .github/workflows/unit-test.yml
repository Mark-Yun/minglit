name: Unit Tests (App User)

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "apps/app_user/**"
      - "shared/packages/**"
  push:
    branches: [main, dev]
    paths:
      - "apps/app_user/**"
      - "shared/packages/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Pub Get (workspace root)
        run: flutter pub get

      - name: Minglit Kit - Analyze
        run: flutter analyze
        working-directory: shared/packages/minglit_kit

      - name: App User - Analyze
        run: flutter analyze
        working-directory: apps/app_user

      - name: App User - Unit Tests
        run: flutter test
        working-directory: apps/app_user
