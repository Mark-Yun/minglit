name: dev-staging-dev-cut

on:
  schedule:
    # 02:00 KST daily.
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Optional v*-dev-staging tag to promote instead of the latest one.
        required: false
        type: string
      dry_run:
        description: Plan only; do not push branch, create PR, or enable auto-merge.
        required: false
        type: boolean
        default: false

concurrency:
  group: dev-staging-dev-cut
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-dev-cut-pr:
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.plan.outputs.skipped }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      tag_name: ${{ steps.plan.outputs.tag_name }}
      branch_name: ${{ steps.plan.outputs.branch_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Generate release bot token
        id: release-bot
        uses: ./.github/actions/release-bot-token
        with:
          fallback-app-id: ${{ secrets.MINGLIT_RELEASE_BOT_APP_ID }}
          fallback-private-key: ${{ secrets.MINGLIT_RELEASE_BOT_PRIVATE_KEY }}

      - name: Plan dev promotion
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BOT_TOKEN: ${{ steps.release-bot.outputs.token }}
          REQUESTED_TAG: ${{ inputs.tag_name || '' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail

          git remote set-url origin "https://x-access-token:${RELEASE_BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin dev dev-staging --tags --force

          OPEN_PR="$(gh pr list \
            --base dev \
            --state open \
            --json number,headRefName \
            --jq '[.[] | select((.headRefName | startswith("cut/dev-staging-dev/")) or (.headRefName | startswith("nightly/")))][0].number // empty')"
          if [ -n "${OPEN_PR}" ]; then
            echo "dev-staging-dev-cut PR #${OPEN_PR} is already open; skipping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${REQUESTED_TAG}" ]; then
            TAG_NAME="${REQUESTED_TAG}"
          else
            TAG_NAME="$(git for-each-ref \
              --sort=-creatordate \
              --format='%(refname:short)' \
              'refs/tags/v*-dev-staging' | head -n 1)"
          fi

          if [ -z "${TAG_NAME}" ]; then
            echo "::error::No v*-dev-staging tag found to promote."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            echo "::error::Tag ${TAG_NAME} does not exist."
            exit 1
          fi

          TAG_SHA="$(git rev-list -n 1 "${TAG_NAME}")"
          if ! git merge-base --is-ancestor "${TAG_SHA}" origin/dev-staging; then
            echo "::error::Tag ${TAG_NAME} (${TAG_SHA}) is not reachable from origin/dev-staging."
            exit 1
          fi

          if git merge-base --is-ancestor "${TAG_SHA}" origin/dev; then
            echo "origin/dev already contains ${TAG_NAME}; skipping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUN_DATE="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          SHORT_SHA="${TAG_SHA:0:8}"
          BRANCH_NAME="cut/dev-staging-dev/${RUN_DATE}-${SHORT_SHA}"
          if git ls-remote --exit-code --heads origin "${BRANCH_NAME}" >/dev/null 2>&1; then
            BRANCH_NAME="${BRANCH_NAME}-${GITHUB_RUN_ID}"
          fi

          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${TAG_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

          {
            echo "## dev-staging-dev-cut plan"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| dry_run | ${DRY_RUN} |"
            echo "| tag_name | ${TAG_NAME} |"
            echo "| tag_sha | ${TAG_SHA} |"
            echo "| branch_name | ${BRANCH_NAME} |"
            echo "| action | create PR ${BRANCH_NAME} -> dev |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push dev promotion branch
        if: steps.plan.outputs.skipped != 'true' && inputs.dry_run != true
        env:
          RELEASE_BOT_TOKEN: ${{ steps.release-bot.outputs.token }}
          TAG_SHA: ${{ steps.plan.outputs.tag_sha }}
          BRANCH_NAME: ${{ steps.plan.outputs.branch_name }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${RELEASE_BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "${TAG_SHA}:refs/heads/${BRANCH_NAME}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Create dev promotion PR and enable auto-merge
        id: pr
        if: steps.plan.outputs.skipped != 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          TAG_NAME: ${{ steps.plan.outputs.tag_name }}
          TAG_SHA: ${{ steps.plan.outputs.tag_sha }}
          BRANCH_NAME: ${{ steps.plan.outputs.branch_name }}
        run: |
          set -euo pipefail
          BODY="$(cat <<EOF
          Promotes \`${TAG_NAME}\` from \`dev-staging\` to \`dev\`.

          - Source tag: ${TAG_NAME}
          - Source SHA: ${TAG_SHA}
          - Merge mode: rebase, because the active dev ruleset requires linear history.
          EOF
          )"

          PR_URL="$(gh pr create \
            --base dev \
            --head "${BRANCH_NAME}" \
            --title "ci(dev-staging-dev-cut): promote ${TAG_NAME} to dev" \
            --body "${BODY}")"
          PR_NUMBER="${PR_URL##*/}"

          gh pr merge "${PR_NUMBER}" --auto --rebase --delete-branch
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Dry run summary
        if: steps.plan.outputs.skipped != 'true' && inputs.dry_run == true
        run: |
          echo "Dry-run complete. No branch, PR, or auto-merge was created."

  notify-failure:
    needs: [create-dev-cut-pr]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
      statuses: write
    uses: ./.github/workflows/shared-notify.yml
    with:
      failed: ${{ needs.create-dev-cut-pr.result != 'success' && needs.create-dev-cut-pr.result != 'skipped' }}
      workflow_name: 'Dev-Staging Dev Cut'
      severity: 'P1-high'
      job_results: '{"create-dev-cut-pr":"${{ needs.create-dev-cut-pr.result }}"}'
