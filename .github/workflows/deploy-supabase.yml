name: deploy-supabase

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'env-manifest.json'
  workflow_dispatch:

concurrency:
  group: deploy-supabase-${{ github.ref }}
  cancel-in-progress: false   # DB 마이그레이션 보호 — 부분 적용 방지

jobs:
  deploy:
    runs-on: [self-hosted, ephemeral]
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Set environment variables
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "ENV=dev" >> "$GITHUB_OUTPUT"
            echo "PROJECT_ID=${{ secrets.SUPABASE_DEV_PROJECT_ID }}" >> "$GITHUB_OUTPUT"
            echo "DB_PASSWORD=${{ secrets.SUPABASE_DEV_DB_PASSWORD }}" >> "$GITHUB_OUTPUT"
            echo "PUBLISHABLE_KEY=${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}" >> "$GITHUB_OUTPUT"
            echo "SERVICE_ROLE_KEY=${{ secrets.SUPABASE_DEV_SECRET_KEY }}" >> "$GITHUB_OUTPUT"
            echo "ENVIRONMENT_VALUE=dev" >> "$GITHUB_OUTPUT"
          else
            echo "ENV=main" >> "$GITHUB_OUTPUT"
            echo "PROJECT_ID=${{ secrets.SUPABASE_MAIN_PROJECT_ID }}" >> "$GITHUB_OUTPUT"
            echo "DB_PASSWORD=${{ secrets.SUPABASE_MAIN_DB_PASSWORD }}" >> "$GITHUB_OUTPUT"
            echo "PUBLISHABLE_KEY=${{ secrets.SUPABASE_MAIN_PUBLISHABLE_KEY }}" >> "$GITHUB_OUTPUT"
            echo "SERVICE_ROLE_KEY=${{ secrets.SUPABASE_MAIN_SECRET_KEY }}" >> "$GITHUB_OUTPUT"
            echo "ENVIRONMENT_VALUE=production" >> "$GITHUB_OUTPUT"
          fi

      # Fix #470: Dev/Main 배포 로직 통합 — 중복 제거 + Main에 누락된 SERVICE_ROLE_KEY 추가
      - name: Deploy to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ steps.env.outputs.DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ steps.env.outputs.PROJECT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.env.outputs.SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_ACCESS_TOKEN: ${{ secrets.GH_PAT_FOR_BUG_REPORT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_EDGE_FUNCTIONS }}
          STATSIG_SERVER_KEY: ${{ secrets.STATSIG_SERVER_KEY }}
          AXIOM_API_TOKEN: ${{ secrets.AXIOM_API_TOKEN }}
          SIM_USER_PASSWORD: ${{ secrets.SIM_USER_PASSWORD }}
          # Fix #1683: PortOne secrets — dev/main 환경별 분기
          PORTONE_API_KEY_DEV: ${{ secrets.PORTONE_DEV_API_KEY }}
          PORTONE_API_SECRET_DEV: ${{ secrets.PORTONE_DEV_API_SECRET }}
          PORTONE_V2_API_KEY_DEV: ${{ secrets.PORTONE_DEV_V2_API_KEY }}
          PORTONE_V2_WEBHOOK_SECRET_DEV: ${{ secrets.PORTONE_DEV_V2_WEBHOOK_SECRET }}
          PORTONE_API_KEY_MAIN: ${{ secrets.PORTONE_MAIN_API_KEY }}
          PORTONE_API_SECRET_MAIN: ${{ secrets.PORTONE_MAIN_API_SECRET }}
          PORTONE_V2_API_KEY_MAIN: ${{ secrets.PORTONE_MAIN_V2_API_KEY }}
          PORTONE_V2_WEBHOOK_SECRET_MAIN: ${{ secrets.PORTONE_MAIN_V2_WEBHOOK_SECRET }}
        run: |
          # Fix #1971: SUPABASE_DB_PASSWORD env var is set above — drop --password to avoid
          # process-list exposure (/proc/pid/cmdline) on shared runners.
          supabase link --project-ref $SUPABASE_PROJECT_ID

          supabase secrets set OPENAI_API_KEY=$OPENAI_API_KEY
          supabase secrets set GITHUB_ACCESS_TOKEN=$GITHUB_ACCESS_TOKEN
          supabase secrets set SENTRY_DSN=$SENTRY_DSN
          if [ -z "$AXIOM_API_TOKEN" ]; then
            echo "AXIOM_API_TOKEN is not set. Skipping."
          else
            supabase secrets set AXIOM_API_TOKEN=$AXIOM_API_TOKEN
            supabase secrets set AXIOM_DATASET=edge-functions
          fi
          if [ -z "$STATSIG_SERVER_KEY" ]; then
            echo "STATSIG_SERVER_KEY is not set. Skipping."
          else
            supabase secrets set STATSIG_SERVER_KEY=$STATSIG_SERVER_KEY
          fi
          supabase secrets set ENVIRONMENT=${{ steps.env.outputs.ENVIRONMENT_VALUE }}
          # Fix #1508: GitHub Secret 경유로 주입 — 평문 하드코딩 제거 (dev 시뮬레이터 전용)
          if [ "${{ steps.env.outputs.ENV }}" = "dev" ]; then
            if [ -z "$SIM_USER_PASSWORD" ]; then
              echo "::error::SIM_USER_PASSWORD is required for dev backend-simulator deploys"
              exit 1
            fi
            supabase secrets set SIM_USER_PASSWORD=$SIM_USER_PASSWORD
          fi

          # Fix #1683: PortOne secrets 환경별 선택 후 주입 — dev/main 분기
          if [ "${{ steps.env.outputs.ENV }}" = "dev" ]; then
            PK=$PORTONE_API_KEY_DEV
            PS=$PORTONE_API_SECRET_DEV
            PV2=$PORTONE_V2_API_KEY_DEV
            PWH=$PORTONE_V2_WEBHOOK_SECRET_DEV
          else
            PK=$PORTONE_API_KEY_MAIN
            PS=$PORTONE_API_SECRET_MAIN
            PV2=$PORTONE_V2_API_KEY_MAIN
            PWH=$PORTONE_V2_WEBHOOK_SECRET_MAIN
          fi
          if [ -n "$PK" ]; then
            supabase secrets set PORTONE_API_KEY=$PK
            supabase secrets set PORTONE_API_SECRET=$PS
          else
            echo "PORTONE_API_KEY not set — skipping V1 secrets injection"
          fi
          if [ -n "$PV2" ]; then
            supabase secrets set PORTONE_V2_API_KEY=$PV2
          else
            echo "PORTONE_V2_API_KEY not set — skipping V2 API key injection"
          fi
          if [ -n "$PWH" ]; then
            supabase secrets set PORTONE_V2_WEBHOOK_SECRET=$PWH
          else
            echo "PORTONE_V2_WEBHOOK_SECRET not set — skipping webhook secret injection"
          fi

          supabase db push --include-all

          supabase functions deploy

      # --- Post-deploy verification (env-manifest based) ---

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Fix #2153: pg_cron→EF auth용 vault secret 자동 동기화 — #352에서 IPv6 이슈로
      # 제거된 inject step을 #1228 pooler 전환 후 부활. idempotent upsert로 secret이
      # 어떤 이유로 사라져도 (인프라 이전 #1553, branching, 수동 삭제) 다음 deploy에서
      # 자동 복구. main은 SUPABASE_MAIN_SECRET_KEY GH Secret 등록 후 활성화 (현재 누락 시
      # 빈 값 가드로 fail-fast).
      - name: Sync Vault secrets
        env:
          DB_PASSWORD: ${{ steps.env.outputs.DB_PASSWORD }}
          PROJECT_ID: ${{ steps.env.outputs.PROJECT_ID }}
          SERVICE_ROLE_KEY: ${{ steps.env.outputs.SERVICE_ROLE_KEY }}
          ENV_NAME: ${{ steps.env.outputs.ENV }}
          # Fix #1228: pooler endpoint for IPv4 (db.{ref}.supabase.co is IPv6 only)
          # Fix #1553: aws-0 → aws-1 infrastructure migration
          POOLER_HOST: aws-1-ap-northeast-2.pooler.supabase.com
        run: |
          # Fail-fast guards
          if [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::error::SERVICE_ROLE_KEY is empty — register SUPABASE_${ENV_NAME^^}_SECRET_KEY in GitHub Secrets"
            exit 1
          fi
          if [ -z "$PROJECT_ID" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::error::PROJECT_ID or DB_PASSWORD is empty"
            exit 1
          fi

          CONN_URL="postgresql://postgres.${PROJECT_ID}@${POOLER_HOST}:5432/postgres?sslmode=require"
          SUPABASE_URL_VALUE="https://${PROJECT_ID}.supabase.co"

          # Idempotent upsert via 2-call pattern (check existence → create or update).
          # Fix #2154 후속: psql -c 안에서 :'var' 보간이 동작 안 함 (LINE 1: ... = :'name'
          # syntax error). 기존 Verify vault secrets step 패턴 따라 bash interpolation
          # 사용. SQL injection 방어: 값 안의 ' 를 '' 로 escape (PostgreSQL 표준 string
          # literal escape). secret 값(JWT/URL)은 base64url + . / https + alphanumeric
          # 이라 ' 자체가 없지만 defensive escape 적용.
          sql_escape() {
            printf '%s' "$1" | sed "s/'/''/g"
          }

          sync_secret() {
            local name="$1"
            local value="$2"
            local desc="$3"
            local existing_id name_esc value_esc desc_esc

            name_esc=$(sql_escape "$name")
            value_esc=$(sql_escape "$value")
            desc_esc=$(sql_escape "$desc")

            existing_id=$(PGPASSWORD="${DB_PASSWORD}" psql "${CONN_URL}" \
              -t -A \
              -c "SELECT id FROM vault.secrets WHERE name = '${name_esc}';") || {
              echo "::error::psql failed querying vault.secrets for '${name}'"
              exit 1
            }

            if [ -z "$existing_id" ]; then
              PGPASSWORD="${DB_PASSWORD}" psql "${CONN_URL}" \
                -c "SELECT vault.create_secret('${value_esc}', '${name_esc}', '${desc_esc}');" > /dev/null || {
                echo "::error::vault.create_secret failed for '${name}'"
                exit 1
              }
              echo "vault: ${name} created"
            else
              PGPASSWORD="${DB_PASSWORD}" psql "${CONN_URL}" \
                -c "SELECT vault.update_secret('${existing_id}'::uuid, '${value_esc}', '${name_esc}', '${desc_esc}');" > /dev/null || {
                echo "::error::vault.update_secret failed for '${name}'"
                exit 1
              }
              echo "vault: ${name} updated (id=${existing_id})"
            fi
          }

          sync_secret "service_role_key" "${SERVICE_ROLE_KEY}" "Service role JWT for pg_cron -> EF auth (CI auto-sync)"
          sync_secret "supabase_url"     "${SUPABASE_URL_VALUE}" "Supabase project URL for pg_cron -> EF calls (CI auto-sync)"

          echo "Vault sync complete (${ENV_NAME})"

      # Fix #1413: seed via CLI — psql/pooler 불필요, CLI가 자체 연결
      # Note: --include-seed는 마이그레이션 push도 포함하지만 Supabase CLI가
      # schema_migrations 테이블로 이미 적용된 마이그레이션을 추적·스킵하므로 이중 적용 없음.
      # seed.dev.sql 사용을 위해 config.toml을 임시 수정 후 별도 스텝으로 실행.
      - name: Seed dev data (db push --include-seed)
        if: ${{ steps.env.outputs.ENV == 'dev' }}
        env:
          SUPABASE_DB_PASSWORD: ${{ steps.env.outputs.DB_PASSWORD }}
        run: |
          sed -i 's|sql_paths = \["./seed.sql"\]|sql_paths = ["./seed.dev.sql"]|' supabase/config.toml
          grep -q 'sql_paths = \["./seed.dev.sql"\]' supabase/config.toml || {
            echo "::error::failed to switch db.seed.sql_paths to seed.dev.sql"
            exit 1
          }
          yes | supabase db push --include-seed
          echo "Dev seed complete"

      - name: Upload seed images
        if: ${{ steps.env.outputs.ENV == 'dev' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_DEV_SECRET_KEY }}
        run: |
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            "${SUPABASE_URL}/functions/v1/dev-seed?mode=images-only" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            --max-time 30)
          CURL_EXIT=$?
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::dev-seed request failed before HTTP response (curl exit: $CURL_EXIT)"
            exit 1
          fi
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "$BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::dev-seed failed: $BODY"
            exit 1
          fi
          echo "Seed images uploaded successfully"

      - name: Verify vault secrets
        env:
          DB_PASSWORD: ${{ steps.env.outputs.DB_PASSWORD }}
          PROJECT_ID: ${{ steps.env.outputs.PROJECT_ID }}
          # Fix #1228: db.{ref}.supabase.co A 레코드 제거(IPv6 only) → pooler 엔드포인트로 전환.
          # GitHub runner는 IPv6 outbound 불가. pooler(ELB)는 IPv4 A 레코드 유지.
          # Region은 Seoul 하드코딩 (dev/main 두 프로젝트 모두 ap-northeast-2).
          # Fix #1553: Supabase 인프라 이전 — aws-0 → aws-1
          POOLER_HOST: aws-1-ap-northeast-2.pooler.supabase.com
        run: |
          # Fix #1228: pooler 사용으로 DNS fallback chain 불필요 — 삭제.
          # Pooler는 tenant-qualified username(postgres.{project_ref}) 사용, session mode(5432).
          # Fix #1971: remove password from URL — PGPASSWORD env var handles auth,
          # embedding in URL exposes it via /proc/pid/cmdline when psql is invoked.
          CONN_URL="postgresql://postgres.${PROJECT_ID}@${POOLER_HOST}:5432/postgres?sslmode=require"

          REQUIRED=$(jq -r '.vault.required | keys[]' env-manifest.json)
          VAULT_MISSING=""
          for key in $REQUIRED; do
            EXISTS=$(PGPASSWORD="${DB_PASSWORD}" psql "${CONN_URL}" \
              -t -A -c "SELECT count(*) FROM vault.decrypted_secrets WHERE name='$key';" 2>&1) || {
              echo "::error::psql failed for key='$key': $EXISTS"
              exit 1
            }
            if [ "$EXISTS" = "0" ]; then
              VAULT_MISSING="$VAULT_MISSING $key"
            fi
          done
          if [ -n "$VAULT_MISSING" ]; then
            echo "::error::Vault secrets missing:$VAULT_MISSING"
            exit 1
          fi
          echo "Vault secrets OK (verified via pooler)"

      - name: Verify Edge Function env vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fix #1944: ?env=true now requires service_role — anon key would return 401.
          SERVICE_ROLE_KEY: ${{ steps.env.outputs.SERVICE_ROLE_KEY }}
          PROJECT_ID: ${{ steps.env.outputs.PROJECT_ID }}
          ENV_NAME: ${{ steps.env.outputs.ENV }}
        run: |
          RESPONSE=$(curl -sf "https://${PROJECT_ID}.supabase.co/functions/v1/health?env=true" \
            -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" --max-time 15) || {
            echo "::warning::Health endpoint unreachable — skipping EF env check"
            exit 0
          }

          if ! echo "$RESPONSE" | jq -e . > /dev/null 2>&1; then
            echo "::warning::Health endpoint returned invalid JSON — skipping EF env check"
            exit 0
          fi

          MISSING=$(echo "$RESPONSE" | jq -r \
            '.env_check.by_function // {} | to_entries[] | "\(.key): \(.value | join(", "))"')

          if [ -n "$MISSING" ]; then
            TITLE="Missing env vars after deploy on ${ENV_NAME}"
            EXISTING=$(gh issue list --search "\"${TITLE}\" in:title" --state open --json number -q '.[0].number')
            BODY=$(cat <<BODY_EOF
          **Missing EF env vars:**
          \`\`\`
          ${MISSING}
          \`\`\`
          **Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BODY_EOF
            )

            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY"
            else
              gh issue create --title "$TITLE" --label "ci-failure,P0-critical" --body "$BODY"
            fi
            echo "::warning::EF env vars missing (issue created/updated)"
          else
            echo "EF env vars OK"
          fi

      - name: Verify GitHub Secrets match manifest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REQUIRED=$(jq -r '.github_secrets.required | keys[]' env-manifest.json)
          EXISTING=$(gh secret list --json name -q '.[].name')
          GH_MISSING=""
          for key in $REQUIRED; do
            echo "$EXISTING" | grep -q "^${key}$" || GH_MISSING="$GH_MISSING $key"
          done
          if [ -n "$GH_MISSING" ]; then
            echo "::warning::GitHub Secrets missing from manifest:$GH_MISSING"
          else
            echo "GitHub Secrets OK"
          fi

  notify-failure:
    needs: [deploy]
    if: always()
    permissions:
      issues: write
    uses: ./.github/workflows/shared-notify.yml
    with:
      success: ${{ needs.deploy.result == 'success' }}
      workflow_name: 'Deploy Supabase Migrations'
      job_results: '{"deploy":"${{ needs.deploy.result }}"}'