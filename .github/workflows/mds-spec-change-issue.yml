name: MDS Spec Change → Issue

on:
  push:
    branches: [dev]
    paths:
      - 'apps/mds/docs/public/specs/**'
      - 'apps/mds/docs/src/lib/components.ts'
      - 'apps/mds/docs/src/components/specs/**'

concurrency:
  group: mds-spec-change-issue-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  file-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2

      - name: Collect changed spec files
        id: collect
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Use github.event.before as base; fall back to HEAD^ for first push to branch
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${HEAD_SHA}^"
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            'apps/mds/docs/public/specs/**' \
            'apps/mds/docs/src/lib/components.ts' \
            'apps/mds/docs/src/components/specs/**' || true)

          if [ -z "$CHANGED" ]; then
            echo "no spec files changed"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Build issue body
        if: steps.collect.outputs.skip != 'true'
        id: body
        env:
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          BASE_SHA: ${{ github.event.before }}
          CHANGED_FILES: ${{ steps.collect.outputs.files }}
        run: |
          COMMIT_URL="https://github.com/${REPO}/commit/${COMMIT_SHA}"
          COMMIT_MSG=$(git log -1 --pretty=%s "$COMMIT_SHA")

          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${COMMIT_SHA}^"
          fi

          {
            echo "body<<BODY_EOF"
            echo "## 변경된 mds spec"
            echo ""
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              echo "- \`$f\`"
            done <<< "$CHANGED_FILES"
            echo ""
            echo "## 원인 commit"
            echo ""
            echo "[\`${COMMIT_SHA:0:7}\`]($COMMIT_URL) — $COMMIT_MSG"
            echo "by @$AUTHOR"
            echo ""
            echo "## diff 요약 (최대 200줄)"
            echo ""
            echo '```diff'
            git diff "$BASE_SHA" "$COMMIT_SHA" -- \
              'apps/mds/docs/public/specs/**' \
              'apps/mds/docs/src/lib/components.ts' \
              'apps/mds/docs/src/components/specs/**' \
              | head -n 200
            echo '```'
            echo ""
            echo "## tpm 트리아지 가이드"
            echo ""
            echo "- spec 변경이 **코드 반영을 요구**하면 → \`needs-swe\` 부여 (본문에 관련 Flutter 위젯 경로 명시)"
            echo "- spec 변경이 **단순 정리/리팩터링**이면 → close"
            echo "- 판단 애매하면 → \`needs-uiux\` 부여 (ux-designer 워커가 drift 분석)"
            echo ""
            echo "## 관련 Flutter 코드 검색 힌트"
            echo ""
            echo '```bash'
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              base=$(basename "$f" .html)
              base=$(basename "$base" .tsx)
              echo "grep -r '$base' apps/app_user/lib/ apps/app_partner/lib/ shared/packages/minglit_kit/lib/"
            done <<< "$CHANGED_FILES"
            echo '```'
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create issue
        if: steps.collect.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          CHANGED_FILES: ${{ steps.collect.outputs.files }}
          BODY: ${{ steps.body.outputs.body }}
        run: |
          FILE_COUNT=$(echo "$CHANGED_FILES" | grep -c '.' || echo 0)

          gh issue create \
            --repo "$REPO" \
            --title "[mds-change] ${FILE_COUNT}개 spec 변경 — 코드 반영 검토 필요 (${COMMIT_SHA:0:7})" \
            --body "$BODY"
