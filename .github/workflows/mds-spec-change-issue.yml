name: MDS Spec Change → Issue

on:
  push:
    branches: [dev]
    paths:
      - 'apps/mds/docs/public/specs/**'
      - 'apps/mds/docs/src/lib/components.ts'
      - 'apps/mds/docs/src/components/specs/**'

permissions:
  contents: read
  issues: write

jobs:
  file-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Collect changed spec files
        id: collect
        run: |
          # diff against the previous commit on dev (PR merge or direct push)
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- \
            'apps/mds/docs/public/specs/**' \
            'apps/mds/docs/src/lib/components.ts' \
            'apps/mds/docs/src/components/specs/**' || true)

          if [ -z "$CHANGED" ]; then
            echo "no spec files changed"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Build issue body
        if: steps.collect.outputs.skip != 'true'
        id: body
        run: |
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${COMMIT_SHA}"
          COMMIT_MSG=$(git log -1 --pretty=%s "$COMMIT_SHA")
          AUTHOR="${{ github.event.head_commit.author.name }}"

          {
            echo "body<<BODY_EOF"
            echo "## 변경된 mds spec"
            echo ""
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              echo "- \`$f\`"
            done <<< "${{ steps.collect.outputs.files }}"
            echo ""
            echo "## 원인 commit"
            echo ""
            echo "[\`${COMMIT_SHA:0:7}\`]($COMMIT_URL) — $COMMIT_MSG"
            echo "by @$AUTHOR"
            echo ""
            echo "## diff 요약 (최대 200줄)"
            echo ""
            echo '```diff'
            git diff HEAD~1 HEAD -- \
              'apps/mds/docs/public/specs/**' \
              'apps/mds/docs/src/lib/components.ts' \
              'apps/mds/docs/src/components/specs/**' \
              | head -n 200
            echo '```'
            echo ""
            echo "## tpm 트리아지 가이드"
            echo ""
            echo "- spec 변경이 **코드 반영을 요구**하면 → \`needs-swe\` 부여 (본문에 관련 Flutter 위젯 경로 명시)"
            echo "- spec 변경이 **단순 정리/리팩터링**이면 → close"
            echo "- 판단 애매하면 → \`needs-uiux\` 부여 (ux-designer 워커가 drift 분석)"
            echo ""
            echo "## 관련 Flutter 코드 검색 힌트"
            echo ""
            echo '```bash'
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              # spec 파일명에서 화면/컴포넌트 이름 추출
              base=$(basename "$f" .html)
              base=$(basename "$base" .tsx)
              echo "grep -r '$base' apps/app_user/lib/ apps/app_partner/lib/ shared/packages/minglit_kit/lib/"
            done <<< "${{ steps.collect.outputs.files }}"
            echo '```'
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create issue
        if: steps.collect.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          FILE_COUNT=$(echo "${{ steps.collect.outputs.files }}" | grep -c '.' || echo 0)

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "[mds-change] ${FILE_COUNT}개 spec 변경 — 코드 반영 검토 필요 (${COMMIT_SHA:0:7})" \
            --body "${{ steps.body.outputs.body }}"
