name: rc-main-cut-gate

on:
  schedule:
    # 09:00 KST daily.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      rc_branch:
        description: Optional rc branch, e.g. rc/2026-W22. Defaults to latest rc/*.
        required: false
        type: string
      min_soak_days:
        description: Minimum days since the latest RC commit.
        required: false
        type: string
        default: '5'
      dry_run:
        description: Evaluate only; do not write rc-main-cut-pass commit status.
        required: false
        type: boolean
        default: false

concurrency:
  group: rc-main-cut-gate
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  statuses: write
  issues: write

jobs:
  select-rc-candidate:
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.plan.outputs.skipped }}
      reason: ${{ steps.plan.outputs.reason }}
      rc_branch: ${{ steps.plan.outputs.rc_branch }}
      rc_sha: ${{ steps.plan.outputs.rc_sha }}
      min_soak_hours: ${{ steps.plan.outputs.min_soak_hours }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select RC branch
        id: plan
        env:
          REQUESTED_RC_BRANCH: ${{ inputs.rc_branch || '' }}
          MIN_SOAK_DAYS: ${{ inputs.min_soak_days || '5' }}
        run: |
          set -euo pipefail

          if ! [[ "${MIN_SOAK_DAYS}" =~ ^[0-9]+$ ]]; then
            echo "::error::min_soak_days must be a non-negative integer"
            exit 1
          fi

          MIN_SOAK_HOURS="$(( MIN_SOAK_DAYS * 24 ))"
          echo "min_soak_hours=${MIN_SOAK_HOURS}" >> "${GITHUB_OUTPUT}"

          if ! git ls-remote --exit-code --heads origin 'rc/*' >/dev/null 2>&1; then
            echo "No rc/* branch exists; skipping."
            echo "skipped=true" >> "${GITHUB_OUTPUT}"
            echo "reason=no rc branch exists" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git fetch origin '+refs/heads/rc/*:refs/remotes/origin/rc/*' --force

          RC_BRANCH="${REQUESTED_RC_BRANCH}"
          if [ -z "${RC_BRANCH}" ]; then
            RC_BRANCH="$(git for-each-ref \
              --sort=-committerdate \
              --format='%(refname:short)' \
              refs/remotes/origin/rc | sed 's#^origin/##' | head -n 1)"
          fi

          if [ -z "${RC_BRANCH}" ]; then
            echo "No rc/* branch exists; skipping."
            echo "skipped=true" >> "${GITHUB_OUTPUT}"
            echo "reason=no rc branch selected" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if ! [[ "${RC_BRANCH}" =~ ^rc/[0-9]{4}-W[0-9]{2}$ ]]; then
            echo "::error::Invalid rc_branch: ${RC_BRANCH}. Expected rc/YYYY-Www."
            exit 1
          fi

          RC_REF="origin/${RC_BRANCH}"
          if ! git rev-parse -q --verify "${RC_REF}^{commit}" >/dev/null; then
            echo "::error::RC branch ${RC_BRANCH} not found on origin."
            exit 1
          fi

          echo "skipped=false" >> "${GITHUB_OUTPUT}"
          echo "reason=selected" >> "${GITHUB_OUTPUT}"
          echo "rc_branch=${RC_BRANCH}" >> "${GITHUB_OUTPUT}"
          echo "rc_sha=$(git rev-parse "${RC_REF}")" >> "${GITHUB_OUTPUT}"

  evaluate-rc-soak:
    name: evaluate-rc-soak
    needs: [select-rc-candidate]
    if: needs.select-rc-candidate.outputs.skipped != 'true'
    uses: ./.github/workflows/shared-soak-gate.yml
    with:
      candidate_ref: ${{ needs.select-rc-candidate.outputs.rc_branch }}
      candidate_sha: ${{ needs.select-rc-candidate.outputs.rc_sha }}
      min_soak_hours: ${{ needs.select-rc-candidate.outputs.min_soak_hours }}
      failure_contexts: |
        rc-soak/backend-simulator
        rc-soak/real-device
        rc-soak/dogfooding
      pass_context: rc-main-cut-pass
      pass_description: 'rc-main-cut-gate passed; this RC can be promoted to main'
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

  track-cut-gate:
    needs: [select-rc-candidate, evaluate-rc-soak]
    if: needs.select-rc-candidate.outputs.skipped != 'true' && needs.evaluate-rc-soak.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Track rc -> main cut gate
        uses: ./.github/actions/cut-issue
        with:
          github-token: ${{ github.token }}
          operation: upsert
          gate-key: rc-main
          subject-id: ${{ needs.select-rc-candidate.outputs.rc_branch }}
          title: 'cut-gate(rc-main): ${{ needs.select-rc-candidate.outputs.rc_branch }}'
          status: ${{ needs.evaluate-rc-soak.outputs.skipped == 'true' && 'waiting' || 'ready' }}
          summary: 'rc -> main cut gate evaluated `${{ needs.select-rc-candidate.outputs.rc_branch }}`.'
          details: |
            - RC branch: `${{ needs.select-rc-candidate.outputs.rc_branch }}`
            - Candidate SHA: `${{ needs.select-rc-candidate.outputs.rc_sha }}`
            - Minimum soak hours: `${{ needs.select-rc-candidate.outputs.min_soak_hours }}`
            - Gate skipped: `${{ needs.evaluate-rc-soak.outputs.skipped }}`
            - Reason: `${{ needs.evaluate-rc-soak.outputs.reason }}`
            - Dry run: `${{ inputs.dry_run || false }}`
            - Next workflow: `rc-main-cut`

  notify-failure:
    needs: [select-rc-candidate, evaluate-rc-soak, track-cut-gate]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
      statuses: write
    uses: ./.github/workflows/shared-notify.yml
    with:
      failed: >-
        ${{
          needs.select-rc-candidate.result != 'success' ||
          (
            needs.select-rc-candidate.outputs.skipped != 'true' &&
            needs.evaluate-rc-soak.result != 'success'
          )
        }}
      workflow_name: 'RC Main Cut Gate'
      severity: 'P1-high'
      job_results: '{"select-rc-candidate":"${{ needs.select-rc-candidate.result }}","evaluate-rc-soak":"${{ needs.evaluate-rc-soak.result }}","skipped":"${{ needs.select-rc-candidate.outputs.skipped || needs.evaluate-rc-soak.outputs.skipped }}","reason":"${{ needs.select-rc-candidate.outputs.reason || needs.evaluate-rc-soak.outputs.reason }}","rc_branch":"${{ needs.select-rc-candidate.outputs.rc_branch }}","candidate_sha":"${{ needs.select-rc-candidate.outputs.rc_sha }}"}'
    secrets: inherit
