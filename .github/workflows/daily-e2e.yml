name: Daily Client CUJ Integration Tests

on:
  schedule:
    - cron: '0 22 * * *'  # Daily KST 07:00 (UTC 22:00) — runs on default branch (dev)
  workflow_dispatch:       # Manual trigger

concurrency:
  group: daily-client-cuj-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-cuj-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get
        working-directory: tests/client_cuj_integration

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run CUJ Integration Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: tests/client_cuj_integration
          script: |
            # Fix #259: android-emulator-runner executes each line as separate sh -c call,
            # so the for-loop must be a single line to avoid "expecting done" syntax error
            DART_DEFINES="--dart-define=SUPABASE_URL=${{ secrets.SUPABASE_DEV_URL }} --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }} --dart-define=SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_DEV_SECRET_KEY }}"
            for test_file in integration_test/cuj/*_test.dart; do echo "▶ Running $test_file" && flutter test "$test_file" --reporter expanded $DART_DEFINES || exit 1; done

  notify-failure:
    needs: [client-cuj-test]
    if: always()
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      success: ${{ needs.client-cuj-test.result == 'success' }}
      workflow_name: 'Daily Client CUJ'
