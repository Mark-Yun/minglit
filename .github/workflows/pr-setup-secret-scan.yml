name: pr-setup-secret-scan

on:
  pull_request:
    branches: [ "main", "dev" ]

concurrency:
  group: pr-setup-secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: [self-hosted, ephemeral]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Self-hosted ephemeral runners execute as root with HOME=/root, which
          # doesn't share a parent with $GITHUB_WORKSPACE (/tmp/minglit-runner-*/...).
          # @actions/artifact rejects the resulting rootDirectory/file pair with
          # "rootDirectory: /root is not a parent directory of ... results.sarif".
          # The scan itself succeeds; only the artifact upload trips, so disable it.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  notify-failure:
    needs: [gitleaks]
    # Fix #563, #564: Only notify on actual failure, not on cancelled (from cancel-in-progress)
    if: ${{ always() && needs.gitleaks.result == 'failure' }}
    permissions:
      issues: write
    uses: ./.github/workflows/shared-notify.yml
    with:
      success: false
      workflow_name: 'pr-setup-secret-scan'
      # Fix #976: PR-triggered workflows should not create P0 noise issues
      create_issue: false