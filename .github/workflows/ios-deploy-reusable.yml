name: iOS Deploy (Reusable)

on:
  workflow_call:
    inputs:
      app-name:
        description: 'App name (user or partner)'
        required: true
        type: string
      app-directory:
        description: 'App directory (e.g., apps/app_user)'
        required: true
        type: string
      bundle-id:
        description: 'iOS Bundle ID'
        required: true
        type: string
      provisioning-profile-dev-specifier:
        description: 'DEV Provisioning Profile Specifier name'
        required: true
        type: string
      provisioning-profile-prod-specifier:
        description: 'Production Provisioning Profile Specifier name'
        required: true
        type: string
      development-team:
        description: 'Apple Development Team ID'
        required: false
        type: string
        default: 'TAY59SLH9F'
    secrets:
      APPLE_CERTIFICATE_BASE64:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_PROVISION_PROFILE_DEV_BASE64:
        required: true
      APPLE_PROVISION_PROFILE_PROD_BASE64:
        required: true
      APP_STORE_CONNECT_API_KEY_BASE64:
        required: true
      APP_STORE_CONNECT_API_KEY_ID:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true
      SUPABASE_DEV_URL:
        required: true
      SUPABASE_DEV_PUBLISHABLE_KEY:
        required: true
      KAKAO_LOCAL_REST_API_KEY:
        required: true
      SENTRY_DSN_FLUTTER:
        required: true
      SUPABASE_MAIN_URL:
        required: true
      SUPABASE_MAIN_PUBLISHABLE_KEY:
        required: true

jobs:
  ios-deploy:
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    defaults:
      run:
        working-directory: ./${{ inputs.app-directory }}
    env:
      BUNDLE_ID: ${{ inputs.bundle-id }}
      KEYCHAIN_NAME: ci-signing.keychain-db
      DERIVED_DATA_PATH: ~/Library/Developer/Xcode/DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ${{ inputs.app-directory }}/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles(format('{0}/ios/Podfile.lock', inputs.app-directory)) }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA_PATH }}
          key: ${{ runner.os }}-deriveddata-${{ hashFiles(format('{0}/ios/Podfile.lock', inputs.app-directory), format('{0}/ios/Runner.xcodeproj/project.pbxproj', inputs.app-directory)) }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Install CocoaPods
        run: pod install
        working-directory: ./${{ inputs.app-directory }}/ios

      - name: Set Dev Bundle ID
        if: ${{ github.ref == 'refs/heads/dev' }}
        run: |
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = ${{ inputs.bundle-id }};/PRODUCT_BUNDLE_IDENTIFIER = ${{ inputs.bundle-id }}.dev;/g" ios/Runner.xcodeproj/project.pbxproj

      - name: Generate keychain password
        run: echo "KEYCHAIN_PASSWORD=$(uuidgen)" >> $GITHUB_ENV

      - name: Create keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" login.keychain-db

      - name: Import signing certificate
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > signing.p12
          security import signing.p12 -k "$KEYCHAIN_NAME" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          rm -f signing.p12
          echo "=== Keychain search list ==="
          security list-keychains -d user
          echo "=== Identities in CI keychain ==="
          security find-identity -v -p codesigning "$KEYCHAIN_NAME" || true
          echo "=== All codesigning identities ==="
          security find-identity -v -p codesigning || true
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            PROFILE_B64="$APPLE_PROVISION_PROFILE_DEV_BASE64"
          else
            PROFILE_B64="$APPLE_PROVISION_PROFILE_PROD_BASE64"
          fi
          echo "$PROFILE_B64" | base64 --decode > profile.mobileprovision
          profile_uuid=$(grep -a -A1 UUID profile.mobileprovision | grep -o '[-a-f0-9]\{36\}')
          echo "Provisioning Profile UUID: $profile_uuid"
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$profile_uuid.mobileprovision
          rm -f profile.mobileprovision
        env:
          APPLE_PROVISION_PROFILE_DEV_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_DEV_BASE64 }}
          APPLE_PROVISION_PROFILE_PROD_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_PROD_BASE64 }}

      - name: Create App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}

      - name: Configure manual signing
        run: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"

          # Remove conflicting settings from project.pbxproj to let xcconfig take precedence
          sed -i '' '/CODE_SIGN_IDENTITY/d' "$PBXPROJ"
          sed -i '' '/CODE_SIGN_STYLE/d' "$PBXPROJ"
          sed -i '' '/DEVELOPMENT_TEAM/d' "$PBXPROJ"
          sed -i '' '/PROVISIONING_PROFILE_SPECIFIER/d' "$PBXPROJ"

          # Select provisioning profile specifier based on branch
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            PROFILE_SPECIFIER="${{ inputs.provisioning-profile-dev-specifier }}"
          else
            PROFILE_SPECIFIER="${{ inputs.provisioning-profile-prod-specifier }}"
          fi

          # Create xcconfig with correct settings
          cat > ios/CI.xcconfig << EOF
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          DEVELOPMENT_TEAM = ${{ inputs.development-team }}
          PROVISIONING_PROFILE_SPECIFIER = $PROFILE_SPECIFIER
          EOF

          # Include in Release.xcconfig
          echo '#include "../CI.xcconfig"' >> ios/Flutter/Release.xcconfig

          echo "=== Verify project.pbxproj cleaned ==="
          grep -E "CODE_SIGN|DEVELOPMENT_TEAM" "$PBXPROJ" || echo "Cleaned successfully"
          echo "=== CI.xcconfig content ==="
          cat ios/CI.xcconfig

      - name: Build IPA (Dev)
        if: ${{ github.ref == 'refs/heads/dev' }}
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions-dev.plist \
            --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_DEV_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }} \
            --dart-define=KAKAO_LOCAL_REST_API_KEY=${{ secrets.KAKAO_LOCAL_REST_API_KEY }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN_FLUTTER }} \
            --dart-define=ENVIRONMENT=development

      - name: Build IPA (Main)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist \
            --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_MAIN_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_MAIN_PUBLISHABLE_KEY }} \
            --dart-define=KAKAO_LOCAL_REST_API_KEY=${{ secrets.KAKAO_LOCAL_REST_API_KEY }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN_FLUTTER }} \
            --dart-define=ENVIRONMENT=production

      - name: Upload to App Store Connect (TestFlight/App Store)
        run: |
          xcrun altool --upload-app --type ios --file build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Cleanup keychain
        if: ${{ always() }}
        run: security delete-keychain "$KEYCHAIN_NAME"
