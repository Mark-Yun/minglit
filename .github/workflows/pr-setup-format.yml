name: pr-setup-format

on:
  pull_request:
    branches: ["main", "dev"]
    types: [opened, synchronize, reopened]
    # auto-format only runs `dart format` on apps/* and shared/packages/minglit_kit.
    # PRs that don't touch .dart files (docs, workflow YAML, mds-render specs,
    # graphify output, migration SQL, ...) had nothing to format and were
    # spending ~3min on Flutter setup + pub get + zero-diff format. Filter
    # at the trigger level so we skip the runner entirely.
    paths:
      - '**/*.dart'

concurrency:
  group: pr-setup-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  auto-format:
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    runs-on: [self-hosted, ephemeral]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          # persist-credentials: false keeps the PAT out of git config during
          # pub get and dart fix/format steps; injected only in the push step.
          persist-credentials: false

      # Flutter SDK + pub-cache come from a host bind volume on the
      # self-hosted runner (see minglit-github-workflow-runner:
      # systemd/minglit-runner@.service), so the action's own
      # `cache: true` and the explicit actions/cache@v5 for ~/.pub-cache
      # are redundant and add round-trip latency. Default `cache: false`
      # lets the action detect the existing toolcache and skip download.
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Minglit Kit - Format
        run: dart format .
        working-directory: shared/packages/minglit_kit

      - name: App User - Format
        run: dart format .
        working-directory: apps/app_user

      - name: App Partner - Format
        run: dart format .
        working-directory: apps/app_partner

      - name: Commit changes if needed
        env:
          # PAT injected only here, not during pub get/dart format above.
          GH_PAT: ${{ secrets.GH_PAT_VERSION_BUMP }}
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -- '**/*.dart'
            git commit -m "chore: auto-format"
            git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"
            git push
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            echo "No formatting changes needed"
          fi

  notify-failure:
    needs: [auto-format]
    # Fix #563: Only notify on actual failure, not on cancelled (from cancel-in-progress)
    if: ${{ always() && needs.auto-format.result == 'failure' }}
    permissions:
      issues: write
    uses: ./.github/workflows/shared-notify.yml
    with:
      success: false
      workflow_name: 'pr-setup-format'
      # Fix #976: PR-triggered workflows should not create P0 noise issues
      create_issue: false