name: Deploy to Vercel

# NOTE: Consider adding status badges to README.

on:
  push:
    branches: [ "main", "dev" ]

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 변경 사항 감지
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app_user: ${{ steps.filter.outputs.app_user }}
      app_partner: ${{ steps.filter.outputs.app_partner }}
      landing_user: ${{ steps.filter.outputs.landing_user }}
      landing_partner: ${{ steps.filter.outputs.landing_partner }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          app_user:
            - 'apps/app_user/**'
            - 'shared/packages/minglit_kit/**'
          app_partner:
            - 'apps/app_partner/**'
            - 'shared/packages/minglit_kit/**'
          landing_user:
            - 'apps/landing_user/**'
            - 'shared/web/**'
          landing_partner:
            - 'apps/landing_partner/**'
            - 'shared/web/**'

  deploy-app_user:
    needs: changes
    if: ${{ needs.changes.outputs.app_user == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy User App
        uses: ./.github/actions/deploy-flutter-app
        with:
          working-directory: ./apps/app_user
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_USER }}
          dev-domain-alias: dev.app.minglit.com
        env:
          SUPABASE_DEV_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_DEV_KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
          GOOGLE_DEV_ID: ${{ secrets.GOOGLE_DEV_WEB_CLIENT_ID }}
          SUPABASE_MAIN_URL: ${{ secrets.SUPABASE_MAIN_URL }}
          SUPABASE_MAIN_KEY: ${{ secrets.SUPABASE_MAIN_PUBLISHABLE_KEY }}
          GOOGLE_MAIN_ID: ${{ secrets.GOOGLE_MAIN_WEB_CLIENT_ID }}
          SENTRY_DSN_FLUTTER: ${{ secrets.SENTRY_DSN_FLUTTER }}

  deploy-landing_user:
    needs: changes
    if: ${{ needs.changes.outputs.landing_user == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy User Landing
        uses: ./.github/actions/deploy-nextjs-app
        with:
          working-directory: ./apps/landing_user
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_LANDING_USER }}

  deploy-landing_partner:
    needs: changes
    if: ${{ needs.changes.outputs.landing_partner == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Partner Landing
        uses: ./.github/actions/deploy-nextjs-app
        with:
          working-directory: ./apps/landing_partner
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_LANDING_PARTNER }}

  deploy-app_partner:
    needs: changes
    if: ${{ needs.changes.outputs.app_partner == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Partner App
        uses: ./.github/actions/deploy-flutter-app
        with:
          working-directory: ./apps/app_partner
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_PARTNER }}
          dev-domain-alias: dev.app.partner.minglit.com
        env:
          SUPABASE_DEV_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_DEV_KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
          GOOGLE_DEV_ID: ${{ secrets.GOOGLE_DEV_WEB_CLIENT_ID }}
          SUPABASE_MAIN_URL: ${{ secrets.SUPABASE_MAIN_URL }}
          SUPABASE_MAIN_KEY: ${{ secrets.SUPABASE_MAIN_PUBLISHABLE_KEY }}
          GOOGLE_MAIN_ID: ${{ secrets.GOOGLE_MAIN_WEB_CLIENT_ID }}
          SENTRY_DSN_FLUTTER: ${{ secrets.SENTRY_DSN_FLUTTER }}

  notify-failure:
    needs: [changes, deploy-app_user, deploy-landing_user, deploy-landing_partner, deploy-app_partner]
    if: always()
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      success: ${{ !contains(needs.*.result, 'failure') }}
      workflow_name: 'Vercel Deploy'