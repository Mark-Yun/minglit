name: iOS User App Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "apps/app_user/**"
      - "shared/packages/minglit_kit/**"
      - "pubspec.yaml"
  schedule:
    - cron: '0 10 * * *'  # Daily dev build (KST 19:00) — runs on default branch (dev)
  workflow_dispatch:

concurrency:
  group: ios-user-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-deploy:
    uses: ./.github/workflows/ios-deploy-reusable.yml
    with:
      app-name: user
      app-directory: apps/app_user
      bundle-id: com.minglit.appUser
      provisioning-profile-dev-specifier: Minglit User App DEV Profile
      provisioning-profile-prod-specifier: Minglit User App Store Profile
    secrets:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISION_PROFILE_DEV_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_USER_DEV_BASE64 }}
      APPLE_PROVISION_PROFILE_PROD_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_USER_BASE64 }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      SUPABASE_DEV_URL: ${{ secrets.SUPABASE_DEV_URL }}
      SUPABASE_DEV_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
      KAKAO_LOCAL_REST_API_KEY: ${{ secrets.KAKAO_LOCAL_REST_API_KEY }}
      SENTRY_DSN_FLUTTER: ${{ secrets.SENTRY_DSN_FLUTTER }}
      SUPABASE_MAIN_URL: ${{ secrets.SUPABASE_MAIN_URL }}
      SUPABASE_MAIN_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_MAIN_PUBLISHABLE_KEY }}

  notify-failure:
    needs: [ios-deploy]
    if: always()
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      success: ${{ needs.ios-deploy.result == 'success' }}
      workflow_name: 'iOS Deploy User'
      job_results: '{"ios-deploy":"${{ needs.ios-deploy.result }}"}'