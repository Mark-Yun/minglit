name: Golden Test Check (post-merge)

on:
  push:
    branches: [dev]
    paths:
      - 'apps/app_user/**'
      - 'apps/app_partner/**'
      - 'shared/packages/minglit_kit/**'

jobs:
  golden-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: shared/packages/minglit_kit
            app: minglit_kit
          - directory: apps/app_user
            app: app_user
          - directory: apps/app_partner
            app: app_partner
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: ${{ matrix.directory }}

      - name: Compare CI goldens
        id: compare
        continue-on-error: true
        run: |
          set +e
          flutter test --dart-define=CI=true --tags golden
          rc=$?
          set -e
          if [ "$rc" -eq 79 ]; then
            echo "result=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "result=mismatch" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "result=pass" >> "$GITHUB_OUTPUT"
        working-directory: ${{ matrix.directory }}

      - name: Upload golden failures
        if: ${{ steps.compare.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: golden-failures-${{ matrix.app }}
          path: ${{ matrix.directory }}/test/**/failures/
          retention-days: 14

      - name: Regenerate and commit goldens
        if: ${{ steps.compare.outcome == 'failure' }}
        run: |
          set +e
          flutter test --dart-define=CI=true --tags golden --update-goldens
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 79 ]; then exit "$rc"; fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '**/goldens/ci/**'
          if git diff --cached --quiet; then
            echo "No golden changes after regeneration"
          else
            git commit -m "chore(golden): update ${{ matrix.app }} CI goldens on Linux [skip ci]"
            git pull --rebase origin dev
            git push origin HEAD:dev
          fi
        working-directory: ${{ matrix.directory }}

      - name: Create issue for golden drift
        if: ${{ steps.compare.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🎨 Golden drift detected: ${{ matrix.app }}" \
            --label "ci-failure" \
            --body "$(cat <<EOF
          ## Golden Test Mismatch

          **App**: \`${{ matrix.app }}\`
          **Commit**: ${{ github.sha }}
          **Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          CI goldens (Linux) differ from committed goldens.
          Auto-regenerated and committed. Please verify the changes are intentional.

          **Artifacts**: Check \`golden-failures-${{ matrix.app }}\` artifact for diff images.
          EOF
          )"
