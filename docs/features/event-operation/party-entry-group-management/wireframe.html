<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Entry Group Management Wireframe</title>
    <style>
        :root {
            --primary-color: #0D47A1;
            --surface-color: #FFFFFF;
            --background-color: #F5F5F5;
            --outline-color: #E0E0E0;
            --text-primary: #212121;
            --text-secondary: #757575;
            --spacing-large: 24px;
            --spacing-medium: 16px;
            --spacing-small: 8px;
            --radius-card: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .phone-mockup {
            width: 375px;
            height: 812px;
            background-color: var(--surface-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .app-bar {
            height: 56px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--outline-color);
        }

        .app-bar .back-icon {
            font-size: 24px;
            margin-right: 16px;
        }

        .app-bar .title {
            font-size: 18px;
            font-weight: bold;
        }

        .content {
            flex: 1;
            padding: var(--spacing-large);
            overflow-y: auto;
        }

        .add-card {
            background-color: #F1F4F9;
            border: 1px dashed var(--primary-color);
            border-radius: var(--radius-card);
            padding: var(--spacing-medium);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            margin-bottom: var(--spacing-large);
        }

        .add-card .title {
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 4px;
        }

        .add-card .subtitle {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .section-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-medium);
            font-weight: 500;
        }

        .entry-card {
            border: 1px solid var(--outline-color);
            border-radius: var(--radius-card);
            padding: var(--spacing-medium);
            margin-bottom: var(--spacing-medium);
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--surface-color);
        }

        .entry-info {
            flex: 1;
        }

        .entry-info .group-label {
            font-size: 12px;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 8px;
        }

        .entry-info .detail-item {
            font-size: 14px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
        }

        .entry-info .detail-item .icon {
            width: 16px;
            height: 16px;
            background-color: #EEE;
            border-radius: 50%;
            margin-right: 8px;
            display: inline-block;
        }

        .card-actions {
            display: flex;
            align-items: center;
        }

        .delete-btn {
            color: var(--text-secondary);
            font-size: 20px;
            padding: 8px;
            cursor: pointer;
            position: absolute;
            top: 8px;
            right: 8px;
        }

        .chevron {
            color: var(--outline-color);
            font-size: 24px;
            margin-left: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="phone-mockup">
        <div class="app-bar">
            <span class="back-icon">←</span>
            <span class="title">입장 조건 관리</span>
        </div>
        <div class="content">
            <div class="add-card">
                <span class="title">+ 새로운 입장 조건 추가</span>
                <span class="subtitle">우리 가게만의 특별한 조건을 만들어보세요</span>
            </div>

            <div class="section-title">설정된 입장 조건 (2)</div>

            <div class="entry-card">
                <div class="delete-btn">×</div>
                <div class="entry-info">
                    <div class="group-label">조건 1</div>
                    <div class="detail-item"><span class="icon"></span>20~29세 (남성)</div>
                    <div class="detail-item"><span class="icon"></span>신규 유저만 가능</div>
                </div>
                <div class="chevron">›</div>
            </div>

            <div class="entry-card">
                <div class="delete-btn">×</div>
                <div class="entry-info">
                    <div class="group-label">조건 2</div>
                    <div class="detail-item"><span class="icon"></span>25~35세 (여성)</div>
                    <div class="detail-item"><span class="icon"></span>재방문 유저 환영</div>
                </div>
                <div class="chevron">›</div>
            </div>
        </div>
    </div>
</body>
</html>
