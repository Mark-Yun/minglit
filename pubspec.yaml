name: minglit_workspace
description: Minglit Monorepo Workspace
environment:
  sdk: ^3.6.0

workspace:
  - apps/app_partner
  - apps/app_user
  - shared/packages/mds/core
  - shared/packages/mds/icons
  - shared/packages/mds/tokens
  - shared/packages/minglit_demo
  - shared/packages/minglit_kit
  - shared/packages/minglit_lints

dependency_overrides:
  iamport_webview_flutter: 3.1.0
  # connectivity_plus 7.1.x requires Xcode 26.1.1 for NWPath.isUltraConstrained.
  # GitHub macos-15 runners currently compile with an older SDK.
  connectivity_plus: 6.1.5

dev_dependencies:
  custom_lint: 0.8.1
  minglit_lints:
    path: shared/packages/minglit_lints
